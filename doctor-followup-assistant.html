<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azaad Clinic — Doctor Follow-up Assistant</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}.muted{color:#697386}.q{padding:14px;border:1px solid #e3e7ee;border-radius:12px;margin:10px 0}.tag{display:inline-block;background:#eef2ff;padding:5px 9px;border-radius:99px;margin:3px}button{border:0;border-radius:10px;padding:10px 14px;background:#172033;color:#fff;cursor:pointer}</style></head><body><div class="wrap"><div class="card"><h1>🤖 مساعد متابعة الطبيب</h1><p class="muted">اقتراحات مساعدة مبنية على سجل التقييمات. لا تُعد تشخيصًا أو قرارًا علاجيًا.</p><button onclick="loadHistory()">🔄 تحليل سجل المريض</button></div><div class="card"><h2>📈 ملخص الاتجاه</h2><div id="summary">—</div></div><div class="card"><h2>🧠 أسئلة متابعة مقترحة</h2><div id="questions">اضغط تحليل سجل المريض.</div></div></div><script>const FN='https://derofsthjivlkcdnojww.supabase.co/functions/v1/azaad-clinical-assessments';const p=new URLSearchParams(location.search).get('patient_id')||'';function esc(x){return String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function loadHistory(){if(!p){document.getElementById('summary').textContent='Patient ID غير موجود في الرابط.';return}const token=localStorage.getItem('supabase.auth.token')||localStorage.getItem('access_token')||'';try{const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action:'history',patient_id:p})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر التحميل');const rows=d.sessions||d.history||[];if(!rows.length){document.getElementById('summary').textContent='لا توجد تقييمات سابقة.';document.getElementById('questions').innerHTML='<div class="muted">لا توجد بيانات كافية لاقتراح أسئلة.</div>';return}const vals=rows.map(x=>Number(x.score_percent)).filter(Number.isFinite);const last=vals[0],prev=vals[1];let trend='مستقر';if(prev!=null&&last>prev)trend='ارتفاع في الدرجة';if(prev!=null&&last<prev)trend='انخفاض في الدرجة';document.getElementById('summary').innerHTML=`آخر نتيجة: <b>${last.toFixed(1)}%</b> <span class="tag">${trend}</span><p class="muted">يجب تفسير الاتجاه مع نوع المقياس والسياق السريري، وليس كنسبة تحسن تلقائية.</p>`;const qs=['كيف كانت الأعراض الرئيسية منذ الزيارة السابقة؟','هل حدث تغير في النوم أو الشهية أو الطاقة؟','هل التزم المريض بالخطة العلاجية المتفق عليها؟','هل ظهرت آثار جانبية أو صعوبات في الالتزام؟','هل طرأت ضغوط أو أحداث جديدة قد تؤثر في الحالة؟','هل توجد أي مخاوف تتعلق بالسلامة تستلزم تقييمًا سريريًا مباشرًا؟'];document.getElementById('questions').innerHTML=qs.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q)}</b><div class="muted">سؤال متابعة مقترح — القرار النهائي للطبيب.</div></div>`).join('')}catch(e){document.getElementById('summary').textContent='خطأ: '+e.message}}</script></body></html>
