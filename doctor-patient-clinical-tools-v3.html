<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azaad Clinic — Doctor Clinical Tools</title></head><body><main><h1>👨‍⚕️ أدوات المريض السريرية</h1><p>الصلاحيات تأتي مباشرة من Supabase قبل إظهار الأدوات.</p><input id="pid" placeholder="Patient ID / UUID"><button onclick="go()">فتح الأدوات</button><div id="status"></div><div id="tools"></div></main><script src="patient-session-bridge-v3.js"></script><script src="doctor-clinical-permission-gate.js"></script><script>const items=[['clinical_assessment','🧠','Clinical Assessment','clinical-assessment.html'],['clinical_assessment_history','📈','Assessment History','clinical-assessment-history.html'],['clinical_safety','🚨','Clinical Safety','clinical-record.html'],['clinical_assessment','🩺','Clinical Record','clinical-record.html'],['clinical_assessment','🤖','Follow-up Assistant','doctor-followup-assistant.html']];async function go(){const id=document.getElementById('pid').value.trim(),s=document.getElementById('status'),o=document.getElementById('tools');if(!id)return;s.textContent='🔐 جارٍ التحقق...';try{const p=await AZAAD_CLINICAL_PERMISSION_GATE.get();const a=items.filter(x=>p[x[0]]===true);o.innerHTML=a.map(x=>`<a href="${x[3]}?patient_id=${encodeURIComponent(id)}"><h2>${x[1]} ${x[2]}</h2></a>`).join('')||'🙅‍♀️ لا توجد صلاحية';s.textContent='✅ تم تطبيق صلاحيات Supabase.'}catch(e){o.textContent='🔐 '+e.message;s.textContent=''}}</script></body></html>
