<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azaad Clinical Question Bank</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#17212b}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 24px #0000000b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8dee7;border-radius:10px}button{border:0;border-radius:11px;padding:11px 16px;cursor:pointer}.primary{background:#1f7a54;color:white}.danger{background:#ffe2e2}.muted{color:#667085}.q{border:1px solid #e5e9ef;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}</style></head><body><main class="wrap"><div class="row"><h1>🧠 بنك الأسئلة السريري</h1><button onclick="location.href='clinical-record.html'">↩️ ملف المريض</button></div><div class="card"><p class="muted">هذا البنك لإدارة أسئلة المقابلة السريرية. الأسئلة المعيارية يجب أن تبقى بإصدارها وطريقة تسجيلها الأصلية، ولا تُعامل أسئلة العيادة كاختبار تشخيصي مُعتمد.</p><div class="grid"><div><label>البحث</label><input id="search" placeholder="بحث في الأسئلة" oninput="render()"></div><div><label>التخصص</label><select id="category" onchange="render()"><option value="">كل التصنيفات</option><option>mood</option><option>sleep</option><option>functioning</option><option>anxiety</option><option>treatment_adherence</option><option>substance_use</option><option>safety</option><option>improvement</option><option>worsening</option><option>follow_up</option></select></div></div></div><div class="card"><h2>➕ إضافة سؤال</h2><div class="grid"><input id="ar" placeholder="السؤال بالعربية"><input id="en" placeholder="Question in English"><input id="cat" placeholder="التصنيف"><input id="source" placeholder="اسم المصدر"><input id="url" placeholder="رابط المصدر"></div><br><textarea id="expl" placeholder="ملاحظة/تفسير سريري"></textarea><br><button class="primary" onclick="addQuestion()">إضافة</button><span id="msg" class="muted"></span></div><div class="card"><h2>📚 الأسئلة الحالية</h2><div id="list">جارٍ التحميل…</div></div></main><script>const API='/functions/v1/azaad-clinical-assessments';let questions=[];let templateId=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{let r=await fetch(API+'?action=question_bank',{credentials:'include'});let d=await r.json();questions=d.questions||[];templateId=d.template_id||questions[0]?.template_id;render()}catch(e){list.innerHTML='<p>'+esc(e.message)+'</p>'}}function render(){let s=(search.value||'').toLowerCase(),c=category.value;let a=questions.filter(q=>(!s||((q.question_text||'')+' '+(q.question_text_ar||'')).toLowerCase().includes(s))&&(!c||q.category===c));list.innerHTML=a.map(q=>'<div class="q"><b>'+esc(q.question_text_ar||q.question_text)+'</b><p class="muted">'+esc(q.question_text)+' · '+esc(q.category||'')+'</p><small>'+esc(q.source_title||'')+'</small><div class="row"><span>'+ (q.active?'🟢 Active':'🔴 Disabled')+'</span><button class="danger" onclick="disableQuestion(\''+q.id+'\')">🗑️ تعطيل</button></div></div>').join('')||'<p class="muted">لا توجد نتائج.</p>'}async function addQuestion(){msg.textContent='جارٍ الحفظ…';try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({action:'add_question',template_id:templateId,question_text:en.value,question_text_ar:ar.value,category:cat.value,response_type:'boolean',explanation:expl.value,source_title:source.value,source_url:url.value})});let d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');msg.textContent='✅ تمت الإضافة';await load()}catch(e){msg.textContent='❌ '+e.message}}async function disableQuestion(id){if(!confirm('تعطيل السؤال؟'))return;let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({action:'disable_question',question_id:id})});if(!r.ok)alert('تعذر تعطيل السؤال');await load()}load();</script></body></html>
