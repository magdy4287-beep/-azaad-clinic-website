<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Azaad Clinic — Clinical Assessment</title>
  <style>
    :root{--ink:#17214f;--muted:#667085;--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--ok:#16834b;--warn:#b7791f;--danger:#c53030}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{max-width:980px;margin:0 auto;padding:20px}.head,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 24px #17214f0b}.head{padding:20px;margin-bottom:16px}.brand{font-size:13px;font-weight:800;color:#667085}.title{font-size:28px;font-weight:950;color:var(--ink);margin:4px 0}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{padding:6px 10px;border-radius:999px;background:#eef2ff}.card{padding:18px;margin-bottom:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:850;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eef2f7;color:#172033}.success{background:#16834b;color:#fff}.danger{background:#fff0f0;color:#a22}.question{border-top:1px solid var(--line);padding:16px 0}.question:first-child{border-top:0}.qtitle{font-weight:850;margin-bottom:10px}.qmeta{font-size:12px;color:var(--muted);margin-bottom:9px}.options{display:flex;gap:8px;flex-wrap:wrap}.option{border:1px solid #d8dce5;border-radius:10px;padding:9px 12px;background:#fff;cursor:pointer}.option:has(input:checked){border-color:#5261ad;background:#eef2ff}.notes{width:100%;min-height:100px;border:1px solid #d8dce5;border-radius:12px;padding:12px;font:inherit;resize:vertical}.status{margin-top:12px;padding:10px;border-radius:10px;background:#f2f4f7;color:#475467}.status.ok{background:#ecfdf3;color:#067647}.status.err{background:#fff1f2;color:#b42318}.loading{text-align:center;padding:30px;color:var(--muted)}
  </style>
</head>
<body>
<div class="wrap">
  <section class="head"><div class="brand">🏥 AZAAD CLINIC · DOCTOR WORKFLOW</div><div class="title">🩺 Clinical Assessment</div><div class="meta" id="meta"></div></section>
  <section class="card"><div class="toolbar"><label><strong>🧠 Assessment:</strong> <select id="template" style="padding:10px;border:1px solid #d8dce5;border-radius:10px;min-width:260px"></select></label><button class="btn secondary" id="historyBtn" type="button">📋 History</button><button class="btn primary" id="loadBtn" type="button">🔄 Load</button></div><div id="status" class="status">جاهز لبدء التقييم.</div></section>
  <form class="card" id="form"><div id="questions" class="loading">جاري تحميل الأسئلة…</div><div style="margin-top:12px"><label><strong>📝 ملاحظات الطبيب / Clinician Notes</strong><textarea class="notes" id="notes" placeholder="Clinical notes..."></textarea></label></div><div class="toolbar" style="margin-top:14px"><button class="btn success" type="submit">💾 حفظ التقييم</button><button class="btn secondary" type="button" id="backBtn">↩️ العودة للطبيب</button></div></form>
  <section class="card" id="history" hidden><h3>📋 Assessment History</h3><div id="historyList"></div></section>
</div>
<script>
(() => {'use strict';
  const API='https://derofsthjivlkcdnojww.supabase.co/functions/v1/azaad-clinical-assessments'; const KEY='sb_publishable_GC253fvQebNBsDOaKjWGRw_tPYJrgLa'; const qs=new URLSearchParams(location.search); const bookingId=qs.get('booking_id')||''; const patientId=qs.get('patient_id')||''; const visitId=qs.get('visit_id')||''; const state={templates:[],questions:[]}; const $=id=>document.getElementById(id); const token=async()=>window.AZAAD?.state?.session?.access_token||sessionStorage.getItem('azaad_admin_token')||((await window.supabase?.auth?.getSession?.())?.data?.session?.access_token)||''; const tr=(ar,en)=>(document.documentElement.lang||'ar').startsWith('en')?en:ar; const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
  function setStatus(msg,ok=false){$('status').textContent=msg;$('status').className='status'+(ok?' ok':' err')}
  async function request(method,params={},body){const t=await token();if(!t)throw Error(tr('جلسة الدخول غير موجودة أو منتهية.','Your authenticated session is missing or expired.'));const u=new URL(API);Object.entries(params).forEach(([k,v])=>v!==''&&v!=null&&u.searchParams.set(k,v));const r=await fetch(u,{method,headers:{Accept:'application/json',Authorization:`Bearer ${t}`,apikey:KEY,'Content-Type':'application/json'},body:method==='POST'?JSON.stringify(body):undefined,cache:'no-store'});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b?.error||b?.message||`HTTP ${r.status}`);return b}
  function renderMeta(){const parts=[];if(bookingId)parts.push(`📅 ${esc(bookingId)}`);if(patientId)parts.push(`👤 ${esc(patientId)}`);if(visitId)parts.push(`🩺 Visit ${esc(visitId)}`);$('meta').innerHTML=parts.map(x=>`<span class="pill">${x}</span>`).join('')||'<span class="pill">⚠️ Missing context</span>'}
  function renderTemplates(){const s=$('template');s.innerHTML=state.templates.map(t=>`<option value="${esc(t.id)}">${esc(t.name_ar||t.name||t.specialty||t.id)}</option>`).join('')}
  function questionsForTemplate(){return state.questions.filter(q=>String(q.template_id)===String($('template').value))}
  function renderQuestions(){const rows=questionsForTemplate();if(!rows.length){$('questions').innerHTML='<div class="loading">لا توجد أسئلة نشطة لهذا التقييم.</div>';return}$('questions').className='';$('questions').innerHTML=rows.map((q,i)=>{const type=String(q.response_type||'text').toLowerCase();const title=q.question_text_ar||q.question_text||`Question ${i+1}`;let input='';if(['boolean','yes_no','true_false'].includes(type))input=`<div class="options"><label class="option"><input required type="radio" name="q_${q.id}" value="true"> ✅ نعم / Yes</label><label class="option"><input required type="radio" name="q_${q.id}" value="false"> ❌ لا / No</label></div>`;else if(['number','numeric','score'].includes(type))input=`<input required name="q_${q.id}" type="number" step="any" style="padding:10px;border:1px solid #d8dce5;border-radius:10px;width:180px">`;else input=`<textarea required name="q_${q.id}" class="notes" style="min-height:70px" placeholder="${esc(q.question_text||'Response')}"></textarea>`;return `<div class="question"><div class="qmeta">#${i+1} · ${esc(type)}</div><div class="qtitle">${esc(title)}</div>${input}</div>`}).join('')}
  async function loadTemplates(){setStatus(tr('جاري تحميل التقييمات…','Loading assessments…'),true);try{const b=await request('GET',{action:'templates'});state.templates=b.templates||[];state.questions=b.questions||[];renderTemplates();renderQuestions();setStatus(tr('تم تحميل التقييمات والأسئلة.','Assessments and questions loaded.'),true)}catch(e){setStatus(e.message)}}
  async function loadHistory(){if(!patientId){setStatus(tr('لا يوجد patient_id لعرض التاريخ.','patient_id is required for history.'));return}try{const b=await request('GET',{action:'history',patient_id:patientId,visit_id:visitId});const list=b.sessions||[];$('history').hidden=false;$('historyList').innerHTML=list.length?list.map(x=>`<div class="question"><strong>🧠 ${esc(x.clinical_assessment_templates?.name_ar||x.clinical_assessment_templates?.name||'Assessment')}</strong><div class="qmeta">${esc(x.created_at||'')} · ${esc(x.score_percent??'—')}%</div><div>${esc(x.clinician_notes||'')}</div></div>`).join(''):'<div class="loading">لا يوجد تاريخ تقييم.</div>'}catch(e){setStatus(e.message)}}
  $('template').addEventListener('change',renderQuestions);$('loadBtn').onclick=loadTemplates;$('historyBtn').onclick=loadHistory;$('backBtn').onclick=()=>history.length>1?history.back():(location.href=`doctor-dashboard.html?${new URLSearchParams({booking_id:bookingId,patient_id:patientId}).toString()}`);
  $('form').addEventListener('submit',async e=>{e.preventDefault();const rows=questionsForTemplate();const answers=rows.map(q=>{const el=$(`q_${q.id}`)||document.querySelector(`[name="q_${q.id}"]:checked`);const val=el?.value??'';const bool=val==='true'||val==='false'?val==='true':null;return {question_id:q.id,response_boolean:bool,response_text:bool===null?val:null,is_correct:null}});try{const b=await request('POST',{}, {patient_id:patientId,clinical_visit_id:visitId||null,template_id:$('template').value,answers,clinician_notes:$('notes').value.trim()});setStatus(tr(`تم حفظ التقييم بنجاح. النتيجة ${b.percentage ?? 0}%`,`Assessment saved successfully. Score ${b.percentage ?? 0}%`),true);await loadHistory()}catch(err){setStatus(err.message)}});
  renderMeta();if(!patientId||!visitId){setStatus(tr('السياق ناقص: يجب فتح الصفحة من Doctor Start Visit مع patient_id و visit_id.','Missing context: open this page from Doctor Start Visit with patient_id and visit_id.'));$('form').querySelector('button[type="submit"]').disabled=true}else loadTemplates();
})();
</script>
</body>
</html>
