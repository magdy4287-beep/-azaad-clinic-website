<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azaad Clinical Assessment</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#18202a}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 4px 20px #0000000d}.q{font-size:22px;line-height:1.6}.actions{display:flex;gap:14px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:14px 22px;font-size:18px;cursor:pointer}.yes{background:#d9f7df}.no{background:#ffe0e0}.muted{color:#667085}.bar{height:18px;background:#e8edf3;border-radius:99px;overflow:hidden}.fill{height:100%;background:#2e9b62;width:0}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}textarea{width:100%;min-height:150px;border:1px solid #d7dce2;border-radius:12px;padding:12px;box-sizing:border-box}</style></head>
<body><main class="wrap"><div class="row"><h1>🧠 Clinical Assessment</h1><button class="btn" onclick="location.href='clinical-record.html?patient_id='+encodeURIComponent(patientId||'')">↩️ ملف المريض</button></div><div id="app" class="card"><p class="muted">هذه الأداة مساعدة للطبيب وليست بديلًا عن التشخيص أو القرار العلاجي.</p><div id="content">جارٍ تحميل التقييم…</div></div></main>
<script src="patient-session-bridge-v3.js"></script><script>
const API='https://derofsthjivlkcdnojww.supabase.co/functions/v1/azaad-clinical-assessments';
const qs=new URLSearchParams(location.search);const patientId=qs.get('patient_id');const visitId=qs.get('visit_id');
let questions=[],answers=[],i=0,startedAt=new Date();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function authHeaders(){const token=await window.AZAAD_PATIENT_SESSION?.getAccessToken?.();if(!token)throw Error('جلسة الطبيب غير موجودة. يرجى تسجيل الدخول أولًا.');return {Accept:'application/json',Authorization:'Bearer '+token,'Content-Type':'application/json'}}
async function load(){if(!patientId){content.innerHTML='<h2>⚠️ patient_id مطلوب</h2>';return}try{const h=await authHeaders();const r=await fetch(API+'?action=questions&patient_id='+encodeURIComponent(patientId),{headers:h,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تحميل الأسئلة');questions=d.questions||[];if(!questions.length){content.innerHTML='<h2>لا توجد أسئلة لهذا التقييم بعد.</h2><p class="muted">أضف أسئلة معتمدة من إدارة العيادة أو استخدم أداة معيارية مناسبة.</p>';return}render()}catch(e){content.innerHTML='<h2>تعذر تحميل التقييم</h2><p>'+esc(e.message)+'</p>'}}
function render(){const q=questions[i];content.innerHTML='<div class="muted">السؤال '+(i+1)+' من '+questions.length+'</div><div class="q">'+esc(q.question_ar||q.question||'')+'</div><p class="muted">'+esc(q.question_en||'')+'</p><div class="actions"><button class="btn yes" onclick="answer(true)">✅ صحيح / نعم</button><button class="btn no" onclick="answer(false)">❌ خطأ / لا</button></div>'}
function answer(v){answers[i]={question_id:questions[i].id,value:v};if(i<questions.length-1){i++;render()}else finish()}
async function finish(){const score=answers.filter(a=>a?.value===true).length;const pct=Math.round(score/questions.length*100);const notes=prompt('📝 ملاحظات الطبيب (اختياري)')||'';content.innerHTML='<h2>🏁 اكتمل التقييم</h2><h1>'+pct+'%</h1><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div><p>الإجابات الإيجابية: '+score+' / '+questions.length+'</p><p>'+esc(notes)+'</p><button class="btn" onclick="save('+pct+',`'+encodeURIComponent(notes)+'`)">💾 حفظ في ملف المريض</button>'}
async function save(pct,n){try{const h=await authHeaders();const payload={action:'save',patient_id:patientId,clinical_visit_id:visitId,started_at:startedAt.toISOString(),completed_at:new Date().toISOString(),score_percent:pct,notes:decodeURIComponent(n),answers};const r=await fetch(API,{method:'POST',headers:h,cache:'no-store',body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');content.innerHTML='<h2>✅ تم الحفظ</h2><p>تم حفظ نتيجة التقييم في ملف المريض.</p><button class="btn" onclick="location.href=`clinical-record.html?patient_id=${encodeURIComponent(patientId)}`">فتح ملف المريض</button>'}catch(e){alert(e.message)}}
load();</script></body></html>
