<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet"><meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet"><title>AZAAD — Patient Portal</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f6f8fb}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #1720330d}h1,h2{margin-top:0}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{padding:16px;border:1px solid #e5e9f0;border-radius:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f4}.row:last-child{border-bottom:0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccd3df}button{cursor:pointer;background:#172033;color:#fff}.danger{background:#fff;color:#b42318}.hidden{display:none}.notice{padding:12px;border-radius:10px;background:#f2f4f7;margin-top:12px}.ok{background:#ecfdf3;color:#067647}.err{background:#fef3f2;color:#b42318}.toolbar{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main class="wrap"><div class="card"><h1>بوابة المريض</h1><p class="muted">AZAAD Patient Portal — دخول آمن برمز لمرة واحدة عبر Appwrite.</p><section id="login"><form id="otpRequest"><input id="email" type="email" autocomplete="email" required placeholder="البريد الإلكتروني المسجل لدى العيادة"><button type="submit">إرسال رمز الدخول</button></form><form id="otpVerify" class="hidden" style="margin-top:10px"><input id="otp" inputmode="numeric" autocomplete="one-time-code" required placeholder="أدخل الرمز الذي وصلك بالبريد"><button type="submit">تأكيد الدخول</button></form><div id="loginMsg" class="notice hidden"></div></section><section id="app" class="hidden"><div class="card"><div class="row"><strong id="patientName">—</strong><button id="logout" class="danger">تسجيل الخروج</button></div><div id="identity" class="muted"></div></div><div id="stats" class="grid"></div><div class="card"><h2>المواعيد</h2><div id="bookings"></div></div><div class="card"><h2>الفواتير والمدفوعات</h2><div id="invoices"></div></div><div class="card"><h2>الزيارات</h2><div id="visits"></div></div><div class="card"><h2>المتابعات</h2><div id="followups"></div></div></section></div></main><script>(()=>{const $=id=>document.getElementById(id),msg=(t,ok=false)=>{const x=$('loginMsg');x.textContent=t;x.className=`notice ${ok?'ok':'err'}`;x.classList.remove('hidden')},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let userId='';const api=async(action,method='GET',body)=>{const r=await fetch(`/api/public-clinic-data?scope=patient-portal&action=${encodeURIComponent(action)}`,{method,credentials:'include',cache:'no-store',headers:{Accept:'application/json','Content-Type':'application/json'},body:method==='POST'?JSON.stringify(body||{}):undefined});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'تعذر تنفيذ العملية');return b};const rows=(id,data,empty,fn)=>$(id).innerHTML=data?.length?data.map(fn).join(''):`<p class="muted">${empty}</p>`;async function load(){try{const d=await api('');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('patientName').textContent=d.patient.patient_name||'Patient';$('identity').textContent=`${d.patient.mrn||''} · ${d.patient.patient_email||''}`;const s=d.summary||{};$('stats').innerHTML=[['المواعيد',s.booking_count],['الزيارات',s.visit_count],['الفواتير',s.invoice_count],['الرصيد',Number(s.balance||0).toFixed(2)+' EGP']].map(x=>`<div class="stat"><strong>${esc(x[0])}</strong><div>${esc(x[1])}</div></div>`).join('');rows('bookings',d.bookings,'لا توجد مواعيد مسجلة.',x=>`<div class="row"><span>${esc(x.appointment_date)} ${esc(x.appointment_time||'')}<br><small>${esc(x.doctor_name||x.doctor_name_en||'')} · ${esc(x.service_name||x.service_name_en||'')}</small></span><span>${esc(x.status)}</span></div>`);rows('invoices',d.invoices,'لا توجد فواتير.',x=>`<div class="row"><span>${esc(x.invoice_number)}<br><small>${esc(x.status)}</small></span><span>${Number(x.total||0).toFixed(2)} EGP<br><small>متبقي ${Number(x.remaining_amount||0).toFixed(2)}</small></span></div>`);rows('visits',d.visits,'لا توجد زيارات.',x=>`<div class="row"><span>${esc(x.visit_date)} ${esc(x.visit_time||'')}<br><small>${esc(x.doctor_name||x.doctor_name_en||'')}</small></span><span>${esc(x.visit_type)}</span></div>`);rows('followups',d.followups,'لا توجد متابعات.',x=>`<div class="row"><span>${esc(x.followup_type)}<br><small>${esc(x.due_at||'')}</small></span><span>${esc(x.status)}</span></div>`)}catch(e){$('app').classList.add('hidden');$('login').classList.remove('hidden');msg(e.message)}};$('otpRequest').addEventListener('submit',async e=>{e.preventDefault();try{const email=$('email').value.trim().toLowerCase();const r=await api('request-otp','POST',{email});userId=r.userId;$('otpVerify').classList.remove('hidden');msg('تم إرسال رمز الدخول إلى بريدك الإلكتروني. الرمز صالح لفترة محدودة.',true)}catch(e){msg(e.message)}});$('otpVerify').addEventListener('submit',async e=>{e.preventDefault();try{await api('verify-otp','POST',{userId,secret:$('otp').value.trim()});await load()}catch(e){msg(e.message)}});$('logout').addEventListener('click',async()=>{try{await api('logout','POST',{});}finally{location.reload()}});load()})();</script></body></html>
