<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZAAD — Patient Portal</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f6f8fb}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #1720330d}h1,h2{margin-top:0}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{padding:16px;border:1px solid #e5e9f0;border-radius:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f4}.row:last-child{border-bottom:0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccd3df}button{cursor:pointer;background:#172033;color:#fff}.danger{background:#fff;color:#b42318}.hidden{display:none}.notice{padding:12px;border-radius:10px;background:#f2f4f7;margin-top:12px}</style></head><body><main class="wrap"><div class="card"><h1>بوابة المريض</h1><p class="muted">AZAAD Patient Portal — دخول آمن بالبريد الإلكتروني الموثق.</p><section id="login"><form id="otpForm"><input id="email" type="email" autocomplete="email" required placeholder="البريد الإلكتروني المسجل لدى العيادة"><button type="submit">إرسال رابط الدخول</button></form><div id="loginMsg" class="notice hidden"></div></section><section id="app" class="hidden"><div class="card"><div class="row"><strong id="patientName">—</strong><button id="logout" class="danger">تسجيل الخروج</button></div><div id="identity" class="muted"></div></div><div id="stats" class="grid"></div><div class="card"><h2>المواعيد</h2><div id="bookings"></div></div><div class="card"><h2>الفواتير والمدفوعات</h2><div id="invoices"></div></div><div class="card"><h2>الزيارات</h2><div id="visits"></div></div><div class="card"><h2>المتابعات</h2><div id="followups"></div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const SB_URL='https://derofsthjivlkcdnojww.supabase.co';const SB_KEY='sb_publishable_GC253fvQebNBsDOaKjWGRw_tPYJrgLa';const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id),msg=(t)=>{const x=$('loginMsg');x.textContent=t;x.classList.remove('hidden')};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const renderRows=(id,rows,empty,fn)=>$(id).innerHTML=rows.length?rows.map(fn).join(''):('<p class="muted">'+empty+'</p>');async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const r=await fetch(SB_URL+'/functions/v1/azaad-patient-portal',{headers:{Authorization:'Bearer '+session.access_token,apikey:SB_KEY}});const data=await r.json();if(!r.ok){$('app').classList.add('hidden');$('login').classList.remove('hidden');msg(data.error||'تعذر تحميل بوابة المريض');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('patientName').textContent=data.patient.patient_name||'Patient';$('identity').textContent=(data.patient.mrn||'')+' · '+(data.patient.patient_email||'');const s=data.summary||{};$('stats').innerHTML=[['المواعيد',s.booking_count],['الزيارات',s.visit_count],['الفواتير',s.invoice_count],['الرصيد',Number(s.balance||0).toFixed(2)+' EGP']].map(x=>'<div class="stat"><strong>'+esc(x[0])+'</strong><div>'+esc(x[1])+'</div></div>').join('');renderRows('bookings',data.bookings||[],'لا توجد مواعيد مسجلة.',x=>'<div class="row"><span>'+esc(x.appointment_date)+' '+esc(x.appointment_time||'')+'<br><small>'+esc(x.clinic_doctors?.name||x.clinic_doctors?.name_en||'')+' · '+esc(x.clinic_services?.name||x.clinic_services?.name_en||'')+'</small></span><span>'+esc(x.status)+'</span></div>');renderRows('invoices',data.invoices||[],'لا توجد فواتير.',x=>'<div class="row"><span>'+esc(x.invoice_number)+'<br><small>'+esc(x.status)+'</small></span><span>'+Number(x.total||0).toFixed(2)+' EGP<br><small>متبقي '+Number(x.remaining_amount||0).toFixed(2)+'</small></span></div>');renderRows('visits',data.visits||[],'لا توجد زيارات.',x=>'<div class="row"><span>'+esc(x.visit_date)+' '+esc(x.visit_time||'')+'<br><small>'+esc(x.clinic_doctors?.name||x.clinic_doctors?.name_en||'')+'</small></span><span>'+esc(x.visit_type)+'</span></div>');renderRows('followups',data.followups||[],'لا توجد متابعات.',x=>'<div class="row"><span>'+esc(x.followup_type)+'<br><small>'+esc(x.due_at||'')+'</small></span><span>'+esc(x.status)+'</span></div>')}$('otpForm').addEventListener('submit',async e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase();const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/patient.html'}});msg(error?error.message:'تم إرسال رابط دخول آمن إلى بريدك الإلكتروني. افتح الرابط لإكمال الدخول.');if(!error)e.target.reset()});$('logout').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN'||event==='TOKEN_REFRESHED')setTimeout(load,0)});load()})();</script></body></html>
