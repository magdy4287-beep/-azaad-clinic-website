<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Azaad Clinic | تسجيل دخول الإدارة</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#18213d;font-family:Arial,Tahoma,sans-serif}.card{width:min(440px,calc(100% - 32px));background:#fff;border-radius:16px;padding:30px;box-shadow:0 7px 25px rgba(0,0,0,.05)}.logo{font-size:25px;font-weight:900;color:#17214f;letter-spacing:2px}.logo span{display:block;color:#b38a42;font-size:12px;letter-spacing:3px;margin-top:4px}h2{margin-top:25px}label{display:block;margin:0 0 13px;font-weight:700}input{width:100%;margin-top:7px;padding:12px;border:1px solid #d9deea;border-radius:10px;background:#fff;outline:none;font:inherit}input:focus{border-color:#17214f;box-shadow:0 0 0 3px rgba(23,33,79,.1)}button{width:100%;border:0;border-radius:10px;padding:12px 16px;background:#17214f;color:#fff;font:inherit;font-weight:700;cursor:pointer}.error{background:#fff0f2;color:#a32939;padding:11px;border-radius:10px;margin-top:12px}.hidden{display:none!important}.muted{color:#6c758c}
</style>
</head>
<body>
<main class="card">
  <div class="logo">AZAAD<span>CLINIC FOR MENTAL HEALTH</span></div>
  <h2>لوحة إدارة العيادة</h2>
  <p class="muted">🔐 تسجيل الدخول بحساب الموظف عبر Supabase Auth</p>
  <form id="loginForm" autocomplete="on">
    <label>اسم المستخدم<input id="username" type="text" autocomplete="username" value="azaadadmin" required></label>
    <label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">تسجيل الدخول</button>
    <div id="loginError" class="error hidden"></div>
  </form>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://derofsthjivlkcdnojww.supabase.co";
const SUPABASE_KEY="sb_publishable_GC253fvQebNBsDOaKjWGRw_tPYJrgLa";
const loginEndpoint=`${SUPABASE_URL}/functions/v1/staff-login`;
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const form=document.getElementById('loginForm');
const errorBox=document.getElementById('loginError');
form.addEventListener('submit',async event=>{
  event.preventDefault();
  errorBox.classList.add('hidden');
  const username=document.getElementById('username').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  try{
    const response=await fetch(loginEndpoint,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify({username,password})});
    let result={}; try{result=await response.json()}catch(_){ }
    if(!response.ok) throw new Error(result?.error||result?.message||'بيانات الدخول غير صحيحة.');
    if(!result?.session?.access_token||!result?.session?.refresh_token) throw new Error('تعذر إنشاء جلسة الدخول.');
    if(!result?.staff||result.staff.active===false) throw new Error('حساب الموظف غير فعال.');
    const sessionResult=await supabase.auth.setSession({access_token:result.session.access_token,refresh_token:result.session.refresh_token});
    if(sessionResult.error) throw sessionResult.error;
    try{sessionStorage.setItem('azaad_admin_token',result.session.access_token)}catch(_){ }
    location.replace('/admin.html');
  }catch(error){
    errorBox.textContent=error?.message||'تعذر تسجيل الدخول.';
    errorBox.classList.remove('hidden');
  }
});
</script>
</body>
</html>
