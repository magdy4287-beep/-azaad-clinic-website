<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<title>Azaad Clinic | تسجيل دخول الإدارة</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#f5f7fb;color:#18213d;font-family:Arial,Tahoma,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;display:grid;place-items:center}
*{box-sizing:border-box}
.card{position:relative;z-index:1;width:min(440px,calc(100% - 32px));background:#fff;border-radius:16px;padding:30px;box-shadow:0 7px 25px rgba(0,0,0,.05)}
.logo{font-size:25px;font-weight:900;color:#17214f;letter-spacing:2px}.logo span{display:block;color:#b38a42;font-size:12px;letter-spacing:3px;margin-top:4px}
h2{margin-top:25px}label{display:block;margin:0 0 13px;font-weight:700}
input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #d9deea;border-radius:10px;background:#fff;outline:none;font:inherit;color:#18213d;opacity:1;visibility:visible;pointer-events:auto;touch-action:manipulation;-webkit-user-select:text;user-select:text;-webkit-appearance:none}
input:focus{border-color:#17214f;box-shadow:0 0 0 3px rgba(23,33,79,.1)}
button{display:block;width:100%;border:0;border-radius:10px;padding:13px 16px;background:#17214f;color:#fff;font:inherit;font-weight:700;cursor:pointer;pointer-events:auto;touch-action:manipulation}
button:disabled{opacity:.7}.error{background:#fff0f2;color:#a32939;padding:11px;border-radius:10px;margin-top:12px}.hidden{display:none!important}.muted{color:#6c758c}
</style>
</head>
<body>
<main class="card" id="adminLoginSurface">
  <div class="logo">AZAAD<span>CLINIC FOR MENTAL HEALTH</span></div>
  <h2>لوحة إدارة العيادة</h2>
  <p class="muted">🔐 تسجيل الدخول بحساب الموظف عبر Supabase Auth</p>
  <form id="loginForm" autocomplete="on" novalidate>
    <label for="username">اسم المستخدم</label>
    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" required>
    <label for="password">كلمة المرور</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <button id="loginButton" type="submit">تسجيل الدخول</button>
    <div id="loginError" class="error hidden" role="alert"></div>
  </form>
</main>
<script>
(function(){
  'use strict';
  var SUPABASE_URL='https://derofsthjivlkcdnojww.supabase.co';
  var SUPABASE_KEY='sb_publishable_GC253fvQebNBsDOaKjWGRw_tPYJrgLa';
  var form=document.getElementById('loginForm');
  var username=document.getElementById('username');
  var password=document.getElementById('password');
  var button=document.getElementById('loginButton');
  var errorBox=document.getElementById('loginError');
  if(!form||!username||!password||!button||!errorBox) return;
  function showError(message){errorBox.textContent=message||'تعذر تسجيل الدخول.';errorBox.classList.remove('hidden');button.disabled=false;}
  function clearError(){errorBox.textContent='';errorBox.classList.add('hidden');}
  function persistCanonicalSupabaseSession(session,user){
    var expiresAt=session.expires_at;
    if(!expiresAt && session.expires_in){expiresAt=Math.floor(Date.now()/1000)+Number(session.expires_in);}
    var canonical={
      access_token:session.access_token,
      refresh_token:session.refresh_token,
      expires_in:session.expires_in,
      expires_at:expiresAt,
      token_type:session.token_type||'bearer',
      user:user||session.user||null
    };
    var key='sb-derofsthjivlkcdnojww-auth-token';
    localStorage.setItem(key,JSON.stringify(canonical));
    try{sessionStorage.setItem('azaad_admin_token',session.access_token);}catch(_){ }
  }
  form.addEventListener('submit',function(event){
    event.preventDefault();
    clearError();
    var user=(username.value||'').trim().toLowerCase();
    var pass=password.value||'';
    if(!user){username.focus();showError('يرجى إدخال اسم المستخدم.');return;}
    if(!pass){password.focus();showError('يرجى إدخال كلمة المرور.');return;}
    button.disabled=true;
    fetch(SUPABASE_URL+'/functions/v1/staff-login',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({username:user,password:pass})})
      .then(function(response){return response.json().catch(function(){return {};}).then(function(result){return {ok:response.ok,result:result};});})
      .then(function(payload){
        var result=payload.result||{};
        if(!payload.ok) throw new Error(result.error||result.message||'بيانات الدخول غير صحيحة.');
        if(!result.session||!result.session.access_token||!result.session.refresh_token) throw new Error('تعذر إنشاء جلسة الدخول.');
        if(!result.staff||result.staff.active===false) throw new Error('حساب الموظف غير فعال.');
        persistCanonicalSupabaseSession(result.session,result.user);
        location.replace('/admin.html');
      })
      .catch(function(error){showError(error&&error.message?error.message:'تعذر تسجيل الدخول.');});
  });
})();
</script>
</body>
</html>
