<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azaad Clinic — Clinical Record</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid #e6eaf1;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 4px 18px #14213d0a}input,button,select,textarea{font:inherit;border:1px solid #d9deea;border-radius:10px;padding:10px 12px}input,textarea,select{background:#fff;width:100%}button{cursor:pointer;background:#172033;color:#fff}.search{display:grid;grid-template-columns:1fr auto;gap:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:14px;border:1px solid #e8ebf2;border-radius:12px}.metric b{display:block;font-size:24px;margin-top:4px}.visit{border:1px solid #e5e9f1;border-radius:14px;padding:14px;margin-top:12px}.muted{color:#687386}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;margin-inline-start:6px}.bar{height:12px;background:#e8ebf2;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#4969e8}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><main class="wrap">
<div class="top"><div><h1>🩺 Clinical Record</h1><div class="muted">Azaad Clinic — Patient progress & follow-up</div></div><button id="lang">English 🇬🇧</button></div>
<section class="card"><div class="search"><input id="patientId" placeholder="Patient ID / UUID"><button id="load">تحميل السجل 🔎</button></div><p id="msg" class="muted"></p></section>
<section id="summary" class="card hidden"><div class="grid"><div class="metric">👤 المريض<b id="pid">—</b></div><div class="metric">🩺 الزيارات<b id="count">0</b></div><div class="metric">📈 الاتجاه<b id="trend">—</b></div><div class="metric">📅 الموعد القادم<b id="next">—</b></div></div></section>
<section id="progressCard" class="card hidden"><h2>📈 Patient Progress</h2><div id="progress"></div></section>
<section id="visits" class="card hidden"><h2>📝 Clinical Visits</h2><div id="visitList"></div></section>
</main>
<script>
const API='https://derofsthjivlkcdnojww.supabase.co/functions/v1/azaad-clinical-insights';
const state={en:false};
function token(){return localStorage.getItem('supabase_access_token')||sessionStorage.getItem('supabase_access_token')||localStorage.getItem('access_token')||sessionStorage.getItem('access_token')||''}
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}
function text(ar,en){return state.en?en:ar}
function render(d){document.getElementById('summary').classList.remove('hidden');document.getElementById('progressCard').classList.remove('hidden');document.getElementById('visits').classList.remove('hidden');document.getElementById('pid').textContent=d.patient_id;document.getElementById('count').textContent=d.visit_count??0;document.getElementById('trend').textContent=d.trend==='improving'?'🟢 Improving':d.trend==='declining'?'🔴 Declining':d.trend==='stable'?'🟡 Stable':'—';document.getElementById('next').textContent=d.next_visit?.next_visit_date||'—';
const p=d.progress||[];const max=Math.max(100,...p.map(x=>Number(x.progress)||0));document.getElementById('progress').innerHTML=p.length?p.map(x=>`<div class="row"><span>${esc(x.date)}</span><strong>${esc(x.progress)}%</strong></div><div class="bar"><i style="width:${Math.min(100,Math.max(0,(Number(x.progress)||0)/max*100))}%"></i></div>`).join(''):'<p class="muted">لا توجد بيانات Progress كافية بعد.</p>';
const v=d.latest_visit?[d.latest_visit]:[];document.getElementById('visitList').innerHTML=v.length?v.map(x=>`<article class="visit"><div class="row"><strong>${esc(x.visit_date||'—')}</strong><span class="badge">${esc(x.visit_type||'Visit')}</span></div><p><b>Assessment:</b> ${esc(x.assessment||'—')}</p><p><b>Treatment:</b> ${esc(x.treatment_plan||'—')}</p><p><b>Next Visit:</b> ${esc(x.next_visit_date||'—')}</p><p><b>Notes:</b> ${esc(x.next_visit_notes||'—')}</p></article>`).join(''):'<p class="muted">لا توجد زيارة حديثة.</p>'}
async function load(){const id=document.getElementById('patientId').value.trim();if(!id)return;document.getElementById('msg').textContent=text('جارٍ تحميل السجل…','Loading clinical record…');try{const h=token();if(!h)throw new Error(text('لم يتم العثور على جلسة دخول صالحة.','No valid login session found.'));const r=await fetch(API+'?patient_id='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+h}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');render(d);document.getElementById('msg').textContent=text('تم تحميل السجل بنجاح ✅','Clinical record loaded ✅')}catch(e){document.getElementById('msg').textContent='❌ '+e.message}}
document.getElementById('load').onclick=load;document.getElementById('lang').onclick=()=>{state.en=!state.en;document.documentElement.lang=state.en?'en':'ar';document.documentElement.dir=state.en?'ltr':'rtl';document.getElementById('lang').textContent=state.en?'العربية 🇪🇬':'English 🇬🇧'};
</script></body></html>
