<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azaad Clinic | Invoice & RCM Center</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#18213d;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1450px;margin:auto;padding:18px}.top{background:#fff;border-radius:16px;padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 7px 25px rgba(0,0,0,.05)}.brand{font-size:24px;font-weight:900}.brand small{display:block;font-size:11px;color:#b38a42;letter-spacing:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#17214f;color:#fff}.secondary{background:#fff;color:#17214f;border:1px solid #d9deea}.danger{background:#fff0f2;color:#a32939;border:1px solid #ffd2d8}.filters,.stats{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:16px 0}.stats{grid-template-columns:repeat(6,1fr)}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 7px 25px rgba(0,0,0,.05);margin-bottom:15px}input,select{width:100%;padding:12px;border:1px solid #d9deea;border-radius:10px;margin-top:6px}.stat b{font-size:25px;display:block}.muted{color:#6c758c}.table-wrap{overflow:auto;border:1px solid #e3e6ed;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right;font-size:13px}th{background:#fafbfe}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800}.paid{background:#e5f7eb;color:#167345}.partial{background:#fff4cc;color:#755c00}.unpaid{background:#ffecef;color:#a32939}.overdue{background:#ffecef;color:#8c1d2c}.empty{text-align:center;padding:35px;color:#7a8294}.error{background:#fff0f2;color:#a32939;padding:12px;border-radius:10px;margin:12px 0}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(15,25,70,.55);display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:900px;max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv{display:grid;grid-template-columns:180px 1fr;border-bottom:1px solid #eee;padding:9px}.toast{position:fixed;bottom:18px;left:18px;right:18px;max-width:600px;margin:auto;background:#17214f;color:#fff;padding:12px;border-radius:10px;text-align:center;display:none}.toast.show{display:block}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.filters,.grid{grid-template-columns:1fr}}@media(max-width:550px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">🏥 AZAAD <small>INVOICE & RCM CENTER</small></div><div class="actions"><button id="lang" class="btn secondary">🇬🇧 English</button><button id="back" class="btn secondary">↩️ لوحة الإدارة</button><button id="refresh" class="btn primary">🔄 تحديث</button></div></div>
<div id="error" class="error hidden"></div>
<div class="stats"><div class="card stat"><b id="count">0</b><span class="muted">🧾 الفواتير</span></div><div class="card stat"><b id="total">0</b><span class="muted">💰 الإجمالي</span></div><div class="card stat"><b id="paidTotal">0</b><span class="muted">💳 المحصل</span></div><div class="card stat"><b id="dueTotal">0</b><span class="muted">⚠️ المتبقي</span></div><div class="card stat"><b id="paidCount">0</b><span class="muted">🟢 مدفوعة</span></div><div class="card stat"><b id="dueCount">0</b><span class="muted">🔴 مستحقة</span></div></div>
<div class="card"><h2>🧾 الفواتير و Revenue Cycle Management</h2><div class="filters"><input id="q" placeholder="🔎 اسم المريض / الهاتف / MRN / رقم الفاتورة"><select id="status"><option value="">كل الحالات</option><option value="paid">مدفوعة</option><option value="partial">جزئية</option><option value="unpaid">غير مدفوعة</option><option value="overdue">متأخرة</option></select><input id="from" type="date"><input id="to" type="date"></div><div class="actions"><button id="search" class="btn primary">🔎 بحث</button><button id="today" class="btn secondary">📅 اليوم</button><button id="clear" class="btn secondary">🧹 مسح</button></div></div>
<div class="card"><div id="table" class="table-wrap"><div class="empty">جاري التحميل…</div></div></div>
</div>
<div id="modal" class="modal"><div class="modalbox"><div class="actions" style="justify-content:space-between"><h2 id="mt">🧾 الفاتورة</h2><button id="close" class="btn secondary">✖️ إغلاق</button></div><div id="mc"></div></div></div><div id="toast" class="toast"></div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const URL="https://derofsthjivlkcdnojww.supabase.co";const KEY="sb_publishable_GC253fvQebNBsDOaKjWGRw_tPYJrgLa";
const supabase=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);let lang=localStorage.getItem("azaad_admin_language")||"ar";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>Number(v||0).toLocaleString(lang==='en'?'en-US':'ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2});
const toast=m=>{$("toast").textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3000)};
function setLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';$('lang').textContent=lang==='ar'?'🇬🇧 English':'🇪🇬 العربية';localStorage.setItem('azaad_admin_language',lang)}
function isoToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function badge(s){const x=String(s||'unpaid').toLowerCase();const label=lang==='en'?({paid:'🟢 Paid',partial:'🟡 Partial',unpaid:'🔴 Unpaid',overdue:'⏰ Overdue'}[x]||x):({paid:'🟢 مدفوعة',partial:'🟡 جزئية',unpaid:'🔴 غير مدفوعة',overdue:'⏰ متأخرة'}[x]||x);return `<span class="badge ${esc(x)}">${label}</span>`}
async function call(action,payload={}){let session=(await supabase.auth.getSession()).data.session;if(!session?.access_token){location.href='admin.html';return null}let r=await fetch(`${URL}/functions/v1/azaad-invoice-center`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`,apikey:KEY},body:JSON.stringify({action,...payload})});let b={};try{b=await r.json()}catch(_){}if(r.status===401){await supabase.auth.refreshSession();session=(await supabase.auth.getSession()).data.session;r=await fetch(`${URL}/functions/v1/azaad-invoice-center`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`,apikey:KEY},body:JSON.stringify({action,...payload})});try{b=await r.json()}catch(_){} }if(!r.ok)throw Error(b.error||b.message||`HTTP ${r.status}`);return b}
function render(rows=[]){$('table').innerHTML=rows.length?`<table><thead><tr><th>🧾 رقم الفاتورة</th><th>🤢 المريض</th><th>🆔 MRN</th><th>📱 الهاتف</th><th>🧑‍⚕️ الطبيب</th><th>📅 التاريخ</th><th>💰 الإجمالي</th><th>💳 المدفوع</th><th>⚠️ المتبقي</th><th>🚦 الحالة</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.invoice_number||x.id)}</b></td><td>${esc(x.patient_name||'—')}</td><td>${esc(x.mrn||'—')}</td><td dir="ltr">${esc(x.patient_phone||'—')}</td><td>${esc(x.doctor_name||'—')}</td><td>${esc(x.invoice_date||x.created_at?.slice(0,10)||'—')}</td><td>${money(x.total_amount)}</td><td>${money(x.paid_amount)}</td><td>${money(x.balance_due)}</td><td>${badge(x.status)}</td><td><button class="btn secondary" data-id="${esc(x.id)}">👁️ التفاصيل</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">📭 لا توجد فواتير مطابقة.</div>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(b.dataset.id))}
async function load(){try{const result=await call('list',{q:$('q').value.trim(),status:$('status').value,date_from:$('from').value,date_to:$('to').value});const rows=result?.invoices||result?.rows||[];$('count').textContent=result?.summary?.count??rows.length;$('total').textContent=money(result?.summary?.total??rows.reduce((a,x)=>a+Number(x.total_amount||0),0));$('paidTotal').textContent=money(result?.summary?.paid??rows.reduce((a,x)=>a+Number(x.paid_amount||0),0));$('dueTotal').textContent=money(result?.summary?.due??rows.reduce((a,x)=>a+Number(x.balance_due||0),0));$('paidCount').textContent=result?.summary?.paid_count??rows.filter(x=>x.status==='paid').length;$('dueCount').textContent=result?.summary?.due_count??rows.filter(x=>x.status!=='paid').length;render(rows)}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden')}}
async function detail(id){try{const r=await call('get',{id});const x=r.invoice||r.data||r;const p=x.patient||{};const payments=x.payments||[];$('mc').innerHTML=`<div class="grid"><div class="kv"><b>رقم الفاتورة</b><span>${esc(x.invoice_number||x.id)}</span></div><div class="kv"><b>الحالة</b><span>${badge(x.status)}</span></div><div class="kv"><b>المريض</b><span>${esc(p.full_name||x.patient_name||'—')}</span></div><div class="kv"><b>MRN</b><span>${esc(p.mrn||x.mrn||'—')}</span></div><div class="kv"><b>الهاتف</b><span>${esc(p.phone||x.patient_phone||'—')}</span></div><div class="kv"><b>الطبيب</b><span>${esc(x.doctor_name||'—')}</span></div><div class="kv"><b>الإجمالي</b><span>${money(x.total_amount)}</span></div><div class="kv"><b>المدفوع</b><span>${money(x.paid_amount)}</span></div><div class="kv"><b>المتبقي</b><span>${money(x.balance_due)}</span></div></div><h3>💳 المدفوعات</h3>${payments.length?payments.map(v=>`<div class="card"><b>${money(v.amount)}</b> — ${esc(v.payment_method||v.method||'—')} — ${esc(v.payment_date||v.created_at?.slice(0,10)||'—')}</div>`).join(''):'<div class="empty">لا توجد مدفوعات مسجلة.</div>'}`;$('modal').classList.add('show')}catch(e){toast('❌ '+e.message)}}
$('search').onclick=load;$('refresh').onclick=load;$('clear').onclick=()=>{$('q').value='';$('status').value='';$('from').value='';$('to').value='';load()};$('today').onclick=()=>{$('from').value=isoToday();$('to').value=isoToday();load()};$('close').onclick=()=>$('modal').classList.remove('show');$('back').onclick=()=>location.href='admin.html';$('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';setLang();load()};$('q').onkeydown=e=>{if(e.key==='Enter')load()};setLang();load();
</script>
</body></html>
