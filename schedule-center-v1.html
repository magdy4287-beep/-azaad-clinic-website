<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Azaad Clinic | Central Scheduling</title><style>body{margin:0;background:#f5f7fb;color:#18213d;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1450px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;box-shadow:0 7px 25px rgba(0,0,0,.05);padding:18px;margin-bottom:15px}.head,.actions,.filters{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.title{font-size:24px;font-weight:900}.muted{color:#6c758c}.btn,input,select{font:inherit}.btn{border:1px solid #d9deea;background:#fff;color:#17214f;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.active{background:#17214f;color:#fff}.filters input,.filters select{padding:10px;border:1px solid #d9deea;border-radius:10px}.legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.badge{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700}.available{background:#e7f7ed;color:#167345}.confirmed{background:#e5efff;color:#2457a6}.pending{background:#fff4cc;color:#755c00}.no_show{background:#fff0df;color:#9a5b00}.cancelled{background:#ffecef;color:#a32939}.closed{background:#ececf1;color:#444}.calendar{overflow:auto;border:1px solid #e1e5ed;border-radius:14px}.grid{min-width:1000px}.doctor-row{display:grid;grid-template-columns:230px 1fr;border-bottom:1px solid #e5e8ef}.doctor{padding:14px;background:#fafbfe;border-left:1px solid #e5e8ef}.doctor strong{display:block}.timeline{display:grid;grid-template-columns:repeat(24,minmax(65px,1fr));min-height:110px;background:repeating-linear-gradient(90deg,#fff 0,#fff calc(4.166% - 1px),#edf0f5 calc(4.166% - 1px),#edf0f5 4.166%);position:relative}.hour{padding:7px;font-size:11px;color:#7a8294}.slots{position:absolute;top:35px;left:0;right:0;display:flex;gap:6px;padding:6px}.slot{min-width:105px;border:1px solid #dfe4ee;border-radius:10px;padding:8px;background:#fff}.slot strong,.slot span,.slot small{display:block}.slot span{font-weight:800}.slot small{color:#6c758c;margin-top:3px}.empty,.loading{padding:35px;text-align:center;color:#7a8294}.error{background:#fff0f2;color:#a32939;padding:12px;border-radius:10px}</style></head><body><main class="wrap"><section class="card"><div class="head"><div><div class="title">📅 Central Scheduling V1</div><div class="muted">عرض مركزي للمواعيد الحالية — بدون إنشاء مصدر مواعيد ثانٍ.</div></div><div class="actions"><button class="btn" id="back">← لوحة الإدارة</button><button class="btn" id="refresh">🔄 تحديث</button></div></div><div class="filters" style="margin-top:15px"><div class="actions"><button class="btn active" data-view="day">يوم</button><button class="btn" data-view="week">أسبوع</button><button class="btn" data-view="month">شهر</button></div><button class="btn" id="prev">‹</button><input id="date" type="date"><button class="btn" id="next">›</button><select id="doctor"><option value="">🧑‍⚕️ كل الأطباء</option></select><input id="search" placeholder="🔎 اسم / MRN / هاتف"></div><div class="legend"><span class="badge available">🟢 متاح</span><span class="badge confirmed">🔵 مؤكد</span><span class="badge pending">🟡 انتظار تأكيد</span><span class="badge no_show">🟠 No-show</span><span class="badge cancelled">🔴 ملغي</span><span class="badge closed">⚫ مغلق</span></div></section><section class="card" id="root"><div class="loading">⏳ جاري التحميل...</div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const U='https://derofsthjivlkcdnojww.supabase.co',K='sb_publishable_GC253fvQebNBsDOaKjWGRw_tPYJrgLa',s=createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=x=>document.getElementById(x);let st={view:'day',date:new Date(),doctor:'',search:'',bookings:[],doctors:[]};const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])),dateOf=r=>r.appointment_date||r.date||r.booking_date||r.scheduled_date||'',timeOf=r=>r.appointment_time||r.time||r.start_time||'',doctorOf=r=>r.doctor_id||r.doctorId||'',patientOf=r=>r.patient_name||r.patient?.full_name||r.name||'مريض';function status(v){v=String(v||'').toLowerCase();if(['booked','scheduled','confirmed'].includes(v))return['confirmed','🔵','مؤكد'];if(['pending_confirmation','awaiting_confirmation'].includes(v))return['pending','🟡','انتظار تأكيد'];if(['no-show','noshow'].includes(v))return['no_show','🟠','No-show'];if(['cancelled','canceled'].includes(v))return['cancelled','🔴','ملغي'];if(['closed','holiday','blocked'].includes(v))return['closed','⚫','مغلق'];return['available','🟢','متاح']}function key(d){return new Date(d).toISOString().slice(0,10)}async function admin(q){const{data:{session}}=await s.auth.getSession();if(!session)throw Error('سجّل الدخول من لوحة الإدارة أولًا.');const r=await fetch(`${U}/functions/v1/azaad-admin${q}`,{headers:{Authorization:`Bearer ${session.access_token}`,apikey:K}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||j.message||`HTTP ${r.status}`);return j.data||j.dashboard||j}async function load(){try{$('root').innerHTML='<div class="loading">⏳ جاري التحميل...</div>';const d=await admin('?api=dashboard');st.bookings=Array.isArray(d.bookings)?d.bookings:[];st.doctors=Array.isArray(d.doctors)?d.doctors:[];$('doctor').innerHTML='<option value="">🧑‍⚕️ كل الأطباء</option>'+st.doctors.map(x=>`<option value="${esc(x.id)}">${esc(x.full_name||x.name||'طبيب')}</option>`).join('');$('doctor').value=st.doctor;render()}catch(e){$('root').innerHTML=`<div class="error">⚠️ ${esc(e.message)}</div>`}}function rows(){const q=st.search.toLowerCase().trim();return st.bookings.filter(r=>{const d=dateOf(r);if(!d)return false;if(st.view==='day'&&d!==key(st.date))return false;if(st.doctor&&String(doctorOf(r))!==String(st.doctor))return false;return!q||`${patientOf(r)} ${r.patient_mrn||r.mrn||''} ${r.patient_phone||r.phone||''} ${r.booking_code||''}`.toLowerCase().includes(q)})}function dayList(d,docs,rs){const dk=key(d);return`<div style="margin-bottom:18px"><div class="head"><h2>📅 ${esc(d.toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'}))}</h2><span class="muted">${rs.filter(r=>dateOf(r)===dk).length} حجز</span></div><div class="calendar"><div class="grid">${docs.map(doc=>{const rr=rs.filter(r=>dateOf(r)===dk&&String(doctorOf(r))===String(doc.id));return`<div class="doctor-row"><div class="doctor"><strong>🧑‍⚕️ ${esc(doc.full_name||doc.name||'طبيب')}</strong><span class="muted">${esc(doc.specialty||doc.specialization||'')}</span></div><div class="timeline">${Array.from({length:24},(_,h)=>`<div class="hour">${h===0?12:h>12?h-12:h}:00</div>`).join('')}<div class="slots">${rr.length?rr.map(r=>{const[c,i,l]=status(r.status);return`<div class="slot ${c}"><strong>${esc(timeOf(r)||'—')} ${i} ${l}</strong><span>${esc(patientOf(r))}</span><small>${esc(r.patient_mrn||r.mrn||r.booking_code||'')}</small></div>`}).join(''):'<span class="muted">لا توجد حجوزات لهذا الطبيب في هذا اليوم.</span>'}</div></div></div>`}).join('')}</div></div></div>`}function render(){const rs=rows(),docs=st.doctors.filter(d=>d.active!==false&&(!st.doctor||String(d.id)===String(st.doctor)));if(!docs.length){$('root').innerHTML='<div class="empty">لا توجد بيانات أطباء ضمن الصلاحية الحالية.</div>';return}if(st.view==='week'){const x=new Date(st.date),day=x.getDay(),start=new Date(x);start.setDate(x.getDate()-(day===0?6:day-1));$('root').innerHTML=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return dayList(d,docs,rs)}).join('');return}if(st.view==='month'){const groups={};rs.forEach(r=>(groups[dateOf(r)]??=[]).push(r));const ds=Object.keys(groups).sort();$('root').innerHTML=ds.length?ds.map(d=>dayList(new Date(d+'T00:00:00'),docs,groups[d])).join(''):'<div class="empty">لا توجد حجوزات في الشهر المحدد ضمن الصلاحية الحالية.</div>';return}$('root').innerHTML=dayList(st.date,docs,rs)}function move(n){const d=new Date(st.date);if(st.view==='day')d.setDate(d.getDate()+n);else if(st.view==='week')d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n);st.date=d;$('date').value=key(d);render()}$('date').value=key(st.date);$('refresh').onclick=load;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('back').onclick=()=>location.href='./admin.html';$('doctor').onchange=e=>{st.doctor=e.target.value;render()};$('search').oninput=e=>{st.search=e.target.value;render()};$('date').onchange=e=>{st.date=new Date(e.target.value+'T00:00:00');render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{st.view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});load();</script></body></html>
