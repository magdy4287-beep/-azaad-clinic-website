<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azaad Clinic — Assessment History</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.k{font-size:28px;font-weight:800}.muted{color:#687386}.bar{height:12px;background:#e7ebf2;border-radius:99px;overflow:hidden}.fill{height:100%;background:#2563eb}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#172033;color:white}input{padding:11px;border:1px solid #ccd3df;border-radius:10px;width:100%;box-sizing:border-box}</style></head>
<body><div class="wrap"><div class="card"><h1>📈 سجل التقييم السريري</h1><p class="muted">عرض تاريخي للنتائج. النتيجة لا تمثل تشخيصًا أو نسبة تحسن سريري بمفردها.</p><div class="grid"><div><div class="muted">المريض</div><div id="patient">—</div></div><div><div class="muted">عدد التقييمات</div><div class="k" id="count">0</div></div><div><div class="muted">آخر نتيجة</div><div class="k" id="latest">—</div></div></div></div><div class="card"><h2>🔎 Patient ID</h2><input id="patientId" placeholder="ضع UUID المريض"><button onclick="load()" style="margin-top:10px">تحميل السجل</button></div><div class="card"><h2>📊 النتائج عبر الزيارات</h2><div id="history">أدخل Patient ID ثم اضغط تحميل.</div></div></div><script>
const SUPABASE_URL='https://derofsthjivlkcdnojww.supabase.co';
const FN=SUPABASE_URL+'/functions/v1/azaad-clinical-assessments';
function esc(x){return String(x??'').replace(/[&<>\\\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[c]))}
async function getToken(){if(window.AZAAD_PATIENT_SESSION?.getAccessToken){const t=await window.AZAAD_PATIENT_SESSION.getAccessToken();if(t)return t}throw new Error('جلسة الطبيب غير موجودة. يرجى تسجيل الدخول أولًا.')}
async function load(){const id=document.getElementById('patientId').value.trim();if(!id)return;document.getElementById('history').textContent='جاري التحميل…';try{const token=await getToken();const r=await fetch(FN+'?action=history&patient_id='+encodeURIComponent(id),{method:'GET',headers:{Accept:'application/json',Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر تحميل السجل');const rows=d.sessions||d.history||[];document.getElementById('count').textContent=rows.length;document.getElementById('patient').textContent=id;document.getElementById('latest').textContent=rows[0]?.score_percent!=null?Number(rows[0].score_percent).toFixed(1)+'%':'—';document.getElementById('history').innerHTML=rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.template_name||x.template_id||'Assessment')}</b><div class="muted">${esc(x.completed_at||x.created_at||'')}</div></div><div style="min-width:160px"><b>${x.score_percent==null?'—':Number(x.score_percent).toFixed(1)+'%'}</b><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(x.score_percent)||0))}%"></div></div></div></div>`).join(''):'لا توجد تقييمات مكتملة.'}catch(e){document.getElementById('history').textContent='خطأ: '+e.message}}
</script></body></html>
