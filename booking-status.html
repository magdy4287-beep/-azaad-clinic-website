<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<meta
  name="theme-color"
  content="#101b56">

<title>
  Azaad Clinic | متابعة الحجز
</title>

<link
  rel="stylesheet"
  href="style.css">

<style>

.status-page {
  min-height: 100vh;
  padding: 60px 20px;
  background: #f7f8fc;
}

.status-container {
  max-width: 760px;
  margin: 0 auto;
}

.status-header {
  text-align: center;
  margin-bottom: 35px;
}

.status-header h1 {
  margin: 10px 0;
}

.status-header p {
  color: #666;
  line-height: 1.8;
}

.status-card {
  background: #fff;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.search-form {
  display: grid;
  gap: 14px;
  margin-bottom: 25px;
}

.search-form input {
  width: 100%;
  box-sizing: border-box;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

.search-form button {
  border: 0;
  cursor: pointer;
  width: 100%;
}

.booking-result {
  display: none;
  margin-top: 25px;
}

.booking-result.show {
  display: block;
}

.booking-code {
  background: #101b56;
  color: white;
  padding: 18px;
  border-radius: 14px;
  text-align: center;
  margin-bottom: 20px;
}

.booking-code strong {
  display: block;
  font-size: 25px;
  margin-top: 7px;
  letter-spacing: 1px;
}

.booking-details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.detail {
  background: #f7f8fc;
  padding: 15px;
  border-radius: 12px;
}

.detail small {
  display: block;
  color: #777;
  margin-bottom: 6px;
}

.detail strong {
  display: block;
  line-height: 1.5;
}

.status-badge {
  display: inline-block;
  padding: 9px 16px;
  border-radius: 30px;
  font-weight: 700;
}

.status-pending {
  background: #fff3cd;
  color: #856404;
}

.status-confirmed {
  background: #d1e7dd;
  color: #0f5132;
}

.status-rejected,
.status-cancelled {
  background: #f8d7da;
  color: #842029;
}

.status-unknown {
  background: #e2e3e5;
  color: #41464b;
}

.result-message {
  padding: 15px;
  border-radius: 10px;
  display: none;
  margin-top: 15px;
  line-height: 1.7;
}

.result-message.error {
  display: block;
  background: #f8d7da;
  color: #842029;
}

.whatsapp-box {
  margin-top: 25px;
  padding-top: 25px;
  border-top: 1px solid #eee;
  text-align: center;
}

.whatsapp-box a {
  display: inline-block;
  text-decoration: none;
}

.back-home {
  display: block;
  text-align: center;
  margin-top: 25px;
  text-decoration: none;
}

@media (max-width: 650px) {

  .status-page {
    padding: 35px 15px;
  }

  .status-card {
    padding: 20px;
  }

  .booking-details {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>


<header class="header">

  <div class="container nav">

    <a
      href="index.html"
      class="logo">

      AZAAD <span>CLINIC</span>

    </a>

  </div>

</header>


<main class="status-page">

  <div class="status-container">


    <div class="status-header">

      <div class="eyebrow">
        AZAAD CLINIC
      </div>

      <h1>
        متابعة الحجز
      </h1>

      <p>
        أدخل رقم الحجز ورقم الهاتف المستخدم عند الحجز لمعرفة حالة موعدك.
      </p>

    </div>


    <div class="status-card">


      <form
        id="statusForm"
        class="search-form">


        <input
          id="bookingCode"
          type="text"
          placeholder="رقم الحجز مثال: AZD-12345678"
          autocomplete="off"
          required>


        <input
          id="bookingPhone"
          type="tel"
          placeholder="رقم الهاتف المستخدم في الحجز"
          autocomplete="tel"
          required>


        <button
          type="submit"
          class="btn">

          البحث عن الحجز

        </button>


      </form>


      <div
        id="resultMessage"
        class="result-message">
      </div>


      <div
        id="bookingResult"
        class="booking-result">


        <div class="booking-code">

          <div>
            رقم الحجز
          </div>

          <strong id="resultCode">
            —
          </strong>

        </div>


        <div class="booking-details">


          <div class="detail">

            <small>
              اسم المريض
            </small>

            <strong id="resultPatient">
              —
            </strong>

          </div>


          <div class="detail">

            <small>
              الطبيب
            </small>

            <strong id="resultDoctor">
              —
            </strong>

          </div>


          <div class="detail">

            <small>
              الخدمة
            </small>

            <strong id="resultService">
              —
            </strong>

          </div>


          <div class="detail">

            <small>
              التاريخ
            </small>

            <strong id="resultDate">
              —
            </strong>

          </div>


          <div class="detail">

            <small>
              الوقت
            </small>

            <strong id="resultTime">
              —
            </strong>

          </div>


          <div class="detail">

            <small>
              نوع الجلسة
            </small>

            <strong id="resultMode">
              —
            </strong>

          </div>


          <div class="detail">

            <small>
              حالة الحجز
            </small>

            <strong>

              <span
                id="resultStatus"
                class="status-badge">

                —

              </span>

            </strong>

          </div>


        </div>


        <div class="whatsapp-box">

          <p>
            هل تحتاج إلى مساعدة بخصوص موعدك؟
          </p>

          <a
            id="resultWhatsapp"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="btn">

            تواصل مع العيادة عبر WhatsApp

          </a>

        </div>


      </div>


      <a
        href="index.html"
        class="back-home">

        ← العودة إلى الصفحة الرئيسية

      </a>


    </div>

  </div>

</main>


<script>


const API =
  'https://derofsthjivlkcdnojww.supabase.co/functions/v1/azaad-clinic';


const $ =
  id => document.getElementById(id);


/* =========================================
   ERROR
========================================= */

function showError(message) {

  $('bookingResult')
    .classList
    .remove('show');

  $('resultMessage')
    .textContent =
      message;

  $('resultMessage')
    .className =
      'result-message error';

}


function clearError() {

  $('resultMessage')
    .textContent = '';

  $('resultMessage')
    .className =
      'result-message';

}


/* =========================================
   STATUS
========================================= */

function getStatusClass(status) {

  const value =
    String(status || '')
      .toLowerCase()
      .trim();


  if (
    value === 'confirmed' ||
    value === 'confirm'
  ) {

    return 'status-confirmed';

  }


  if (
    value === 'rejected' ||
    value === 'reject'
  ) {

    return 'status-rejected';

  }


  if (
    value === 'cancelled' ||
    value === 'canceled' ||
    value === 'cancel'
  ) {

    return 'status-cancelled';

  }


  if (
    value === 'pending'
  ) {

    return 'status-pending';

  }


  return 'status-unknown';

}


function getStatusText(status) {

  const value =
    String(status || '')
      .toLowerCase()
      .trim();


  if (
    value === 'confirmed' ||
    value === 'confirm'
  ) {

    return 'مؤكد';

  }


  if (
    value === 'rejected' ||
    value === 'reject'
  ) {

    return 'مرفوض';

  }


  if (
    value === 'cancelled' ||
    value === 'canceled' ||
    value === 'cancel'
  ) {

    return 'ملغي';

  }


  if (
    value === 'pending'
  ) {

    return 'قيد المراجعة';

  }


  return status || 'غير محدد';

}


/* =========================================
   MODE
========================================= */

function getModeText(mode) {

  if (
    String(mode || '')
      .toLowerCase() === 'online'
  ) {

    return 'جلسة أونلاين';

  }

  return 'داخل العيادة';

}


/* =========================================
   SEARCH BOOKING
========================================= */

async function findBooking(
  code,
  phone
) {

  const url =
    API +
    '?api=booking-status' +
    '&code=' +
    encodeURIComponent(code) +
    '&phone=' +
    encodeURIComponent(phone);


  const response =
    await fetch(url);


  let data = {};


  try {

    data =
      await response.json();

  }

  catch {

    data = {};

  }


  if (!response.ok) {

    throw new Error(
      data.error ||
      'لم يتم العثور على الحجز.'
    );

  }


  return data;

}


/* =========================================
   LOAD CLINIC DATA
========================================= */

async function loadClinicData() {

  try {

    const response =
      await fetch(
        API + '?api=data'
      );


    const data =
      await response.json();


    return data;

  }

  catch {

    return null;

  }

}


/* =========================================
   RENDER BOOKING
========================================= */

async function renderBooking(data) {

  const booking =
    data.booking;


  if (!booking) {

    throw new Error(
      'لم يتم العثور على بيانات الحجز.'
    );

  }


  $('resultCode')
    .textContent =
      booking.booking_code || '—';


  $('resultPatient')
    .textContent =
      booking.patient_name || '—';


  /*
     The current API returns doctor_id
     and service_id.

     We load clinic data and find the
     corresponding names.
  */

  const clinic =
    await loadClinicData();


  let doctorName =
    booking.doctor_id || '—';


  let serviceName =
    booking.service_id || '—';


  if (clinic) {

    const doctor =
      (clinic.doctors || [])
        .find(
          x =>
            String(x.id) ===
            String(booking.doctor_id)
        );


    const service =
      (clinic.services || [])
        .find(
          x =>
            String(x.id) ===
            String(booking.service_id)
        );


    if (doctor)
      doctorName =
        doctor.name;


    if (service)
      serviceName =
        service.name;

  }


  $('resultDoctor')
    .textContent =
      doctorName;


  $('resultService')
    .textContent =
      serviceName;


  $('resultDate')
    .textContent =
      booking.appointment_date ||
      '—';


  $('resultTime')
    .textContent =
      booking.appointment_time ||
      '—';


  $('resultMode')
    .textContent =
      getModeText(
        booking.mode
      );


  const status =
    booking.status ||
    'pending';


  $('resultStatus')
    .textContent =
      getStatusText(status);


  $('resultStatus')
    .className =
      'status-badge ' +
      getStatusClass(status);


  /*
     Get WhatsApp from clinic settings
  */

  if (clinic?.settings?.whatsapp) {

    const number =
      String(
        clinic.settings.whatsapp
      )
      .replace(/\D/g, '');


    if (number) {

      $('resultWhatsapp').href =
        'https://wa.me/' +
        number;

    }

  }


  $('bookingResult')
    .classList
    .add('show');

}


/* =========================================
   FORM
========================================= */

$('statusForm').onsubmit =
  async event => {

    event.preventDefault();


    clearError();


    const code =
      $('bookingCode')
        .value
        .trim()
        .toUpperCase();


    const phone =
      $('bookingPhone')
        .value
        .trim();


    if (!code) {

      showError(
        'من فضلك أدخل رقم الحجز.'
      );

      return;

    }


    if (!phone) {

      showError(
        'من فضلك أدخل رقم الهاتف المستخدم عند الحجز.'
      );

      return;

    }


    const button =
      $('statusForm')
        .querySelector('button');


    const originalText =
      button.textContent;


    button.disabled =
      true;


    button.textContent =
      'جاري البحث...';


    $('bookingResult')
      .classList
      .remove('show');


    try {

      const data =
        await findBooking(
          code,
          phone
        );


      await renderBooking(data);

    }


    catch (error) {

      showError(
        error.message ||
        'تعذر البحث عن الحجز.'
      );

    }


    finally {

      button.disabled =
        false;

      button.textContent =
        originalText;

    }

  };


</script>


</body>
</html>
