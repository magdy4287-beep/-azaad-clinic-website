<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="theme-color"
    content="#101b56">

  <title>
    Azaad Clinic | متابعة الحجز
  </title>

  <link
    rel="stylesheet"
    href="style.css">

  <style>

    .status-page {
      min-height: 100vh;
      padding: 60px 20px;
      background: #f7f8fc;
    }

    .status-container {
      max-width: 760px;
      margin: 0 auto;
    }

    .status-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .status-header h1 {
      margin: 10px 0;
    }

    .status-header p {
      color: #666;
      line-height: 1.8;
    }

    .status-card {
      background: #fff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .search-form {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .search-form input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .search-form button {
      border: 0;
      cursor: pointer;
    }

    .booking-result {
      display: none;
      margin-top: 25px;
    }

    .booking-result.show {
      display: block;
    }

    .booking-code {
      background: #101b56;
      color: white;
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 20px;
    }

    .booking-code strong {
      display: block;
      font-size: 25px;
      margin-top: 7px;
      letter-spacing: 1px;
    }

    .booking-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .detail {
      background: #f7f8fc;
      padding: 15px;
      border-radius: 12px;
    }

    .detail small {
      display: block;
      color: #777;
      margin-bottom: 6px;
    }

    .detail strong {
      display: block;
      line-height: 1.5;
    }

    .status-badge {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 30px;
      font-weight: 700;
    }

    .status-pending {
      background: #fff3cd;
      color: #856404;
    }

    .status-confirmed {
      background: #d1e7dd;
      color: #0f5132;
    }

    .status-rejected,
    .status-cancelled {
      background: #f8d7da;
      color: #842029;
    }

    .status-unknown {
      background: #e2e3e5;
      color: #41464b;
    }

    .result-message {
      padding: 15px;
      border-radius: 10px;
      display: none;
      margin-top: 15px;
    }

    .result-message.error {
      display: block;
      background: #f8d7da;
      color: #842029;
    }

    .whatsapp-box {
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #eee;
      text-align: center;
    }

    .whatsapp-box a {
      display: inline-block;
      text-decoration: none;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 25px;
      text-decoration: none;
    }

    @media (max-width: 650px) {

      .status-page {
        padding: 35px 15px;
      }

      .status-card {
        padding: 20px;
      }

      .search-form {
        flex-direction: column;
      }

      .search-form button {
        width: 100%;
      }

      .booking-details {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

<body>

<header class="header">

  <div class="container nav">

    <a
      href="index.html"
      class="logo">

      AZAAD <span>CLINIC</span>

    </a>

  </div>

</header>


<main class="status-page">

  <div class="status-container">

    <div class="status-header">

      <div class="eyebrow">
        AZAAD CLINIC
      </div>

      <h1>
        متابعة الحجز
      </h1>

      <p>
        أدخل رقم الحجز لمعرفة حالة موعدك وتفاصيل الحجز.
      </p>

    </div>


    <div class="status-card">

      <form
        id="statusForm"
        class="search-form">

        <input
          id="bookingCode"
          type="text"
          placeholder="مثال: AZD-123456"
          autocomplete="off"
          required>

        <button
          type="submit"
          class="btn">

          البحث عن الحجز

        </button>

      </form>


      <div
        id="resultMessage"
        class="result-message">
      </div>


      <div
        id="bookingResult"
        class="booking-result">

        <div class="booking-code">

          <div>
            رقم الحجز
          </div>

          <strong id="resultCode">
            —
          </strong>

        </div>


        <div class="booking-details">

          <div class="detail">

            <small>
              اسم المريض
            </small>

            <strong id="resultPatient">
              —
            </strong>

          </div>


          <div class="detail">

            <small>
              الطبيب
            </small>

            <strong id="resultDoctor">
              —
            </strong>

          </div>


          <div class="detail">

            <small>
              الخدمة
            </small>

            <strong id="resultService">
              —
            </strong>

          </div>


          <div class="detail">

            <small>
              التاريخ
            </small>

            <strong id="resultDate">
              —
            </strong>

          </div>


          <div class="detail">

            <small>
              الوقت
            </small>

            <strong id="resultTime">
              —
            </strong>

          </div>


          <div class="detail">

            <small>
              نوع الجلسة
            </small>

            <strong id="resultMode">
              —
            </strong>

          </div>


          <div class="detail">

            <small>
              حالة الحجز
            </small>

            <strong>

              <span
                id="resultStatus"
                class="status-badge">

                —

              </span>

            </strong>

          </div>

        </div>


        <div class="whatsapp-box">

          <p>
            هل تحتاج إلى مساعدة بخصوص موعدك؟
          </p>

          <a
            id="resultWhatsapp"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="btn">

            تواصل مع العيادة عبر WhatsApp

          </a>

        </div>

      </div>


      <a
        href="index.html"
        class="back-home">

        ← العودة إلى الصفحة الرئيسية

      </a>

    </div>

  </div>

</main>


<script>

const API =
  'https://derofsthjivlkcdnojww.supabase.co/functions/v1/azaad-clinic';


const $ = id =>
  document.getElementById(id);


const esc = value =>
  String(value ?? '').replace(
    /[&<>"']/g,
    char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    }[char])
  );


function showError(message) {

  $('bookingResult')
    .classList
    .remove('show');

  $('resultMessage')
    .textContent = message;

  $('resultMessage')
    .className =
      'result-message error';

}


function clearError() {

  $('resultMessage')
    .textContent = '';

  $('resultMessage')
    .className =
      'result-message';

}


function getStatusClass(status) {

  const value =
    String(status || '')
      .toLowerCase();

  if (
    value.includes('confirm')
  )
    return 'status-confirmed';

  if (
    value.includes('reject') ||
    value.includes('cancel')
  )
    return 'status-rejected';

  if (
    value.includes('pending')
  )
    return 'status-pending';

  return 'status-unknown';

}


function getStatusText(status) {

  const value =
    String(status || '')
      .toLowerCase();

  if (
    value.includes('confirm')
  )
    return 'مؤكد';

  if (
    value.includes('reject')
  )
    return 'مرفوض';

  if (
    value.includes('cancel')
  )
    return 'ملغي';

  if (
    value.includes('pending')
  )
    return 'قيد المراجعة';

  return status || 'غير محدد';

}


function getModeText(mode) {

  if (
    mode === 'online'
  )
    return 'جلسة أونلاين';

  return 'داخل العيادة';

}


async function findBooking(code) {

  const response =
    await fetch(
      API +
      '?api=booking&code=' +
      encodeURIComponent(code)
    );


  let data = {};

  try {

    data =
      await response.json();

  } catch {

    data = {};

  }


  if (!response.ok) {

    throw new Error(
      data.error ||
      'لم يتم العثور على الحجز.'
    );

  }


  return data;

}


function renderBooking(data) {

  /*
     The function accepts common response formats
     so it can work with the existing API.
  */

  const booking =
    data.booking ||
    data.data ||
    data;


  if (
    !booking ||
    (
      !booking.id &&
      !booking.booking_code &&
      !booking.code
    )
  ) {

    throw new Error(
      'لم يتم العثور على الحجز بهذا الرقم.'
    );

  }


  const code =
    booking.booking_code ||
    booking.code ||
    '—';


  $('resultCode')
    .textContent = code;


  $('resultPatient')
    .textContent =
      booking.patient_name ||
      booking.name ||
      '—';


  $('resultDoctor')
    .textContent =
      booking.doctor_name ||
      booking.doctor?.name ||
      '—';


  $('resultService')
    .textContent =
      booking.service_name ||
      booking.service?.name ||
      '—';


  $('resultDate')
    .textContent =
      booking.appointment_date ||
      booking.date ||
      '—';


  $('resultTime')
    .textContent =
      booking.appointment_time ||
      booking.time ||
      '—';


  $('resultMode')
    .textContent =
      getModeText(
        booking.mode
      );


  const status =
    booking.status ||
    'pending';


  $('resultStatus')
    .textContent =
      getStatusText(status);


  $('resultStatus')
    .className =
      'status-badge ' +
      getStatusClass(status);


  /*
     Clinic WhatsApp number.
     This is intentionally kept separate
     from the language system of the main website.
  */

  const whatsapp =
    '';


  /*
     The main website already stores the clinic
     WhatsApp number in settings.
     We retrieve it from the same API.
  */

  loadWhatsapp();


  $('bookingResult')
    .classList
    .add('show');

}


async function loadWhatsapp() {

  try {

    const response =
      await fetch(
        API + '?api=data'
      );

    const data =
      await response.json();

    const whatsapp =
      data.settings?.whatsapp || '';


    const number =
      String(whatsapp)
        .replace(/\D/g, '');


    if (number) {

      $('resultWhatsapp').href =
        'https://wa.me/' +
        number;

    }

  }

  catch {

    $('resultWhatsapp').href =
      '#';

  }

}


$('statusForm').onsubmit =
  async event => {

    event.preventDefault();

    clearError();


    const code =
      $('bookingCode')
        .value
        .trim();


    if (!code) {

      showError(
        'من فضلك أدخل رقم الحجز.'
      );

      return;

    }


    $('bookingResult')
      .classList
      .remove('show');


    try {

      const data =
        await findBooking(code);

      renderBooking(data);

    }

    catch (error) {

      showError(
        error.message ||
        'تعذر البحث عن الحجز.'
      );

    }

  };

</script>

</body>
</html>
