<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azaad Clinic | Patient 360</title>
<style>
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f7fb;color:#17214f}.wrap{max-width:1400px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #0000000b}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar button{padding:11px;border:1px solid #d8deeb;border-radius:9px}.toolbar input{min-width:240px}.toolbar button{background:#17214f;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.n{font-size:24px;font-weight:900}.muted{color:#6d768c}.danger{color:#a32939}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}.results button{display:block;width:100%;text-align:right;padding:12px;border:0;border-bottom:1px solid #eee;background:#fff;cursor:pointer}.hidden{display:none}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;margin:3px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap">
<div class="card"><h1>👤 Patient 360</h1><p class="muted">بحث المريض بالاسم أو MRN أو الهاتف، ثم عرض الحجوزات والفواتير والمدفوعات والمتابعات والتنبيهات.</p><div class="toolbar"><input id="search" placeholder="الاسم / MRN / الهاتف"><button onclick="findPatients()">🔎 بحث</button><button onclick="clearAll()">🧹 مسح</button><button onclick="toggleLang()">العربية / English</button></div><div id="err" class="danger"></div><div id="results" class="results"></div></div>
<section id="workspace" class="hidden">
<div class="card"><h2 id="patientTitle">👤 المريض</h2><div id="patientInfo"></div></div>
<div id="summary" class="grid"></div>
<div class="card"><h2>📅 الحجوزات</h2><div id="bookings" class="table"></div></div>
<div class="card"><h2>🧾 الفواتير</h2><div id="invoices" class="table"></div></div>
<div class="card"><h2>💳 المدفوعات</h2><div id="payments" class="table"></div></div>
<div class="card"><h2>🔄 المتابعات</h2><div id="followups" class="table"></div></div>
</section></main>
<script>
const BASE='https://derofsthjivlkcdnojww.supabase.co/functions/v1';const KEY='sb_publishable_GC253fvQebNBsDOaKjWGRw_tPYJrgLa';
const $=id=>document.getElementById(id);
async function getToken(){
  if(window.AZAAD_PATIENT_SESSION?.getAccessToken){const t=await window.AZAAD_PATIENT_SESSION.getAccessToken();if(t)return t}
  throw Error('🔐 جلسة الإدارة غير موجودة. يرجى تسجيل الدخول أولًا.');
}
async function api(path,opts={}){const token=await getToken();const headers={apikey:KEY,Accept:'application/json',Authorization:'Bearer '+token,...(opts.headers||{})};const r=await fetch(BASE+path,{...opts,headers,cache:'no-store'});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'HTTP '+r.status);return b}
async function findPatients(){try{$('err').textContent='';const q=encodeURIComponent($('search').value.trim());const b=await api('/azaad-patients?api=patients&search='+q);$('results').innerHTML=(b.patients||[]).map(p=>`<button onclick="openPatient('${escAttr(p.id)}')"><b>${esc(p.patient_name||'-')}</b> — MRN: ${esc(p.mrn||'-')} — 📱 ${esc(p.patient_phone||'-')} — 📅 ${p.booking_count||0} حجز</button>`).join('')||'<p class="muted">لا توجد نتائج.</p>'}catch(e){$('err').textContent=e.message}}
async function openPatient(id){try{$('err').textContent='';const b=await api('/azaad-patients?api=patient&id='+encodeURIComponent(id));const p=b.patient;if(!p)throw Error('لم يتم العثور على ملف المريض');$('workspace').classList.remove('hidden');$('patientTitle').textContent='👤 '+(p.patient_name||'-')+' — MRN '+(p.mrn||'-');$('patientInfo').innerHTML=`<span class="pill">📱 ${esc(p.patient_phone||'-')}</span><span class="pill">✉️ ${esc(p.patient_email||'-')}</span><span class="pill">🎂 ${esc(p.date_of_birth||'-')}</span><span class="pill">⚧ ${esc(p.gender||'-')}</span>${(b.warnings||[]).map(x=>`<span class="pill">⚠️ ${esc(x)}</span>`).join('')}`;const inv=b.invoices||[],pay=b.payments||[];const total=inv.reduce((s,x)=>s+Number(x.total||x.amount||0),0),paid=pay.reduce((s,x)=>s+Number(x.amount||0),0);$('summary').innerHTML=[['📅','الحجوزات',(b.bookings||[]).length],['🧾','الفواتير',inv.length],['💳','المدفوع',money(paid)],['⚠️','المتبقي',money(Math.max(total-paid,0))]].map(x=>`<div class="card"><div>${x[0]} ${x[1]}</div><div class="n">${x[2]}</div></div>`).join('');renderBookings(b.bookings||[]);renderInvoices(inv);renderPayments(pay);renderFollowups(b.followups||[]);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}catch(e){$('err').textContent=e.message}}
function renderBookings(a){$('bookings').innerHTML=a.length?'<table><tr><th>رقم</th><th>التاريخ</th><th>الوقت</th><th>الطبيب</th><th>الحالة</th></tr>'+a.map(x=>`<tr><td>${esc(x.booking_code||x.booking_number||'-')}</td><td>${esc(x.appointment_date||'-')}</td><td>${esc(x.appointment_time||'-')}</td><td>${esc(x.doctor_name||x.doctor_id||'-')}</td><td>${esc(x.status||'-')}</td></tr>`).join('')+'</table>':'<p class="muted">لا توجد حجوزات.</p>'}
function renderInvoices(a){$('invoices').innerHTML=a.length?'<table><tr><th>الفاتورة</th><th>التاريخ</th><th>الإجمالي</th><th>الحالة</th></tr>'+a.map(x=>`<tr><td>${esc(x.invoice_number||x.invoice_code||x.id||'-')}</td><td>${esc(x.created_at||'-')}</td><td>${money(x.total||x.amount)}</td><td>${esc(x.status||'-')}</td></tr>`).join('')+'</table>':'<p class="muted">لا توجد فواتير.</p>'}
function renderPayments(a){$('payments').innerHTML=a.length?'<table><tr><th>التاريخ</th><th>المبلغ</th><th>طريقة الدفع</th><th>المرجع</th></tr>'+a.map(x=>`<tr><td>${esc(x.payment_date||x.paid_at||'-')}</td><td>${money(x.amount)}</td><td>${esc(x.payment_method||'-')}</td><td>${esc(x.reference||x.transaction_id||'-')}</td></tr>`).join('')+'</table>':'<p class="muted">لا توجد مدفوعات.</p>'}
function renderFollowups(a){$('followups').innerHTML=a.length?'<table><tr><th>النوع</th><th>الحالة</th><th>الاستحقاق</th></tr>'+a.map(x=>`<tr><td>${esc(x.followup_type||'-')}</td><td>${esc(x.status||'-')}</td><td>${esc(x.due_at||x.due_date||'-')}</td></tr>`).join('')+'</table>':'<p class="muted">لا توجد متابعات.</p>'}
function money(v){return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2})+' EGP'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(v){return String(v??'').replace(/[^a-zA-Z0-9_-]/g,'')}function clearAll(){$('search').value='';$('results').innerHTML='';$('workspace').classList.add('hidden');$('err').textContent=''}function toggleLang(){const en=document.documentElement.lang!=='en';document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';localStorage.setItem('azaad_admin_language',en?'en':'ar')}
</script></body></html>
