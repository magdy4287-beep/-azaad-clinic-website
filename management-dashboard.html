<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azaad Clinic | Management Dashboard</title><style>body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f7fb;color:#17214f}.wrap{max-width:1400px;margin:auto;padding:18px}.top{background:#fff;border-radius:16px;padding:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 5px 18px #0000000b}.n{font-size:28px;font-weight:900;margin-top:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar button{padding:10px;border:1px solid #d8deeb;border-radius:9px;background:#fff}.toolbar button{background:#17214f;color:#fff;cursor:pointer}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:right}.login{max-width:430px;margin:12vh auto}.login input,.login button{width:100%;padding:12px;margin:7px 0;border:1px solid #d8deeb;border-radius:9px;box-sizing:border-box}.login button{background:#17214f;color:#fff}.hidden{display:none}.muted{color:#6d768c}.danger{color:#a32939}.ok{color:#167345}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body>
<div id="login" class="wrap login"><div class="card"><h1>🏥 AZAAD CLINIC</h1><p class="muted">لوحة الإدارة الذكية</p><input id="identifier" placeholder="اسم المستخدم أو البريد"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="login()">🔐 دخول</button><p id="err" class="danger"></p></div></div>
<div id="app" class="wrap hidden"><div class="top"><div><h1>📊 Management Dashboard</h1><div id="range" class="muted"></div></div><div><button onclick="load()">🔄 تحديث</button> <button onclick="logout()">🚪 خروج</button> <button onclick="toggleLang()">العربية / English</button></div></div><div class="toolbar"><input id="from" type="date"><input id="to" type="date"><button onclick="load()">عرض الفترة</button></div><div id="kpis" class="grid"></div><div class="card"><h2>🧑‍⚕️ أداء الأطباء</h2><div id="doctors" class="table"></div></div><div class="card"><h2>🚨 التنبيهات</h2><div id="alerts" class="table"></div></div><div class="card"><h2>🔄 المتابعات</h2><div id="followups" class="table"></div></div><div class="card"><h2>📅 الحجوزات</h2><div id="bookings" class="table"></div></div></div>
<script>
const BASE='https://derofsthjivlkcdnojww.supabase.co/functions/v1';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlcm9mc3Roaml2bGtjZG5vand3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTAzODZ9';
const TOKEN_KEY='azaad_admin_token';let lang=localStorage.getItem('azaad_admin_language')||'ar';
const $=id=>document.getElementById(id);const today=new Date().toISOString().slice(0,10);$('from').value=today;$('to').value=today;
async function api(path,opts={}){const token=sessionStorage.getItem(TOKEN_KEY)||localStorage.getItem(TOKEN_KEY)||'';const headers={apikey:KEY,Accept:'application/json',...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(BASE+path,{...opts,headers,cache:'no-store'});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'HTTP '+r.status);return b}
async function login(){ $('err').textContent='';try{const b=await api('/azaad-admin?api=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:$('identifier').value,password:$('password').value})});if(!b.token)throw Error(b.error||'فشل الدخول');sessionStorage.setItem(TOKEN_KEY,b.token);$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('err').textContent=e.message}}
async function load(){try{const b=await api('/azaad-management-dashboard?from='+$('from').value+'&to='+$('to').value);$('range').textContent=b.from+' → '+b.to;renderKpis(b.kpis);renderDoctors(b.doctor_performance);renderAlerts(b.alerts);renderFollowups(b.followups);renderBookings(b.bookings)}catch(e){$('range').textContent='⚠️ '+e.message}}
function money(v){return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2})+' EGP'}
function renderKpis(k){const a=[['📅','الحجوزات',k.bookings],['✅','مكتمل',k.completed],['🚫','No-Show',k.no_show],['📈','نسبة الإنجاز',k.completion_rate+'%'],['🧾','الفواتير',money(k.invoiced)],['💳','التحصيل',money(k.collected)],['💸','المصروفات',money(k.expenses)],['💰','صافي التدفق',money(k.net_cash_flow)],['⚠️','المستحق',money(k.outstanding)],['🚨','التنبيهات',k.open_alerts],['🔄','المتابعات',k.open_followups],['👥','الموظفون النشطون',k.active_staff]];$('kpis').innerHTML=a.map(x=>`<div class="card"><div>${x[0]} ${x[1]}</div><div class="n">${x[2]}</div></div>`).join('')}
function renderDoctors(a){$('doctors').innerHTML='<table><tr><th>الطبيب</th><th>الحجوزات</th><th>مكتمل</th><th>No-Show</th><th>الإنجاز</th><th>الفواتير</th><th>التحصيل</th><th>المستحق</th></tr>'+a.map(x=>`<tr><td>${x.doctor_name||'-'}</td><td>${x.total_bookings}</td><td>${x.completed}</td><td>${x.no_show}</td><td>${x.completion_rate}%</td><td>${money(x.invoiced)}</td><td>${money(x.collected)}</td><td>${money(x.outstanding)}</td></tr>`).join('')+'</table>'}
function renderAlerts(a){$('alerts').innerHTML=a.length?'<table><tr><th>الخطورة</th><th>العنوان</th><th>الرسالة</th><th>الاستحقاق</th></tr>'+a.map(x=>`<tr><td>${x.severity}</td><td>${x.title}</td><td>${x.message||''}</td><td>${x.due_at||''}</td></tr>`).join('')+'</table>':'<p class="muted">لا توجد تنبيهات مفتوحة.</p>'}
function renderFollowups(a){$('followups').innerHTML=a.length?'<table><tr><th>النوع</th><th>الحالة</th><th>المريض</th><th>الاستحقاق</th></tr>'+a.map(x=>`<tr><td>${x.followup_type}</td><td>${x.status}</td><td>${x.patient_id||'-'}</td><td>${x.due_at||''}</td></tr>`).join('')+'</table>':'<p class="muted">لا توجد متابعات مفتوحة.</p>'}
function renderBookings(a){$('bookings').innerHTML=a.length?'<table><tr><th>رقم الحجز</th><th>المريض</th><th>الهاتف</th><th>التاريخ</th><th>الوقت</th><th>الحالة</th></tr>'+a.map(x=>`<tr><td>${x.booking_code||'-'}</td><td>${x.patient_name||'-'}</td><td>${x.patient_phone||'-'}</td><td>${x.appointment_date}</td><td>${x.appointment_time||''}</td><td>${x.status}</td></tr>`).join('')+'</table>':'<p class="muted">لا توجد حجوزات في الفترة.</p>'}
function logout(){sessionStorage.removeItem(TOKEN_KEY);localStorage.removeItem(TOKEN_KEY);location.reload()}function toggleLang(){lang=lang==='ar'?'en':'ar';localStorage.setItem('azaad_admin_language',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr'}
if(sessionStorage.getItem(TOKEN_KEY)||localStorage.getItem(TOKEN_KEY)){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
</script></body></html>
