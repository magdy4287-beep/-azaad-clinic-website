<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azaad Clinic — Doctor Patient Tools</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.tool{display:block;text-decoration:none;color:inherit;border:1px solid #e3e8f0;border-radius:14px;padding:18px}.tool:hover{box-shadow:0 5px 20px #0001}.muted{color:#687386}button{border:0;border-radius:10px;padding:10px 14px;background:#172033;color:#fff;cursor:pointer}input{padding:11px;border:1px solid #ccd3df;border-radius:10px;width:100%;box-sizing:border-box}</style></head><body><main class="wrap"><div class="card"><h1>👨‍⚕️ لوحة أدوات الطبيب</h1><p class="muted">كل أدوات المريض السرية في مكان واحد. اختر المريض أولًا ثم افتح الأداة المطلوبة.</p><input id="pid" placeholder="Patient ID / UUID"><button onclick="go()" style="margin-top:10px">فتح الأدوات</button></div><div id="tools" class="grid"></div></main><script>const tools=[['🩺','Clinical Record','السجل السريري والتقدم','clinical-record.html'],['🧠','Clinical Assessment','التقييم السريري والأسئلة','clinical-assessment.html'],['📈','Assessment History','تاريخ نتائج التقييمات','clinical-assessment-history.html'],['🤖','Follow-up Assistant','مساعد متابعة الطبيب','doctor-followup-assistant.html']];function esc(x){return String(x).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}function go(){const id=document.getElementById('pid').value.trim();if(!id)return;document.getElementById('tools').innerHTML=tools.map(t=>`<a class="tool" href="${t[3]}?patient_id=${encodeURIComponent(id)}"><div style="font-size:30px">${t[0]}</div><h2>${esc(t[1])}</h2><div class="muted">${esc(t[2])}</div></a>`).join('')} </script></body></html>
