<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AZAAD | تغيير كلمة المرور</title>
  <style>
    body{font-family:Arial,Tahoma,sans-serif;background:#f5f7fb;color:#18213d;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    .card{width:min(460px,100%);background:#fff;border-radius:16px;padding:24px;box-shadow:0 7px 25px rgba(0,0,0,.06)}
    label{display:block;font-weight:700;margin:14px 0}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d9deea;border-radius:10px;margin-top:7px}button{width:100%;padding:12px;border:0;border-radius:10px;background:#17214f;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.msg{margin-top:14px;padding:11px;border-radius:10px;display:none}.error{display:block;background:#fff0f2;color:#a32939}.ok{display:block;background:#e7f7ed;color:#167345}.muted{color:#6c758c;font-size:14px;line-height:1.6}
  </style>
</head>
<body>
  <main class="card">
    <h2>تغيير كلمة المرور</h2>
    <p class="muted">يتم فحص كلمة المرور الجديدة مجانًا مقابل قاعدة كلمات المرور المسربة باستخدام k-anonymity. لا يتم إرسال كلمة المرور نفسها أو بصمتها الكاملة.</p>
    <form id="form">
      <label>كلمة المرور الجديدة<input id="password" type="password" minlength="12" autocomplete="new-password" required></label>
      <label>تأكيد كلمة المرور<input id="confirm" type="password" minlength="12" autocomplete="new-password" required></label>
      <button id="submit" type="submit">تحديث كلمة المرور</button>
      <div id="message" class="msg"></div>
    </form>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { assertSafePassword } from './password-security.js';

    const supabase = createClient(
      'https://derofsthjivlkcdnojww.supabase.co',
      'sb_publishable_GC253fvQebNBsDOaKjWGRw_tPYJrgLa',
      { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
    );

    const form = document.getElementById('form');
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm');
    const submit = document.getElementById('submit');
    const message = document.getElementById('message');

    function show(text, ok = false) {
      message.textContent = text;
      message.className = `msg ${ok ? 'ok' : 'error'}`;
    }

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      show('يجب تسجيل الدخول أولًا لتغيير كلمة المرور.');
      submit.disabled = true;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.className = 'msg';
      submit.disabled = true;

      try {
        if (password.value.length < 12) throw new Error('استخدم كلمة مرور من 12 حرفًا على الأقل.');
        if (password.value !== confirm.value) throw new Error('كلمتا المرور غير متطابقتين.');

        await assertSafePassword(password.value);

        const { error } = await supabase.auth.updateUser({ password: password.value });
        if (error) throw error;

        password.value = '';
        confirm.value = '';
        show('تم تغيير كلمة المرور بنجاح.', true);
      } catch (error) {
        if (error?.code === 'PASSWORD_COMPROMISED') {
          show('كلمة المرور الجديدة ظهرت في تسريبات معروفة. اختر كلمة مرور مختلفة وفريدة.');
        } else {
          show(error?.message || 'تعذر تغيير كلمة المرور.');
        }
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
