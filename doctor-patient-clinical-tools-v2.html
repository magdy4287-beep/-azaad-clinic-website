<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azaad Clinic — Doctor Clinical Tools</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.tool{display:block;text-decoration:none;color:inherit;border:1px solid #e3e8f0;border-radius:14px;padding:18px}.muted{color:#687386}.denied{border:1px solid #f1c7c7;background:#fff5f5;color:#8b1e1e;border-radius:12px;padding:14px}button{border:0;border-radius:10px;padding:10px 14px;background:#172033;color:#fff;cursor:pointer}input{padding:11px;border:1px solid #ccd3df;border-radius:10px;width:100%;box-sizing:border-box}</style></head><body><main class="wrap"><div class="card"><h1>👨‍⚕️ أدوات المريض السريرية</h1><p class="muted">الصلاحيات تأتي مباشرة من Supabase قبل إظهار الأدوات.</p><input id="pid" placeholder="Patient ID / UUID"><button onclick="go()" style="margin-top:10px">فتح الأدوات</button><div id="status" class="muted" style="margin-top:10px"></div></div><div id="tools" class="grid"></div></main><script src="patient-session-bridge-v3.js"></script><script src="doctor-clinical-permission-gate.js"></script><script>const items=[['clinical_assessment','🧠','Clinical Assessment','التقييم السريري','clinical-assessment.html'],['clinical_assessment_history','📈','Assessment History','السجل التاريخي','clinical-assessment-history.html'],['clinical_safety','🚨','Clinical Safety','التنبيهات السريرية','clinical-record.html'],['clinical_assessment','🩺','Clinical Record','السجل السريري','clinical-record.html'],['clinical_assessment','🤖','Follow-up Assistant','مساعد المتابعة','doctor-followup-assistant.html']];function esc(x){return String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function go(){const id=document.getElementById('pid').value.trim(),s=document.getElementById('status'),o=document.getElementById('tools');if(!id){s.textContent='أدخل Patient ID أولًا.';return}s.textContent='🔐 جارٍ التحقق...';o.innerHTML='';try{const p=await window.AZAAD_CLINICAL_PERMISSION_GATE.get();const a=items.filter(x=>p[x[0]]===true);if(!a.length){o.innerHTML='<div class="denied">🙅‍♀️ لا توجد صلاحية سريرية لهذا الحساب.</div>';s.textContent='';return}o.innerHTML=a.map(x=>`<a class="tool" href="${x[4]}?patient_id=${encodeURIComponent(id)}"><div style="font-size:30px">${x[1]}</div><h2>${esc(x[2])}</h2><div class="muted">${esc(x[3])}</div></a>`).join('');s.textContent='✅ تم تطبيق صلاحيات Supabase.'}catch(e){o.innerHTML=`<div class="denied">🔐 ${esc(e.message)}</div>`;s.textContent=''}}</script></body></html>
