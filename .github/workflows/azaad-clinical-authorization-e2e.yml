name: Azaad Clinical Authorization E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azaad-clinical-authorization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clinical-authorization-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v5

      - name: Verify exact commit under test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify controlled E2E configuration
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_FRONTDESK_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
          AZAAD_E2E_NONSTAFF_PASSWORD: ${{ secrets.AZAAD_E2E_NONSTAFF_PASSWORD }}
          AZAAD_E2E_DOCTOR_A_PASSWORD: ${{ secrets.AZAAD_E2E_DOCTOR_A_PASSWORD }}
          AZAAD_E2E_DOCTOR_B_PASSWORD: ${{ secrets.AZAAD_E2E_DOCTOR_B_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AZAAD_SUPABASE_URL AZAAD_SUPABASE_ANON_KEY AZAAD_E2E_FRONTDESK_PASSWORD AZAAD_E2E_NONSTAFF_PASSWORD AZAAD_E2E_DOCTOR_A_PASSWORD AZAAD_E2E_DOCTOR_B_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing required controlled-E2E secret: $name" >&2; exit 1; }
          done
          normalized_url="$(printf '%s' "$AZAAD_SUPABASE_URL" | sed 's/[[:space:]]*$//; s#/*$##')"
          parsed_host="$(node -e 'const u=new URL(process.argv[1]); process.stdout.write(u.hostname)' "$normalized_url" 2>/dev/null || true)"
          parsed_path="$(node -e 'const u=new URL(process.argv[1]); process.stdout.write(u.pathname)' "$normalized_url" 2>/dev/null || true)"
          case "$normalized_url" in https://*.supabase.co) ;; *) echo "AZAAD_SUPABASE_URL is not a Supabase project URL" >&2; exit 1 ;; esac
          test -n "$parsed_host" || { echo "AZAAD_SUPABASE_URL is not a valid URL" >&2; exit 1; }
          test "$parsed_path" = "/" || test -z "$parsed_path" || { echo "AZAAD_SUPABASE_URL must contain only the project origin" >&2; exit 1; }
          printf 'AZAAD_SUPABASE_URL=%s\n' "$normalized_url" >> "$GITHUB_ENV"
          echo "Controlled clinical authorization E2E configuration is present."

      - name: Authenticate controlled Frontdesk identity
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_FRONTDESK_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const base = (process.env.AZAAD_SUPABASE_URL || '').trim().replace(/\/+$/, '');
            const anon = process.env.AZAAD_SUPABASE_ANON_KEY;
            const password = process.env.AZAAD_E2E_FRONTDESK_PASSWORD;
            if (!base || !anon || !password) throw new Error('Missing Frontdesk Auth configuration');
            const response = await fetch(`${base}/functions/v1/staff-login`, { method: 'POST', headers: { apikey: anon, Authorization: `Bearer ${anon}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'frontdesk_azaad', password }) });
            const raw = await response.text(); let body = {}; try { body = JSON.parse(raw); } catch {}
            if (!response.ok) throw new Error(`Frontdesk staff-login failed with HTTP ${response.status}; code=${typeof body?.code === 'string' ? body.code : 'NO_ERROR_CODE'}; error=${typeof body?.error === 'string' ? body.error : 'NO_ERROR_MESSAGE'}`);
            const token = (body.access_token || body.session?.access_token || '').trim();
            if (!/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(token)) throw new Error('Frontdesk staff-login did not return a valid JWT');
            if (!(body.user?.id || body.session?.user?.id)) throw new Error('Frontdesk staff-login returned no authenticated user identity');
            process.stdout.write(`::add-mask::${token}\n`); fs.appendFileSync(process.env.GITHUB_ENV, `AZAAD_E2E_FRONTDESK_TOKEN=${token}\n`); console.log('Frontdesk staff identity verified.');
          })().catch(e => { console.error(e instanceof Error ? e.message : e); process.exit(1); });
          NODE

      - name: Capture Frontdesk issuance telemetry
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_FRONTDESK_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const base = (process.env.AZAAD_SUPABASE_URL || '').trim().replace(/\/+$/, '');
            const anon = process.env.AZAAD_SUPABASE_ANON_KEY;
            const password = process.env.AZAAD_E2E_FRONTDESK_PASSWORD;
            const response = await fetch(`${base}/functions/v1/staff-login`, { method: 'POST', headers: { apikey: anon, Authorization: `Bearer ${anon}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'frontdesk_azaad', password }) });
            const date = response.headers.get('date');
            console.log(`Frontdesk issuance telemetry: status=${response.status}; date=${date || 'MISSING'}`);
            if (!response.ok) process.exit(1);
          })().catch(e => { console.error(e instanceof Error ? e.message : e); process.exit(1); });
          NODE

      - name: Authenticate controlled Nonstaff identity
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_NONSTAFF_PASSWORD: ${{ secrets.AZAAD_E2E_NONSTAFF_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const base = (process.env.AZAAD_SUPABASE_URL || '').trim().replace(/\/+$/, ''); const anon = process.env.AZAAD_SUPABASE_ANON_KEY; const password = process.env.AZAAD_E2E_NONSTAFF_PASSWORD;
            const response = await fetch(`${base}/auth/v1/token?grant_type=password`, { method: 'POST', headers: { apikey: anon, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: 'e2e_nonstaff@azaad-clinic.test', password }) });
            const raw = await response.text(); let body = {}; try { body = JSON.parse(raw); } catch {}
            if (!response.ok) throw new Error(`Nonstaff Supabase Auth sign-in failed with HTTP ${response.status}`);
            const token = (body.access_token || '').trim(); if (!/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(token) || !body.user?.id) throw new Error('Nonstaff Auth did not return a valid identity');
            process.stdout.write(`::add-mask::${token}\n`); fs.appendFileSync(process.env.GITHUB_ENV, `AZAAD_E2E_NONSTAFF_TOKEN=${token}\n`); console.log('Nonstaff Auth identity verified.');
          })().catch(e => { console.error(e instanceof Error ? e.message : e); process.exit(1); });
          NODE

      - name: Authenticate controlled Doctor A identity
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_DOCTOR_A_PASSWORD: ${{ secrets.AZAAD_E2E_DOCTOR_A_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          (async () => { const base=(process.env.AZAAD_SUPABASE_URL||'').trim().replace(/\/+$/,''); const anon=process.env.AZAAD_SUPABASE_ANON_KEY; const password=process.env.AZAAD_E2E_DOCTOR_A_PASSWORD; const r=await fetch(`${base}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:anon,'Content-Type':'application/json'},body:JSON.stringify({email:'doctor_lamia@azaad.local',password})}); const raw=await r.text(); let b={}; try{b=JSON.parse(raw)}catch{} if(!r.ok)throw new Error(`Doctor A Supabase Auth sign-in failed with HTTP ${r.status}`); const t=(b.access_token||'').trim(); if(!/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(t)||!b.user?.id)throw new Error('Doctor A Auth did not return a valid identity'); process.stdout.write(`::add-mask::${t}\n`); fs.appendFileSync(process.env.GITHUB_ENV,`AZAAD_E2E_DOCTOR_A_TOKEN=${t}\n`); console.log('Doctor A Auth identity verified.'); })().catch(e=>{console.error(e instanceof Error?e.message:e);process.exit(1)});
          NODE

      - name: Authenticate controlled Doctor B identity
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_DOCTOR_B_PASSWORD: ${{ secrets.AZAAD_E2E_DOCTOR_B_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          (async () => { const base=(process.env.AZAAD_SUPABASE_URL||'').trim().replace(/\/+$/,''); const anon=process.env.AZAAD_SUPABASE_ANON_KEY; const password=process.env.AZAAD_E2E_DOCTOR_B_PASSWORD; const r=await fetch(`${base}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:anon,'Content-Type':'application/json'},body:JSON.stringify({email:'doctor.amgad@azaad.local',password})}); const raw=await r.text(); let b={}; try{b=JSON.parse(raw)}catch{} if(!r.ok)throw new Error(`Doctor B Supabase Auth sign-in failed with HTTP ${r.status}`); const t=(b.access_token||'').trim(); if(!/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(t)||!b.user?.id)throw new Error('Doctor B Auth did not return a valid identity'); process.stdout.write(`::add-mask::${t}\n`); fs.appendFileSync(process.env.GITHUB_ENV,`AZAAD_E2E_DOCTOR_B_TOKEN=${t}\n`); console.log('Doctor B Auth identity verified.'); })().catch(e=>{console.error(e instanceof Error?e.message:e);process.exit(1)});
          NODE

      - name: Verify controlled Auth identities
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => { const base=(process.env.AZAAD_SUPABASE_URL||'').trim().replace(/\/+$/,''); const anon=process.env.AZAAD_SUPABASE_ANON_KEY; for(const [name,t] of Object.entries({frontdesk:process.env.AZAAD_E2E_FRONTDESK_TOKEN,nonstaff:process.env.AZAAD_E2E_NONSTAFF_TOKEN,doctorA:process.env.AZAAD_E2E_DOCTOR_A_TOKEN,doctorB:process.env.AZAAD_E2E_DOCTOR_B_TOKEN})){const r=await fetch(`${base}/auth/v1/user`,{headers:{apikey:anon,Authorization:`Bearer ${t}`}}); console.log(`${name} /user: status=${r.status}; date=${r.headers.get('date')||'MISSING'}`); if(!r.ok)process.exit(1);} })().catch(e=>{console.error(e instanceof Error?e.message:e);process.exit(1)});
          NODE

      - name: Run clinical authorization E2E
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
        run: npx playwright test qa/clinical-authorization-e2e.spec.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azaad-clinical-authorization-e2e-report
          path: playwright-report/
          if-no-files-found: ignore

# This gate deliberately fails when controlled test credentials are absent.
# Fixture booking IDs are generated by the authenticated factory at runtime.
# It never falls back to fake credentials and never weakens RLS/RPC authorization.
