name: Azaad Clinical Authorization E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: azaad-clinical-authorization-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clinical-authorization-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v5

      - name: Verify exact commit under test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Root scan clinical runtime surfaces for retired Supabase dependency
        shell: bash
        run: |
          set -euo pipefail
          for file in frontdesk-checkin-workflow.js api/frontdesk-checkin.js; do
            test -f "$file" || { echo "FAIL-CLOSED: missing clinical runtime surface: $file"; exit 1; }
            if grep -Ein 'supabase\.co|AZAAD_SUPABASE|supabase\.auth|createSupabaseClient|/rest/v1/rpc/' "$file"; then
              echo "FAIL-CLOSED: retired Supabase dependency remains in $file"
              exit 1
            fi
          done
          echo 'Clinical executable runtime Supabase retirement scan: PASS'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local canonical runtime
        shell: bash
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$APPWRITE_ENDPOINT" || { echo 'FAIL-CLOSED: APPWRITE_ENDPOINT missing'; exit 1; }
          test -n "$APPWRITE_PROJECT_ID" || { echo 'FAIL-CLOSED: APPWRITE_PROJECT_ID missing'; exit 1; }
          test -n "$APPWRITE_API_KEY" || { echo 'FAIL-CLOSED: APPWRITE_API_KEY missing'; exit 1; }
          test -n "$DATABASE_URL" || { echo 'FAIL-CLOSED: NEON_DATABASE_URL missing'; exit 1; }
          node --check qa/local-vercel-runtime.mjs
          node qa/local-vercel-runtime.mjs >/tmp/azaad-clinical-http.log 2>&1 &
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/azaad-clinical-http.log || true
          exit 1

      - name: Run canonical clinical authorization migration E2E
        env:
          AZAAD_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test qa/clinical-authorization-e2e.spec.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azaad-clinical-authorization-e2e-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Capture local runtime diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f /tmp/azaad-clinical-http.log; then cat /tmp/azaad-clinical-http.log; fi

# This gate intentionally does not authenticate through Supabase.
# Full authorized clinical-path certification remains blocked until the Neon
# production branch provisions the staff/clinical identity model required by
# the canonical Appwrite -> Vercel API -> Neon boundary.
