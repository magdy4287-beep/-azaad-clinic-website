name: Azaad Clinical Authorization E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azaad-clinical-authorization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clinical-authorization-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v5

      - name: Verify exact commit under test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify controlled E2E configuration
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_FRONTDESK_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
          AZAAD_E2E_NONSTAFF_TOKEN: ${{ secrets.AZAAD_E2E_NONSTAFF_TOKEN }}
          AZAAD_E2E_DOCTOR_A_TOKEN: ${{ secrets.AZAAD_E2E_DOCTOR_A_TOKEN }}
          AZAAD_E2E_DOCTOR_B_TOKEN: ${{ secrets.AZAAD_E2E_DOCTOR_B_TOKEN }}
          AZAAD_E2E_WRONG_DOCTOR_BOOKING_ID: ${{ secrets.AZAAD_E2E_WRONG_DOCTOR_BOOKING_ID }}
          AZAAD_E2E_INVALID_STATE_BOOKING_ID: ${{ secrets.AZAAD_E2E_INVALID_STATE_BOOKING_ID }}
          AZAAD_E2E_HAPPY_PATH_BOOKING_ID: ${{ secrets.AZAAD_E2E_HAPPY_PATH_BOOKING_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            AZAAD_SUPABASE_URL \
            AZAAD_SUPABASE_ANON_KEY \
            AZAAD_E2E_FRONTDESK_PASSWORD \
            AZAAD_E2E_NONSTAFF_TOKEN \
            AZAAD_E2E_DOCTOR_A_TOKEN \
            AZAAD_E2E_DOCTOR_B_TOKEN \
            AZAAD_E2E_WRONG_DOCTOR_BOOKING_ID \
            AZAAD_E2E_INVALID_STATE_BOOKING_ID \
            AZAAD_E2E_HAPPY_PATH_BOOKING_ID; do
            test -n "${!name:-}" || { echo "Missing required controlled-E2E secret: $name" >&2; exit 1; }
          done
          echo "Controlled clinical authorization E2E configuration is present."

      - name: Authenticate controlled Frontdesk identity
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_FRONTDESK_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const base = (process.env.AZAAD_SUPABASE_URL || '').replace(/\/$/, '');
            const anon = process.env.AZAAD_SUPABASE_ANON_KEY;
            const password = process.env.AZAAD_E2E_FRONTDESK_PASSWORD;
            if (!base || !anon || !password) throw new Error('Missing Frontdesk Auth configuration');
            const response = await fetch(`${base}/functions/v1/staff-login`, {
              method: 'POST',
              headers: { apikey: anon, Authorization: `Bearer ${anon}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: 'frontdesk_azaad', password }),
            });
            const raw = await response.text();
            let body = {};
            try { body = JSON.parse(raw); } catch {}
            if (!response.ok) {
              const code = typeof body?.code === 'string' ? body.code : 'NO_ERROR_CODE';
              const error = typeof body?.error === 'string' ? body.error : 'NO_ERROR_MESSAGE';
              throw new Error(`Frontdesk staff-login failed with HTTP ${response.status}; code=${code}; error=${error}`);
            }
            const session = body;
            const token = (session.access_token || session.session?.access_token || '').trim();
            if (!/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(token)) throw new Error('Frontdesk staff-login did not return a valid JWT');
            const user = session.user || session.session?.user;
            if (!user || !user.id) throw new Error('Frontdesk staff-login returned no authenticated user identity');
            process.stdout.write(`::add-mask::${token}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `AZAAD_E2E_FRONTDESK_TOKEN=${token}\n`);
            console.log('Frontdesk staff identity verified.');
          })().catch((error) => { console.error(error instanceof Error ? error.message : error); process.exit(1); });
          NODE

      - name: Verify controlled Auth identities
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_FRONTDESK_TOKEN: ${{ env.AZAAD_E2E_FRONTDESK_TOKEN }}
          AZAAD_E2E_NONSTAFF_TOKEN: ${{ secrets.AZAAD_E2E_NONSTAFF_TOKEN }}
          AZAAD_E2E_DOCTOR_A_TOKEN: ${{ secrets.AZAAD_E2E_DOCTOR_A_TOKEN }}
          AZAAD_E2E_DOCTOR_B_TOKEN: ${{ secrets.AZAAD_E2E_DOCTOR_B_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const base = (process.env.AZAAD_SUPABASE_URL || '').replace(/\/$/, '');
            const anon = process.env.AZAAD_SUPABASE_ANON_KEY;
            const identities = [
              ['AZAAD_E2E_FRONTDESK_TOKEN', process.env.AZAAD_E2E_FRONTDESK_TOKEN],
              ['AZAAD_E2E_NONSTAFF_TOKEN', process.env.AZAAD_E2E_NONSTAFF_TOKEN],
              ['AZAAD_E2E_DOCTOR_A_TOKEN', process.env.AZAAD_E2E_DOCTOR_A_TOKEN],
              ['AZAAD_E2E_DOCTOR_B_TOKEN', process.env.AZAAD_E2E_DOCTOR_B_TOKEN],
            ];
            if (!base || !anon) throw new Error('Missing Supabase URL or anon key');
            for (const [name, token] of identities) {
              const compact = (token || '').trim();
              if (!/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(compact)) throw new Error(`${name} is not a JWT`);
              const response = await fetch(`${base}/auth/v1/user`, { headers: { apikey: anon, Authorization: `Bearer ${compact}` } });
              if (!response.ok) throw new Error(`${name} failed Supabase Auth identity verification with HTTP ${response.status}`);
              const user = await response.json();
              if (!user || !user.id) throw new Error(`${name} returned no authenticated user identity`);
              console.log(`${name}: verified Auth identity`);
            }
          })().catch((error) => { console.error(error instanceof Error ? error.message : error); process.exit(1); });
          NODE

      - name: Run clinical authorization E2E
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_FRONTDESK_TOKEN: ${{ env.AZAAD_E2E_FRONTDESK_TOKEN }}
          AZAAD_E2E_NONSTAFF_TOKEN: ${{ secrets.AZAAD_E2E_NONSTAFF_TOKEN }}
          AZAAD_E2E_DOCTOR_A_TOKEN: ${{ secrets.AZAAD_E2E_DOCTOR_A_TOKEN }}
          AZAAD_E2E_DOCTOR_B_TOKEN: ${{ secrets.AZAAD_E2E_DOCTOR_B_TOKEN }}
          AZAAD_E2E_WRONG_DOCTOR_BOOKING_ID: ${{ secrets.AZAAD_E2E_WRONG_DOCTOR_BOOKING_ID }}
          AZAAD_E2E_INVALID_STATE_BOOKING_ID: ${{ secrets.AZAAD_E2E_INVALID_STATE_BOOKING_ID }}
          AZAAD_E2E_HAPPY_PATH_BOOKING_ID: ${{ secrets.AZAAD_E2E_HAPPY_PATH_BOOKING_ID }}
        run: npx playwright test qa/clinical-authorization-e2e.spec.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azaad-clinical-authorization-e2e-report
          path: playwright-report/
          if-no-files-found: ignore

# This gate deliberately fails when controlled test credentials/data are absent.
# It never falls back to fake credentials and never weakens RLS/RPC authorization.
