name: Azaad Clinical Authorization E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: azaad-clinical-authorization-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clinical-authorization-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v5

      - name: Verify exact commit under test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify controlled E2E configuration
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_FRONTDESK_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
          AZAAD_E2E_NONSTAFF_PASSWORD: ${{ secrets.AZAAD_E2E_NONSTAFF_PASSWORD }}
          AZAAD_E2E_DOCTOR_A_PASSWORD: ${{ secrets.AZAAD_E2E_DOCTOR_A_PASSWORD }}
          AZAAD_E2E_DOCTOR_B_PASSWORD: ${{ secrets.AZAAD_E2E_DOCTOR_B_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AZAAD_SUPABASE_URL AZAAD_SUPABASE_ANON_KEY AZAAD_E2E_FRONTDESK_PASSWORD AZAAD_E2E_NONSTAFF_PASSWORD AZAAD_E2E_DOCTOR_A_PASSWORD AZAAD_E2E_DOCTOR_B_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing required controlled-E2E secret: $name" >&2; exit 1; }
          done
          normalized_url="$(printf '%s' "$AZAAD_SUPABASE_URL" | sed 's/[[:space:]]*$//; s#/*$##')"
          parsed_host="$(node -e 'const u=new URL(process.argv[1]); process.stdout.write(u.hostname)' "$normalized_url" 2>/dev/null || true)"
          parsed_path="$(node -e 'const u=new URL(process.argv[1]); process.stdout.write(u.pathname)' "$normalized_url" 2>/dev/null || true)"
          case "$normalized_url" in https://*.supabase.co) ;; *) echo "AZAAD_SUPABASE_URL is not a Supabase project URL" >&2; exit 1 ;; esac
          test -n "$parsed_host" || { echo "AZAAD_SUPABASE_URL is not a valid URL" >&2; exit 1; }
          test "$parsed_path" = "/" || test -z "$parsed_path" || { echo "AZAAD_SUPABASE_URL must contain only the project origin" >&2; exit 1; }
          printf 'AZAAD_SUPABASE_URL=%s\n' "$normalized_url" >> "$GITHUB_ENV"
          echo "Controlled clinical authorization E2E configuration is present."

      # The clinical RPC/RLS boundary still consumes Supabase Auth JWTs. The
      # retired custom staff-login Edge Function is not part of this contract;
      # use the native Auth password grant so the E2E tests the real JWT/RLS
      # boundary without depending on the provider-limited legacy function.
      - name: Authenticate controlled Frontdesk identity through native Auth
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_FRONTDESK_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const base=(process.env.AZAAD_SUPABASE_URL||'').trim().replace(/\/+$/,'');
            const anon=process.env.AZAAD_SUPABASE_ANON_KEY;
            const password=process.env.AZAAD_E2E_FRONTDESK_PASSWORD;
            const response=await fetch(`${base}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:anon,'Content-Type':'application/json'},body:JSON.stringify({email:'frontdesk@azaad.local',password})});
            const body=await response.json().catch(()=>({}));
            if(!response.ok)throw new Error(`Frontdesk Auth sign-in failed with HTTP ${response.status}`);
            const token=(body.access_token||'').trim();
            if(!token||!body.user?.id)throw new Error('Frontdesk Auth did not return a valid identity');
            process.stdout.write(`::add-mask::${token}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV,`AZAAD_E2E_FRONTDESK_TOKEN=${token}\n`);
            console.log(`Frontdesk native Auth identity verified: user_id=${body.user.id}; response_date=${response.headers.get('date')||'MISSING'}`);
          })().catch(e=>{console.error(e instanceof Error?e.message:e);process.exit(1)});
          NODE

      - name: Authenticate controlled Nonstaff identity
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_NONSTAFF_PASSWORD: ${{ secrets.AZAAD_E2E_NONSTAFF_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); (async()=>{const b=(process.env.AZAAD_SUPABASE_URL||'').trim().replace(/\/+$/,'');const a=process.env.AZAAD_SUPABASE_ANON_KEY;const p=process.env.AZAAD_E2E_NONSTAFF_PASSWORD;const r=await fetch(`${b}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:a,'Content-Type':'application/json'},body:JSON.stringify({email:'e2e_nonstaff@azaad-clinic.test',password:p})});const j=await r.json();if(!r.ok)throw new Error(`Nonstaff Auth sign-in failed with HTTP ${r.status}`);const t=(j.access_token||'').trim();if(!t||!j.user?.id)throw new Error('Nonstaff Auth did not return a valid identity');process.stdout.write(`::add-mask::${t}\n`);fs.appendFileSync(process.env.GITHUB_ENV,`AZAAD_E2E_NONSTAFF_TOKEN=${t}\n`);console.log('Nonstaff Auth identity verified.');})().catch(e=>{console.error(e.message||e);process.exit(1)});
          NODE

      - name: Authenticate controlled Doctor A identity
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_DOCTOR_A_PASSWORD: ${{ secrets.AZAAD_E2E_DOCTOR_A_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); (async()=>{const b=(process.env.AZAAD_SUPABASE_URL||'').trim().replace(/\/+$/,'');const a=process.env.AZAAD_SUPABASE_ANON_KEY;const p=process.env.AZAAD_E2E_DOCTOR_A_PASSWORD;const r=await fetch(`${b}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:a,'Content-Type':'application/json'},body:JSON.stringify({email:'doctor_lamia@azaad.local',password:p})});const j=await r.json();if(!r.ok)throw new Error(`Doctor A Auth sign-in failed with HTTP ${r.status}`);const t=(j.access_token||'').trim();if(!t||!j.user?.id)throw new Error('Doctor A Auth did not return a valid identity');process.stdout.write(`::add-mask::${t}\n`);fs.appendFileSync(process.env.GITHUB_ENV,`AZAAD_E2E_DOCTOR_A_TOKEN=${t}\n`);console.log('Doctor A Auth identity verified.');})().catch(e=>{console.error(e.message||e);process.exit(1)});
          NODE

      - name: Authenticate controlled Doctor B identity
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_E2E_DOCTOR_B_PASSWORD: ${{ secrets.AZAAD_E2E_DOCTOR_B_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); (async()=>{const b=(process.env.AZAAD_SUPABASE_URL||'').trim().replace(/\/+$/,'');const a=process.env.AZAAD_SUPABASE_ANON_KEY;const p=process.env.AZAAD_E2E_DOCTOR_B_PASSWORD;const r=await fetch(`${b}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:a,'Content-Type':'application/json'},body:JSON.stringify({email:'doctor.amgad@azaad.local',password:p})});const j=await r.json();if(!r.ok)throw new Error(`Doctor B Auth sign-in failed with HTTP ${r.status}`);const t=(j.access_token||'').trim();if(!t||!j.user?.id)throw new Error('Doctor B Auth did not return a valid identity');process.stdout.write(`::add-mask::${t}\n`);fs.appendFileSync(process.env.GITHUB_ENV,`AZAAD_E2E_DOCTOR_B_TOKEN=${t}\n`);console.log('Doctor B Auth identity verified.');})().catch(e=>{console.error(e.message||e);process.exit(1)});
          NODE

      - name: Verify controlled Auth identities and capture verification dates
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async()=>{const b=(process.env.AZAAD_SUPABASE_URL||'').trim().replace(/\/+$/,'');const a=process.env.AZAAD_SUPABASE_ANON_KEY;for(const [n,t] of Object.entries({frontdesk:process.env.AZAAD_E2E_FRONTDESK_TOKEN,nonstaff:process.env.AZAAD_E2E_NONSTAFF_TOKEN,doctorA:process.env.AZAAD_E2E_DOCTOR_A_TOKEN,doctorB:process.env.AZAAD_E2E_DOCTOR_B_TOKEN})){const r=await fetch(`${b}/auth/v1/user`,{headers:{apikey:a,Authorization:`Bearer ${t}`}});console.log(`${n} /user: status=${r.status}; date=${r.headers.get('date')||'MISSING'}`);if(!r.ok)process.exit(1)}})().catch(e=>{console.error(e.message||e);process.exit(1)});
          NODE

      - name: Run clinical authorization E2E
        env:
          AZAAD_SUPABASE_URL: ${{ secrets.AZAAD_SUPABASE_URL }}
          AZAAD_SUPABASE_ANON_KEY: ${{ secrets.AZAAD_SUPABASE_ANON_KEY }}
          AZAAD_CLINICAL_FIXTURE_FUNCTION: azaad-clinical-e2e-fixtures
        run: npx playwright test qa/clinical-authorization-e2e.spec.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azaad-clinical-authorization-e2e-report
          path: playwright-report/
          if-no-files-found: ignore

# This gate deliberately fails when controlled test credentials are absent.
# Fixture booking IDs are generated by the authenticated factory at runtime.
# It never falls back to fake credentials and never weakens RLS/RPC authorization.
