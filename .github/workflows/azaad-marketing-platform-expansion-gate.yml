name: Azaad Marketing Platform Expansion Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'marketing-platform-expansion.js'
      - '.github/patch-admin.py'
      - 'qa/marketing-platform-expansion.py'
      - '.github/workflows/azaad-marketing-platform-expansion-gate.yml'
  push:
    branches: [feat/ai-operating-system-20260815]
    paths:
      - 'marketing-platform-expansion.js'
      - '.github/patch-admin.py'
      - 'qa/marketing-platform-expansion.py'
      - '.github/workflows/azaad-marketing-platform-expansion-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: node --check marketing-platform-expansion.js
      - name: Validate platform contract
        run: python3 qa/marketing-platform-expansion.py
