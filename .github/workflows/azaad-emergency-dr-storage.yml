# Manual Storage-only recovery tool.
# Normal evacuation remains ordered inside azaad-emergency-dr-execute.yml.
name: AZAAD Emergency DR Storage Evacuation

on:
  workflow_dispatch:
  push:
    branches:
      - emergency/supabase-evacuation

permissions:
  contents: read

concurrency:
  group: azaad-emergency-dr-storage-manual
  cancel-in-progress: false

jobs:
  storage:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/emergency/supabase-evacuation'
    name: Manual Supabase Storage evacuation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact emergency candidate
        uses: actions/checkout@v4
        with:
          ref: emergency/supabase-evacuation
          fetch-depth: 1

      - name: Verify required migration secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY APPWRITE_ENDPOINT APPWRITE_PROJECT_ID APPWRITE_API_KEY; do
            if [ -z "${!name:-}" ]; then echo "MISSING_SECRET=$name"; missing=1; else echo "PRESENT_SECRET=$name"; fi
          done
          [ "$missing" -eq 0 ]

      - name: Normalize canonical Supabase project URL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          canonical_url="$(node - <<'NODE'
          const raw=String(process.env.SUPABASE_URL||'').trim().replace(/\/$/,'');
          const db=String(process.env.SUPABASE_DB_URL||'').trim();
          if(/^https:\/\/[a-z0-9]+\.supabase\.co$/i.test(raw)){console.log(raw);process.exit(0)}
          let m=raw.match(/^https:\/\/app\.supabase\.com\/dashboard\/project\/([a-z0-9]+)(?:\/.*)?$/i);
          if(m){console.log(`https://${m[1]}.supabase.co`);process.exit(0)}
          try { const u=new URL(db); m=u.hostname.match(/^db\.([a-z0-9]+)\.supabase\.co$/i); if(m){console.log(`https://${m[1]}.supabase.co`);process.exit(0)} } catch {}
          console.error('FAIL-CLOSED: unable to derive canonical Supabase project URL');process.exit(1);
          NODE
          )"
          echo "canonical_supabase_host=$canonical_url"
          echo "SUPABASE_URL=$canonical_url" >> "$GITHUB_ENV"

      - name: Migrate every Supabase Storage object
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        shell: bash
        run: bash scripts/azaad-supabase-storage-to-appwrite.sh

      - name: Upload reconciliation manifest
        uses: actions/upload-artifact@v4
        with:
          name: azaad-storage-manual-${{ github.sha }}
          path: ${{ runner.temp }}/azaad-storage-migration/manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed unless every object reconciles
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/azaad-storage-migration/manifest.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          if(m.status!=='PASS') process.exit(1);
          for(const b of m.buckets) if(b.file_count!==b.verified || b.failed.length) process.exit(1);
          console.log('PASS: every discovered Storage object is reconciled');
          NODE