name: wire public scheduling preview

on:
  push:
    branches:
      - test/integration-gate

permissions:
  contents: write

jobs:
  wire:
    if: "!contains(github.event.head_commit.message, '[skip public scheduling]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/integration-gate
          fetch-depth: 0

      - name: Wire public scheduling endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          public_api = "  const PUBLIC_API =\n    'https://derofsthjivlkcdnojww.supabase.co/functions/v1/azaad-public-clinic-data';\n"
          scheduling = "  const PUBLIC_SCHEDULING_API =\n    'https://derofsthjivlkcdnojww.supabase.co/functions/v1/azaad-public-scheduling';\n"
          if 'const PUBLIC_SCHEDULING_API' not in s:
              marker = public_api
              if marker not in s:
                  raise SystemExit('PUBLIC_API marker not found')
              s = s.replace(marker, marker + scheduling, 1)
          old = "        API +\n        '?api=slots' +"
          new = "        PUBLIC_SCHEDULING_API +\n        '?api=slots' +"
          if old not in s:
              raise SystemExit('legacy slots endpoint marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit wiring change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git diff --cached --check
          git diff --cached -- app.js
          git commit -m 'refactor(scheduling): route public slots through dedicated API [skip public scheduling]'
          git push origin test/integration-gate
