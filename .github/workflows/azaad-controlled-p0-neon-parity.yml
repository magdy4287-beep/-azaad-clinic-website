name: AZAAD Controlled P0 - Neon Integrity

on:
  push:
    branches: [controlled-evolution/runtime-boundary-neon]
    paths:
      - '.github/workflows/azaad-controlled-p0-neon-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

# Supabase is retired from AZAAD. This gate is strictly read-only and validates
# the live Neon target without contacting, requiring, or comparing against Supabase.
concurrency:
  group: azaad-controlled-neon-integrity
  cancel-in-progress: false

jobs:
  neon-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify Neon-only configuration
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$NEON_DATABASE_URL" || { echo 'FAIL-CLOSED: NEON_DATABASE_URL missing'; exit 1; }
          if [[ "$NEON_DATABASE_URL" == *supabase* ]]; then
            echo 'FAIL-CLOSED: Neon target resolves to a retired Supabase endpoint.'
            exit 1
          fi
          echo 'PASS: Neon-only configuration is present.'

      - name: Verify Neon target reachability and fingerprint
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          identity="$(psql "$NEON_DATABASE_URL" -Atqc "SELECT current_database() || '|' || current_user || '|' || current_schema()")"
          test -n "$identity"
          echo "NEON_TARGET=$identity"
          NEON_DATABASE_URL="$NEON_DATABASE_URL" python3 - <<'PY'
          import hashlib, os
          from urllib.parse import urlparse
          u = urlparse(os.environ['NEON_DATABASE_URL'])
          canonical = f'{u.scheme}://{u.hostname}:{u.port or ""}{u.path}'
          print('NEON_DATABASE_TARGET_FINGERPRINT=' + hashlib.sha256(canonical.encode()).hexdigest())
          PY
          echo 'PASS: Neon target is reachable.'

      - name: Verify production runtime-critical schema
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname='public') THEN
              RAISE EXCEPTION 'PUBLIC_SCHEMA_MISSING';
            END IF;
            IF to_regclass('public.clinic_staff') IS NULL THEN
              RAISE EXCEPTION 'CLINIC_STAFF_MISSING';
            END IF;
          END $$;
          SQL
          echo 'PASS: runtime-critical Neon schema boundary is present.'

      - name: Verify critical application tables without mutating data
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          tables='clinic_staff clinic_patients clinic_doctors clinic_services clinic_settings clinic_bookings'
          for table in $tables; do
            count="$(psql "$NEON_DATABASE_URL" -Atqc "SELECT count(*) FROM public.\"$table\"" 2>/dev/null || echo MISSING)"
            if [ "$count" = MISSING ]; then
              echo "FAIL-CLOSED: critical table missing or unreadable: $table"
              exit 1
            fi
            echo "NEON_TABLE=$table COUNT=$count"
          done
          echo 'PASS: critical Neon application tables are readable.'

      - name: Verify retired Supabase dependency is absent from active Neon gates
        shell: bash
        run: |
          set -euo pipefail
          # Do not scan this file: its fail-closed assertions necessarily contain
          # the retired provider strings and would otherwise self-match.
          matches="$(grep -RniE 'SUPABASE_|supabase\.co|supabase-js|supabase/functions' .github/workflows --exclude='azaad-controlled-p0-neon-parity.yml' || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo 'FAIL-CLOSED: retired Supabase dependency detected in another active workflow.'
            exit 1
          fi
          echo 'PASS: no retired Supabase dependency detected in other active workflows.'

      - name: Controlled P0 gate
        run: |
          echo 'PASS: Neon integrity verification completed without restore, migration, deletion, or target mutation.'
