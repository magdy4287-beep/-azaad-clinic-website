name: AZAAD Controlled P0 - Neon Parity

on:
  push:
    branches: [controlled-evolution/runtime-boundary-neon]
    paths:
      - '.github/workflows/azaad-controlled-p0-neon-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

# Controlled evolution must never reopen Emergency DR. This gate is strictly
# read-only: it verifies the already-restored Neon target against Supabase.
concurrency:
  group: azaad-controlled-neon-parity
  cancel-in-progress: false

jobs:
  p0-neon-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify read-only parity configuration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo 'FAIL-CLOSED: SUPABASE_DB_URL missing'; exit 1; }
          test -n "$NEON_DATABASE_URL" || { echo 'FAIL-CLOSED: NEON_DATABASE_URL missing'; exit 1; }
          echo 'PASS: read-only parity configuration is present.'

      - name: Verify both database targets are reachable and fingerprint the authoritative target
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          supabase_identity="$(psql "$SUPABASE_DB_URL" -Atqc "SELECT current_database() || '|' || current_user")"
          neon_identity="$(psql "$NEON_DATABASE_URL" -Atqc "SELECT current_database() || '|' || current_user")"
          test -n "$supabase_identity"
          test -n "$neon_identity"
          echo "SUPABASE_TARGET=$supabase_identity"
          echo "NEON_TARGET=$neon_identity"
          NEON_DATABASE_URL="$NEON_DATABASE_URL" python3 - <<'PY'
          import hashlib, os
          from urllib.parse import urlparse
          u = urlparse(os.environ['NEON_DATABASE_URL'])
          canonical = f'{u.scheme}://{u.hostname}:{u.port or ""}{u.path}'
          print('NEON_DATABASE_TARGET_FINGERPRINT=' + hashlib.sha256(canonical.encode()).hexdigest())
          PY
          echo 'PASS: both database targets are reachable.'

      - name: Compare authoritative clinical row counts and retain evidence
        id: row-counts
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/neon-parity-row-counts.txt"
          tables='clinic_ai_insights clinic_audit_log clinic_bookings clinic_clinical_visits clinic_doctors clinic_invoices clinic_patients clinic_services clinic_settings clinic_working_hours'
          mismatch=0
          : > "$report"
          for table in $tables; do
            s=$(psql "$SUPABASE_DB_URL" -Atqc "SELECT count(*) FROM public.\"$table\"" 2>/dev/null || echo MISSING)
            n=$(psql "$NEON_DATABASE_URL" -Atqc "SELECT count(*) FROM public.\"$table\"" 2>/dev/null || echo MISSING)
            if [ "$s" = MISSING ] || [ "$n" = MISSING ]; then
              line="MISMATCH $table SUPABASE=$s NEON=$n (missing table/query failure)"
              mismatch=1
            elif [ "$s" != "$n" ]; then
              line="MISMATCH $table SUPABASE=$s NEON=$n"
              mismatch=1
            else
              line="MATCH $table count=$s"
            fi
            echo "$line" | tee -a "$report"
          done
          echo "MISMATCH_FLAG=$mismatch" | tee -a "$report"
          if [ "$mismatch" -ne 0 ]; then
            echo 'FAIL-CLOSED: authoritative row-count parity is not proven; no mutation was performed.'
            exit 1
          fi
          echo 'PASS: authoritative clinical row-count parity.'

      - name: Upload read-only parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-parity-row-count-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/neon-parity-row-counts.txt
          if-no-files-found: error

      - name: Stop before deeper parity checks when row counts differ
        if: steps.row-counts.outcome != 'success'
        run: |
          echo 'P0 remains BLOCKED: row-count mismatch is retained as evidence.'
          exit 1

      - name: Verify deterministic data fingerprints for authoritative tables
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          tables='clinic_ai_insights clinic_audit_log clinic_bookings clinic_clinical_visits clinic_doctors clinic_invoices clinic_patients clinic_services clinic_settings clinic_working_hours'
          fingerprint() {
            local url="$1" table="$2"
            psql "$url" -Atqc "SELECT COALESCE(md5(string_agg(md5(to_jsonb(t)::text), '' ORDER BY md5(to_jsonb(t)::text))), md5('')) FROM public.\"$table\" t"
          }
          mismatch=0
          for table in $tables; do
            s=$(fingerprint "$SUPABASE_DB_URL" "$table")
            n=$(fingerprint "$NEON_DATABASE_URL" "$table")
            echo "$table FINGERPRINT_SUPABASE=$s FINGERPRINT_NEON=$n"
            if [ -z "$s" ] || [ -z "$n" ] || [ "$s" != "$n" ]; then mismatch=1; fi
          done
          test "$mismatch" -eq 0 || { echo 'FAIL-CLOSED: deterministic authoritative data fingerprints differ.'; exit 1; }
          echo 'PASS: deterministic authoritative data fingerprints match.'

      - name: Verify public schema shape parity
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          schema_fingerprint() {
            psql "$1" -Atqc "SELECT md5(COALESCE(string_agg(format('%s|%s|%s|%s|%s|%s|%s', table_schema, table_name, ordinal_position, column_name, data_type, COALESCE(character_maximum_length::text,''), is_nullable), E'\\n' ORDER BY table_schema, table_name, ordinal_position), '')) FROM information_schema.columns WHERE table_schema='public'"
          }
          s=$(schema_fingerprint "$SUPABASE_DB_URL")
          n=$(schema_fingerprint "$NEON_DATABASE_URL")
          echo "PUBLIC_SCHEMA_FINGERPRINT_SUPABASE=$s"
          echo "PUBLIC_SCHEMA_FINGERPRINT_NEON=$n"
          test "$s" = "$n"
          echo 'PASS: public schema shape parity.'

      - name: Verify runtime-critical private schema/function invariants
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE private_functions integer;
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname='public') THEN RAISE EXCEPTION 'PUBLIC_SCHEMA_MISSING'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname='private') THEN RAISE EXCEPTION 'PRIVATE_SCHEMA_MISSING'; END IF;
            SELECT count(*) INTO private_functions FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='private';
            IF private_functions = 0 THEN RAISE EXCEPTION 'PRIVATE_FUNCTIONS_MISSING'; END IF;
          END $$;
          SQL
          echo 'PASS: runtime-critical private schema/function invariants.'

      - name: Controlled P0 gate
        run: |
          echo 'PASS: Neon parity verification completed without any restore, migration, or target mutation.'
