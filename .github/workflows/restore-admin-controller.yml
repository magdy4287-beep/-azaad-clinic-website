name: Restore canonical admin controller

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.sha != '08e9afb16cbac8e0b1e324c3fc6247d1b6adb22d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore admin.js from canonical pre-change commit
        run: |
          git checkout 08e9afb16cbac8e0b1e324c3fc6247d1b6adb22d -- admin.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.js
          git commit -m 'Restore canonical admin controller'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/restore-admin-controller.yml
          git commit -m 'Remove temporary controller restore workflow'
          git push
