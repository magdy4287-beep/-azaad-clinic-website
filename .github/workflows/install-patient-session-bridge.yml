name: Install Patient Session Bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject shared session bridge before Patient Center
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("admin.html")
          text = path.read_text(encoding="utf-8")

          bridge = '<script type="module" src="./patient-session-bridge.js?v=1.0.0"></script>\n'

          # Insert exactly once, immediately before the Patient Center script.
          text = re.sub(r'^[ \t]*<script[^>]+patients-center\\.js[^>]*></script>\s*$',
                        lambda m: bridge + m.group(0) if bridge.strip() not in text else m.group(0),
                        text,
                        count=1,
                        flags=re.MULTILINE)

          # Also support the case where the Patient Center tag has type=module.
          if bridge.strip() not in text:
              marker = 'patients-center.js'
              pos = text.find(marker)
              if pos >= 0:
                  start = text.rfind('<script', 0, pos)
                  if start >= 0:
                      text = text[:start] + bridge + text[start:]

          path.write_text(text, encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Fix Patient Center shared auth session bridge"
          git push
