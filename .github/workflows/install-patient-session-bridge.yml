name: Install Patient Session Bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject shared session bridge before Patient Center
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("admin.html")
          text = path.read_text(encoding="utf-8")

          # Classic script is intentional: it must publish the bridge
          # synchronously before patients-center.js executes.
          bridge = '<script src="./patient-session-bridge.js?v=2.0.0"></script>\n'

          marker = 'patients-center.js'
          if marker in text and bridge.strip() not in text:
              pos = text.find(marker)
              start = text.rfind('<script', 0, pos)
              if start >= 0:
                  text = text[:start] + bridge + text[start:]

          # Remove an older module bridge if one was inserted previously.
          text = re.sub(
              r'\s*<script\s+type=["\']module["\']\s+src=["\']\./patient-session-bridge\.js\?v=[^"\']+["\']\s*></script>\s*',
              '\n',
              text,
              flags=re.IGNORECASE
          )

          # Ensure the v2 classic bridge exists immediately before Patient Center.
          bridge = '<script src="./patient-session-bridge.js?v=2.0.0"></script>\n'
          if bridge.strip() not in text and marker in text:
              pos = text.find(marker)
              start = text.rfind('<script', 0, pos)
              if start >= 0:
                  text = text[:start] + bridge + text[start:]

          path.write_text(text, encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Load patient auth bridge synchronously"
          git push
