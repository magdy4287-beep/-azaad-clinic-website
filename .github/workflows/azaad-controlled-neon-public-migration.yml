name: AZAAD Controlled Neon Public Migration

on:
  push:
    branches:
      - chore/architecture-cleanup-20260910

permissions:
  contents: read

jobs:
  migrate-public-db:
    # This exact commit is the deliberate migration execution point. Ordinary
    # later commits on the branch cannot re-run the destructive migration.
    if: github.event.head_commit.message == 'EXECUTE CONTROLLED NEON PUBLIC MIGRATION'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PGSSLMODE: require
    steps:
      - name: Checkout exact migration commit
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Verify required migration inputs exist
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DR_BACKUP_PASSPHRASE: ${{ secrets.DR_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test -n "$NEON_DATABASE_URL"
          test -n "$DR_BACKUP_PASSPHRASE"
          echo 'PASS: controlled migration secrets are present'

      - name: Execute canonical database-only restore
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DR_BACKUP_PASSPHRASE: ${{ secrets.DR_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          chmod +x scripts/azaad-dr-real-restore.sh
          ./scripts/azaad-dr-real-restore.sh

      - name: Prove Supabase-to-Neon public table and row-count parity
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/azaad-parity"
          mkdir -p "$work"
          : > "$work/supabase.tsv"
          : > "$work/neon.tsv"

          while IFS= read -r table; do
            count="$(psql "$SUPABASE_DB_URL" -Atqc "SELECT count(*) FROM public.\"$table\";")"
            printf '%s\t%s\n' "$table" "$count" >> "$work/supabase.tsv"
          done < <(psql "$SUPABASE_DB_URL" -Atqc "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename;")

          while IFS= read -r table; do
            count="$(psql "$NEON_DATABASE_URL" -Atqc "SELECT count(*) FROM public.\"$table\";")"
            printf '%s\t%s\n' "$table" "$count" >> "$work/neon.tsv"
          done < <(psql "$NEON_DATABASE_URL" -Atqc "SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename <> 'azaad_dr_reconciliation' ORDER BY tablename;")

          diff -u "$work/supabase.tsv" "$work/neon.tsv"
          echo 'PASS: public table names and row counts match exactly'

      - name: Verify critical application schema and integrity objects
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regclass('public.clinic_staff') AS clinic_staff;
          SELECT to_regclass('public.clinic_patients') AS clinic_patients;
          SELECT to_regclass('public.clinic_bookings') AS clinic_bookings;
          SELECT count(*) AS foreign_keys
          FROM pg_constraint
          WHERE contype = 'f' AND connamespace = 'public'::regnamespace;
          SELECT count(*) AS indexes
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE c.relkind = 'i' AND n.nspname = 'public';
          SELECT count(*) AS rls_tables
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public' AND c.relkind = 'r' AND c.relrowsecurity;
          SQL
          test "$(psql "$NEON_DATABASE_URL" -Atqc "SELECT count(*) FROM public.clinic_staff;")" -ge 0
          echo 'PASS: clinic_staff and core public schema objects are present'

      - name: Publish non-sensitive migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azaad-neon-public-migration-evidence
          path: |
            ${{ runner.temp }}/azaad-parity/*.tsv
          if-no-files-found: ignore
          retention-days: 7
