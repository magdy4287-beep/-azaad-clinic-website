name: Ensure Doctor Route Guard
on:
  push:
    branches: [main]
jobs:
  ensure-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject doctor route guard into admin.html
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'doctor-route-guard.js' admin.html; then
            echo 'Doctor route guard already present.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body>'
          tag = '<script src="./doctor-route-guard.js?v=1.0.0" defer></script>\n'
          if marker not in s:
              raise SystemExit('admin.html has no </body> marker')
          p.write_text(s.replace(marker, tag + marker, 1), encoding='utf-8')
          PY
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- admin.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'Azaad Clinic Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'fix: load doctor route guard in admin panel'
          git push
