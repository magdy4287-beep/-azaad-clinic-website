name: Fix Admin Session Restore

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-admin-session:
    if: ${{ !contains(github.event.head_commit.message, '[admin-session-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin session restore
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('admin.js')
          text = p.read_text(encoding='utf-8')

          start = text.index('async function restoreSession() {')
          end = text.index('/* ============================================================\n   RESTORE STAFF', start)

          replacement = r'''async function restoreSession() {
  let sessionResult;

  try {
    sessionResult = await supabase.auth.getSession();
  } catch (error) {
    console.error("Session restore error:", error);
    return false;
  }

  const session = sessionResult?.data?.session || null;

  if (!session?.access_token || !session?.user?.id) {
    return false;
  }

  state.session = session;
  state.user = session.user;

  // Never sign out merely because the staff profile is temporarily
  // unavailable during page startup. Auth session recovery must be
  // independent from the staff-profile lookup.
  for (let attempt = 1; attempt <= 3; attempt += 1) {
    const validStaff = await restoreStaffProfile();

    if (validStaff) {
      await initializeApplication();
      return true;
    }

    await new Promise(resolve =>
      setTimeout(resolve, attempt * 400)
    );

    try {
      const refreshed = await supabase.auth.getSession();
      const refreshedSession = refreshed?.data?.session;

      if (refreshedSession?.access_token) {
        state.session = refreshedSession;
        state.user = refreshedSession.user;
      }
    } catch (error) {
      console.warn("Session retry failed:", error);
    }
  }

  // Keep the authenticated session alive. Do NOT call signOut here.
  console.warn("Staff profile could not be restored during startup.");
  return false;
}

'''

          text = text[:start] + replacement + text[end:]

          # Ensure restoreSession is actually invoked once after the module
          # and DOM are ready. Do not duplicate the bootstrap if already present.
          if 'window.__AZAAD_ADMIN_BOOTSTRAP__' not in text:
            text += r'''

/* ============================================================
   ADMIN BOOTSTRAP
   ============================================================ */

window.__AZAAD_ADMIN_BOOTSTRAP__ = true;

document.addEventListener("DOMContentLoaded", async () => {
  try {
    await restoreSession();
  } catch (error) {
    console.error("Admin bootstrap error:", error);
  }
});
'''

          p.write_text(text, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js
          if git diff --cached --quiet; then
            echo "No admin.js changes needed"
            exit 0
          fi
          git commit -m "fix: restore admin session safely [admin-session-fix]"
          git push