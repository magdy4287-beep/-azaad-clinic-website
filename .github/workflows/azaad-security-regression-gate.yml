name: Azaad Security & Regression Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run security and regression gate
        run: python qa/security-regression-gate.py
