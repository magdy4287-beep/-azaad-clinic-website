name: Migrate public booking endpoint
on:
  push:
    branches: [test/integration-gate]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/integration-gate
          fetch-depth: 1
      - name: Switch booking API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "  const API =\n    'https://derofsthjivlkcdnojww.supabase.co/functions/v1/azaad-clinic';"
          new = "  const API =\n    'https://derofsthjivlkcdnojww.supabase.co/functions/v1/azaad-public-booking';"
          if old not in s:
              raise SystemExit('Expected API declaration not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: use public booking gateway'
          git push origin HEAD:test/integration-gate
