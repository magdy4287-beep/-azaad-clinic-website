name: Azaad API Module Import Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'qa/vercel-build.py'
      - 'qa/finalize-inline-staff-api-appwrite.py'
      - '.github/workflows/azaad-api-module-import-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-module-import-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact commit under test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: true
      - name: Build the same immutable artifact
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/azaad-build
          cp -a . /tmp/azaad-build
          cd /tmp/azaad-build
          python3 qa/vercel-build.py
          python3 qa/finalize-inline-staff-api-appwrite.py
          npm install --no-save --no-package-lock @neondatabase/serverless
      - name: Parse every API module without executing it
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          for file in api/*.js; do
            echo "=== node --check $file ==="
            node --check "$file"
          done
      - name: Import every API module and expose the exact failing module
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          for file in api/*.js; do
            echo "=== import $file ==="
            node --input-type=module -e "import('./$file').then(() => console.log('IMPORT_PASS $file')).catch((error) => { console.error(error); process.exit(1); })"
          done
      - name: Exercise the local runtime boundary directly
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$APPWRITE_ENDPOINT"
          test -n "$APPWRITE_PROJECT_ID"
          test -n "$APPWRITE_API_KEY"
          test -n "$DATABASE_URL"
          cd /tmp/azaad-build
          node qa/local-vercel-runtime.mjs >/tmp/azaad-api-diagnostic.log 2>&1 &
          echo $! > /tmp/azaad-api-diagnostic.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -sS -D /tmp/admin-auth.headers -o /tmp/admin-auth.body http://127.0.0.1:4173/api/admin-auth || true
          cat /tmp/admin-auth.headers || true
          cat /tmp/admin-auth.body || true
          echo '=== local runtime diagnostic ==='
          cat /tmp/azaad-api-diagnostic.log || true
