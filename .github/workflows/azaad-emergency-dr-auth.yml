name: AZAAD Emergency DR — Auth Inventory

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Exact emergency candidate SHA to inspect'
        required: true
        default: 'f9f6cd2f2a413d3262ff7fed6a42149ef3afc27b'
        type: string
  push:
    branches:
      - emergency/supabase-evacuation

permissions:
  contents: read

env:
  CANDIDATE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.sha }}
  SUPABASE_CANONICAL_URL: https://derofsthjivlkcdnojww.supabase.co

jobs:
  auth_inventory:
    name: Inventory Supabase Auth identities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact emergency candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 1

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate_sha"
          echo "candidate_ref=$CANDIDATE_REF"
          printf '%s\n' "$candidate_sha" | grep -Eq '^[0-9a-f]{40}$'
          test "$candidate_sha" = "$CANDIDATE_REF"

      - name: Verify Auth inventory secret
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo 'FAIL-CLOSED: SUPABASE_URL missing.'; exit 78; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'FAIL-CLOSED: SUPABASE_SERVICE_ROLE_KEY missing.'; exit 78; }

      - name: Inventory Auth identities without exporting credentials
        env:
          SUPABASE_URL: ${{ env.SUPABASE_CANONICAL_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "supabase_auth_endpoint=${SUPABASE_URL}/auth/v1/admin/users"
          bash scripts/azaad-supabase-auth-evacuation-inventory.sh

      - name: Bind Auth evidence to exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ env.CANDIDATE_REF }}
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/azaad-auth-evidence/auth-manifest.json" "$CANDIDATE_SHA" <<'NODE'
          const fs=require('fs');
          const p=process.argv[2];
          const sha=process.argv[3];
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          if(!/^[0-9a-f]{40}$/.test(sha)) throw new Error('FAIL-CLOSED: invalid candidate SHA');
          m.candidate_sha=sha;
          fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n',{mode:0o600});
          NODE
          grep -q '"candidate_sha"' "$RUNNER_TEMP/azaad-auth-evidence/auth-manifest.json"

      - name: Upload Auth evacuation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azaad-auth-evacuation-candidate-${{ env.CANDIDATE_REF }}-${{ github.run_id }}
          path: ${{ runner.temp }}/azaad-auth-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Final Auth inventory gate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ env.CANDIDATE_REF }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/azaad-auth-evidence/auth-manifest.json"
          node - "$RUNNER_TEMP/azaad-auth-evidence/auth-manifest.json" "$CANDIDATE_SHA" <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const sha=process.argv[3];
          if(m.status!=='PASS') throw new Error('FAIL-CLOSED: Auth inventory status is not PASS');
          if(m.candidate_sha!==sha) throw new Error('FAIL-CLOSED: Auth evidence candidate SHA mismatch');
          if(m.password_hashes_exported || m.sessions_exported || m.refresh_tokens_exported) throw new Error('FAIL-CLOSED: credential/session material must not be exported');
          console.log(`PASS: Auth identity inventory = ${m.user_count} users / ${m.identity_count} identities`);
          console.log(`PASS: Auth evidence bound to candidate ${m.candidate_sha}`);
          console.log('PASS: credentials, sessions and refresh tokens remain excluded');
          NODE
