name: AZAAD Emergency DR Restore

on:
  push:
    branches:
      - codex/azaad-emergency-dr-execution
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azaad-emergency-dr-restore
  cancel-in-progress: false

jobs:
  restore:
    name: Free-only emergency DR restore
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install and select PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          major=""
          if command -v pg_dump >/dev/null 2>&1; then
            major="$(pg_dump --version | awk '{print $3}' | cut -d. -f1)"
          fi
          if [ "$major" != "17" ]; then
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates gnupg
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
            echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
          fi
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          hash -r
          command -v pg_dump
          command -v pg_restore
          command -v psql
          test "$(pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "17"
          test "$(pg_restore --version | awk '{print $3}' | cut -d. -f1)" = "17"
          test "$(psql --version | awk '{print $3}' | cut -d. -f1)" = "17"

      - name: Verify required emergency secrets without printing them
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DR_BACKUP_PASSPHRASE: ${{ secrets.DR_BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test -n "$NEON_DATABASE_URL"
          test -n "$DR_BACKUP_PASSPHRASE"

      - name: Execute fail-closed restore
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DR_BACKUP_PASSPHRASE: ${{ secrets.DR_BACKUP_PASSPHRASE }}
        shell: bash
        run: bash scripts/azaad-dr-real-restore.sh

      - name: Verify recovery files exist before publication
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/azaad-dr-evidence"
          test -s "$evidence_dir/public.dump.enc"
          test -s "$evidence_dir/public.dump.enc.sha256"
          test -s "$evidence_dir/README.txt"
          test "$(wc -l < "$evidence_dir/public.dump.enc.sha256")" -eq 1

      - name: Upload encrypted recovery artifact
        id: recovery_artifact
        uses: actions/upload-artifact@v4
        with:
          name: azaad-emergency-dr-${{ github.sha }}
          path: |
            ${{ runner.temp }}/azaad-dr-evidence/public.dump.enc
            ${{ runner.temp }}/azaad-dr-evidence/public.dump.enc.sha256
            ${{ runner.temp }}/azaad-dr-evidence/README.txt
          if-no-files-found: error
          retention-days: 90

      - name: Verify recovery artifact publication
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.recovery_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.recovery_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          echo "recovery_artifact_id=$ARTIFACT_ID"
          echo "recovery_artifact_digest=$ARTIFACT_DIGEST"
          echo 'PASS: encrypted recovery artifact was published and immutable identifiers were returned'

      - name: Preserve only non-sensitive certification evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "candidate_sha=$GITHUB_SHA"
          echo 'restore_runner=azaad-dr-real-restore.sh'
          echo 'source=Supabase public schema'
          echo 'destination=Neon PostgreSQL'
          echo 'encrypted_recovery_artifact=UPLOADED_AND_VERIFIED'
          echo 'identity_status=NOT_PROVEN'
          echo 'authorization_status=NOT_PROVEN'
          echo 'production_cutover=BLOCKED'
