name: Azaad Admin Next-Gen Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin-nextgen-v2.js'
      - 'admin-patient-icon-guard.js'
      - '.github/patch-admin.py'
      - 'admin.html'
      - 'admin.js'
      - 'patients-center.js'
      - 'frontdesk-workflow.js'
      - 'central-i18n.js'
      - 'admin-english-hardening.js'
      - 'secretary-hybrid-workflow.js'
      - 'patient-demographics-editor.js'
      - 'invoice-print-email.js'
      - 'scheduling-actions-contract.js'
      - 'qa/secretary-hybrid-role-contract.py'
  push:
    branches: [feat/ai-operating-system-20260815]
    paths:
      - 'admin-nextgen-v2.js'
      - 'admin-patient-icon-guard.js'
      - '.github/patch-admin.py'
      - 'admin.html'
      - 'admin.js'
      - 'patients-center.js'
      - 'frontdesk-workflow.js'
      - 'central-i18n.js'
      - 'admin-english-hardening.js'
      - 'secretary-hybrid-workflow.js'
      - 'patient-demographics-editor.js'
      - 'invoice-print-email.js'
      - 'scheduling-actions-contract.js'
      - 'qa/secretary-hybrid-role-contract.py'

permissions:
  contents: read

jobs:
  admin-nextgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check admin-nextgen-v2.js
          node --check admin-patient-icon-guard.js
          node --check admin.js
          node --check patients-center.js
          node --check frontdesk-workflow.js
          node --check central-i18n.js
          node --check admin-english-hardening.js
          node --check secretary-hybrid-workflow.js
          node --check patient-demographics-editor.js
          node --check invoice-print-email.js
          node --check scheduling-actions-contract.js
      - name: Validate patch injection
        run: |
          grep -q 'admin-nextgen-v2.js' .github/patch-admin.py
          grep -q 'admin-patient-icon-guard.js' .github/patch-admin.py
          grep -q 'doctors-center-v2.js' .github/patch-admin.py
          grep -q 'services-center-v2.js' .github/patch-admin.py
          grep -q 'secretary-hybrid-workflow.js' .github/patch-admin.py
          grep -q 'patient-demographics-editor.js' .github/patch-admin.py
          grep -q 'invoice-print-email.js' .github/patch-admin.py
      - name: Validate canonical admin search contract
        run: |
          grep -q 'Disabled in favor of the canonical central i18n/admin runtime' admin-nextgen-v2.js
          grep -q 'Name / Phone / Patient Number / Booking Number' patients-center.js
          grep -q 'from:d,to:d' patients-center.js
          grep -Eq "params\\.set\\(['\\\"]mrn['\\\"]" patients-center.js
          grep -q 'booking_code' patients-center.js
          grep -q 'bookingDateFilter' patients-center.js
      - name: Validate Secretary hybrid role contract
        run: python3 qa/secretary-hybrid-role-contract.py
      - name: Validate bilingual and session safety
        run: |
          grep -q 'azaad_admin_lang' admin-english-hardening.js
          grep -q 'localStorage.getItem' admin-english-hardening.js
          ! grep -Eqi 'signOut\(|auth\.signOut\(' admin-nextgen-v2.js
      - name: Validate no service-role credential in browser overlays
        run: |
          ! grep -Eqi 'SUPABASE_SERVICE_ROLE|SERVICE_ROLE_KEY|service_role_key\s*=' admin-nextgen-v2.js
          ! grep -Eqi 'SUPABASE_SERVICE_ROLE|SERVICE_ROLE_KEY|service_role_key\s*=' secretary-hybrid-workflow.js
          ! grep -Eqi 'SUPABASE_SERVICE_ROLE|SERVICE_ROLE_KEY|service_role_key\s*=' patient-demographics-editor.js
          ! grep -Eqi 'SUPABASE_SERVICE_ROLE|SERVICE_ROLE_KEY|service_role_key\s*=' invoice-print-email.js
