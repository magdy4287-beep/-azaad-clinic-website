name: AZAAD Production Certification Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azaad-production-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certification:
    name: AI-First Free-Only Production Certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Record exact commit under certification
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Certification commit: $actual"

      - name: Require certification plan
        shell: bash
        run: |
          set -euo pipefail
          test -s AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'AI-First • Free-Only • Safety-Gated • Continuous Delivery' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'NOT PROVEN ON FREE-ONLY STACK' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'Refund Request → Doctor Approval → Management/Owner Approval → Refund Execution' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'Authorized user → bounded AI processing → validation → safe response/fallback' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'If any required item is absent: `NOT PROVEN`.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md

      - name: Require existing control layers
        shell: bash
        run: |
          set -euo pipefail
          test -s AZAAD_ENGINEERING_CONTROL_PLAN.md
          test -s AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          test -s .github/workflows/azaad-release-governance-gate.yml
          test -s .github/workflows/azaad-operations-health.yml

      - name: Enforce permanent free-only and AI-first constraints
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '100% free-only' AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -Fq 'AI-first clinic platform' AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -Fq 'AI must never:' AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -Fq 'AI is assistive only' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md

      - name: Enforce exact-commit evidence policy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Evidence must correspond to the exact production commit under certification.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'A missing or stale evidence item is `NOT PROVEN`, not PASS.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md

      - name: Enforce free-only architecture rule
        run: |
          set -euo pipefail
          grep -Fq 'AZAAD is 100% free-only.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'No paid provider plan, paid API, paid AI model, paid credits, paid monitoring, paid recovery resource, or paid add-on may be required' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          echo 'Free-only architecture rule: PASS'

      - name: Certification gate
        run: echo 'AZAAD Production Certification Gate: PASS'

  authenticated-browser-evidence:
    name: Authenticated Production Browser Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: certification
    steps:
      - name: Checkout exact commit under certification
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Verify exact commit under certification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$(git rev-parse HEAD^)"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build exact canonical production artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/azaad-build
          mkdir -p /tmp/azaad-build
          cp -a . /tmp/azaad-build/
          cd /tmp/azaad-build
          python3 qa/vercel-build.py

      - name: Validate canonical JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          node --check ./admin.js
          node --check ./admin-shell.js
          node --check ./azaad-operations-control-center.js

      - name: Prove final Admin runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          test "$(grep -o 'azaad-core-context.js' admin.html | wc -l)" -eq 1
          test "$(grep -o 'admin-shell.js' admin.html | wc -l)" -eq 1
          ! grep -Eq '\bbindTabs\s*\(' admin.js
          ! grep -Eq '\bswitchPanel\s*\(' admin.js
          echo 'Final Admin runtime invariants: PASS'

      - name: Start production-parity server
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/azaad-http.log 2>&1 &
          echo $! >/tmp/azaad-http.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/admin.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/azaad-http.log
          exit 1

      - name: Verify dedicated CI credentials
        env:
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AZAAD_TEST_USERNAME"
          test -n "$AZAAD_TEST_PASSWORD"

      - name: Run authenticated API and browser evidence
        env:
          AZAAD_BASE_URL: http://127.0.0.1:4173
          AZAAD_TEST_USERNAME: frontdesk_azaad
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        run: npx playwright test qa/auth-bridge-production.spec.mjs
