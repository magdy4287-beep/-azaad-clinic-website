name: AZAAD Production Certification Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certification:
    name: AI-First Free-Only Production Certification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Require certification plan
        shell: bash
        run: |
          set -euo pipefail
          test -s AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'AI-First • Free-Only • Safety-Gated • Continuous Delivery' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'NOT PROVEN ON FREE-ONLY STACK' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'Refund Request → Doctor Approval → Management/Owner Approval → Refund Execution' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'Authorized user → bounded AI processing → validation → safe response/fallback' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'If any required item is absent: `NOT PROVEN`.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md

      - name: Require existing control layers
        shell: bash
        run: |
          set -euo pipefail
          test -s AZAAD_ENGINEERING_CONTROL_PLAN.md
          test -s AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          test -s .github/workflows/azaad-release-governance-gate.yml
          test -s .github/workflows/azaad-operations-health.yml

      - name: Enforce permanent free-only and AI-first constraints
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '100% free-only' AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -Fq 'AI-first clinic platform' AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -Fq 'AI must never:' AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -Fq 'AI is assistive only' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md

      - name: Enforce exact-commit evidence policy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Evidence must correspond to the exact production commit under certification.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'A missing or stale evidence item is `NOT PROVEN`, not PASS.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md

      - name: Enforce no paid dependency in certification path
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq 'paid (plan|api|ai model|credits|monitoring|recovery)' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          echo 'Certification plan contains no paid dependency requirement.'

      - name: Certification gate
        run: echo 'AZAAD Production Certification Gate: PASS'
