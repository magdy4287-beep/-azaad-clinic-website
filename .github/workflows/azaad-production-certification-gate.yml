name: AZAAD Production Certification Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AZAAD_TEST_USERNAME: frontdesk_azaad

jobs:
  certification:
    name: Production Build + Authenticated Browser Certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact certification SHA
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "CERTIFICATION_SHA=$GITHUB_SHA"

      - name: Install Node and Playwright
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright package
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build exact canonical production artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/azaad-build
          mkdir -p /tmp/azaad-build
          cp -a . /tmp/azaad-build/
          cd /tmp/azaad-build
          python3 qa/vercel-build.py
          test "$(grep -o "azaad-build-sha\\\" content=\\\"$GITHUB_SHA" admin.html | wc -l)" -ge 1

      - name: Validate canonical Admin JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          node --check admin.js
          node --check admin-shell.js
          node --check azaad-operations-control-center.js
          test "$(grep -o 'azaad-core-context.js' admin.html | wc -l)" -eq 1
          test "$(grep -o 'admin-shell.js' admin.html | wc -l)" -eq 1
          ! grep -Eq '\bbindTabs\s*\(' admin.js
          ! grep -Eq '\bswitchPanel\s*\(' admin.js

      - name: Wait for exact Vercel Production SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_URL: https://azaad-clinic-website.vercel.app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            html="$(curl -fsSL "$PRODUCTION_URL/admin.html" || true)"
            if printf '%s' "$html" | grep -Fq "azaad-build-sha\" content=\"$EXPECTED_SHA"; then
              echo "Production artifact SHA verified: $EXPECTED_SHA"
              exit 0
            fi
            echo "Waiting for Production SHA $EXPECTED_SHA ($attempt/60)"
            sleep 10
          done
          exit 1

      - name: Verify dedicated CI credentials
        shell: bash
        env:
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AZAAD_TEST_USERNAME"
          test -n "$AZAAD_TEST_PASSWORD"

      - name: Run authenticated Production Browser E2E
        shell: bash
        env:
          AZAAD_BASE_URL: https://azaad-clinic-website.vercel.app
          AZAAD_EXPECTED_PRODUCTION_SHA: ${{ github.sha }}
          AZAAD_TEST_USERNAME: frontdesk_azaad
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        run: npx playwright test qa/auth-bridge-production.spec.mjs

      - name: Final certification result
        run: echo "AZAAD PRODUCTION CERTIFICATION: PASS — exact SHA + canonical build + authenticated Production Browser evidence"
