name: AZAAD Operations Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  operations-health:
    name: Production operations health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify operating policies are present
        shell: bash
        run: |
          set -euo pipefail
          test -s AZAAD_ENGINEERING_CONTROL_PLAN.md
          test -s AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          test -s .github/workflows/azaad-release-governance-gate.yml
          test -s .github/workflows/azaad-browser-e2e.yml
          test -s .github/workflows/azaad-comprehensive-system-contract.yml

      - name: Verify free-only AI-first production constraint
        shell: bash
        run: |
          set -euo pipefail
          grep -F "AZAAD is a **100% free-only project** and an **AI-first clinic platform**." AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "Never upgrade a provider plan to make a gate pass." AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "Never introduce a paid API, paid AI model, paid credit pool, or paid service as a hidden dependency." AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "AI assistance is expected across the clinic platform" AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "the Patient Dashboard" AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "AI is assistive and must not become a single point of failure for core operations." AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "Every AI-assisted workflow must have a safe free fallback" AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "NOT PROVEN ON FREE-ONLY STACK" AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "Paid-only recovery resources are prohibited." AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          echo "Free-only AI-first production constraint: PASS"

      - name: Verify financial, clinical, AI, and evidence controls remain documented
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Refund Request → Doctor Approval → Management/Owner Approval → Refund Execution" AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "AI cannot approve, impersonate, bypass, or execute around this chain." AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "AI must never:" AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "AI financial approval" AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "AI privilege escalation" AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "AI authorization bypass" AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "AI/fallback result when the change affects an AI-assisted surface" AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "If evidence is missing, status is **NOT PROVEN**, not PASS." AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "Detect → Triage → Contain → Investigate → Correct → Verify → Deploy → Monitor → Postmortem" AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -F "A backup that has never been restored is not considered proven recovery capability." AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md

      - name: Verify one-time workflow safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          failures = []
          for path in Path('.github/workflows').glob('*.y*ml'):
              if not re.search(r'(?i)(one-time|once)', path.name):
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              on_block = text.split('\njobs:', 1)[0]
              for trigger in ('push:', 'schedule:', 'pull_request:', 'pull_request_target:'):
                  if trigger in on_block:
                      failures.append(f'{path}: automatic trigger {trigger}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('One-time workflow safety: PASS')
          PY

      - name: Production Vercel health check
        shell: bash
        run: |
          set -euo pipefail
          url="https://azaad-clinic-website.vercel.app/"
          echo "Checking ${url}"
          curl --fail --silent --show-error --location --max-time 30 "$url" >/tmp/azaad-vercel.html
          test -s /tmp/azaad-vercel.html
          # Production currently identifies the public clinic surface as
          # Azaad Psychotherapy; the old 'Azaad Clinic' literal was stale gate
          # text and caused a false-negative despite HTTP 200 and the canonical
          # central-i18n runtime being present.
          grep -Fq 'Azaad Psychotherapy' /tmp/azaad-vercel.html
          grep -Fq 'central-i18n.js' /tmp/azaad-vercel.html
          echo "Vercel production HTTP/content health: PASS"

      - name: Record production commit
        shell: bash
        run: |
          echo "Production operations health verified for ${GITHUB_SHA}"
