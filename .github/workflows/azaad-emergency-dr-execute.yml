name: AZAAD Emergency DR Execute

on:
  workflow_dispatch:
  push:
    branches:
      - emergency/supabase-evacuation

permissions:
  contents: read

concurrency:
  group: azaad-emergency-dr-execute
  cancel-in-progress: false

jobs:
  execute:
    name: Execute emergency evacuation gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact emergency candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Checkout DR execution implementation
        uses: actions/checkout@v4
        with:
          ref: codex/azaad-emergency-dr-execution
          path: .dr-execution
          fetch-depth: 1

      - name: Verify PostgreSQL 17 client before migration
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          command -v psql
          command -v pg_dump
          command -v pg_restore
          psql --version
          pg_dump --version
          pg_restore --version

      - name: Inventory source and runtime references
        shell: bash
        run: bash scripts/azaad-supabase-evacuation-inventory.sh

      - name: Verify migration secrets are present
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DR_BACKUP_PASSPHRASE: ${{ secrets.DR_BACKUP_PASSPHRASE }}
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_DB_URL NEON_DATABASE_URL DR_BACKUP_PASSPHRASE APPWRITE_ENDPOINT APPWRITE_PROJECT_ID APPWRITE_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING_SECRET=$name"
              missing=1
            else
              echo "PRESENT_SECRET=$name"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'FAIL-CLOSED: required evacuation secrets are not all configured.'
            exit 78
          fi

      - name: Execute Neon database restore
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DR_BACKUP_PASSPHRASE: ${{ secrets.DR_BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          test "$(pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "17"
          bash .dr-execution/scripts/azaad-dr-real-restore.sh

      - name: Record fail-closed certification state
        shell: bash
        run: |
          set -euo pipefail
          echo "candidate_sha=$GITHUB_SHA"
          echo 'database_restore=EXECUTED_IF_PRIOR_GATE_PASSED'
          echo 'identity_auth=NOT_PROVEN'
          echo 'storage=NOT_PROVEN'
          echo 'edge_functions=NOT_PROVEN'
          echo 'browser_clinical_financial_e2e=NOT_PROVEN'
          echo 'production_cutover=BLOCKED'
          echo 'supabase_retirement=BLOCKED'
