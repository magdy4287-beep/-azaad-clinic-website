name: AZAAD Controlled Runtime Provider Readiness

on:
  push:
    branches: [controlled-evolution/runtime-boundary-neon]
    paths:
      - '.github/workflows/azaad-controlled-runtime-provider-readiness.yml'
      - 'docs/AZAAD_WORKFLOW_OWNERSHIP_REGISTRY.md'
      - 'lib/azaad-runtime-contract.js'
      - 'scripts/azaad-appwrite-auth-inventory.sh'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/azaad-controlled-runtime-provider-readiness.yml'
      - 'docs/AZAAD_WORKFLOW_OWNERSHIP_REGISTRY.md'
      - 'lib/azaad-runtime-contract.js'
      - 'scripts/azaad-appwrite-auth-inventory.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-readiness:
    name: Appwrite identity/storage + Neon runtime readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve candidate SHA
        id: candidate
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target="${PR_HEAD_SHA:-$EVENT_SHA}"
          test -n "$target"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "AZAAD_CANDIDATE_SHA=$target"

      - name: Checkout exact candidate revision
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1

      - name: Verify exact candidate revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify canonical provider secrets exist
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPWRITE_ENDPOINT APPWRITE_PROJECT_ID APPWRITE_API_KEY NEON_DATABASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "FAIL-CLOSED: $name missing"
              exit 1
            fi
          done
          echo 'PASS: canonical Appwrite + Neon secret configuration is present.'

      - name: Read-only Appwrite identity inventory
        id: appwrite_identity
        continue-on-error: true
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint=(process.env.APPWRITE_ENDPOINT||'').replace(/\/$/,'');
          const project=process.env.APPWRITE_PROJECT_ID;
          const key=process.env.APPWRITE_API_KEY;
          const headers={'X-Appwrite-Project':project,'X-Appwrite-Key':key,'Accept':'application/json'};
          const response=await fetch(`${endpoint}/users?limit=1`,{headers});
          if(!response.ok) throw new Error(`Appwrite Users API HTTP ${response.status}`);
          const body=await response.json();
          if(!Number.isInteger(Number(body.total))) throw new Error('Appwrite user total is not numeric');
          console.log(`APPWRITE_USERS_TOTAL=${Number(body.total)}`);
          NODE

      - name: Read-only Appwrite storage inventory
        id: appwrite_storage
        continue-on-error: true
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint=(process.env.APPWRITE_ENDPOINT||'').replace(/\/$/,'');
          const project=process.env.APPWRITE_PROJECT_ID;
          const key=process.env.APPWRITE_API_KEY;
          const headers={'X-Appwrite-Project':project,'X-Appwrite-Key':key,'Accept':'application/json'};
          const response=await fetch(`${endpoint}/storage/buckets?limit=100`,{headers});
          if(!response.ok) throw new Error(`Appwrite Storage API HTTP ${response.status}`);
          const body=await response.json();
          const buckets=(body.buckets||[]).map(x=>x.name).sort();
          console.log(`APPWRITE_STORAGE_BUCKETS=${buckets.length}`);
          console.log(`APPWRITE_STORAGE_BUCKET_NAMES=${buckets.join('|')}`);
          NODE

      - name: Verify Neon database reachability and runtime contract
        id: neon
        continue-on-error: true
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT current_database(), current_user;"
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_namespace WHERE nspname='public') THEN 1 ELSE 0 END;
          SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_namespace WHERE nspname='private') THEN 1 ELSE 0 END;
          SQL
          echo 'PASS: canonical Neon runtime boundary is reachable.'

      - name: Fail closed if any provider boundary failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for pair in "Appwrite identity:${{ steps.appwrite_identity.outcome }}" "Appwrite storage:${{ steps.appwrite_storage.outcome }}" "Neon:${{ steps.neon.outcome }}"; do
            name="${pair%%:*}"; outcome="${pair#*:}"
            echo "$name => $outcome"
            if [ "$outcome" != "success" ]; then failures=$((failures+1)); fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "FAIL-CLOSED: $failures provider boundary check(s) failed."
            exit 1
          fi
          echo 'PASS: all controlled provider boundaries verified.'
