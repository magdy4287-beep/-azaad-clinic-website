name: AZAAD Source Canonicality Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  source-canonicality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact PR head revision
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "EXACT-SHA: $actual"

      - name: One-time materialization of canonical source
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git log -1 --format=%s | grep -Fq '[skip ci]'; then
            echo 'ONE-TIME MATERIALIZATION: skipped on generated canonical-source commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import ast, subprocess
          from pathlib import Path
          tree=ast.parse(Path('qa/vercel-build.py').read_text(encoding='utf-8'))
          node=next(n.value for n in tree.body if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and n.targets[0].id=='TRANSFORM_STEPS')
          tuple_node=node.generators[0].iter
          for element in tuple_node.elts:
              command=['python3', ast.literal_eval(element)]
              print('[AZAAD ONE-TIME MATERIALIZATION]', ' '.join(command), flush=True)
              subprocess.run(command, check=True)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'<meta\s+name=["\']azaad-build-sha["\'][^>]*>\s*\n?', '', t, flags=re.I)
          p.write_text(t, encoding='utf-8')
          PY
          rm -f .github/workflows/azaad-source-materialization-once.yml
          rm -f .github/workflows/azaad-one-time-source-materialization.yml
          git checkout -- .github/workflows/azaad-source-canonicality-gate.yml
          if git diff --quiet; then
            echo 'ONE-TIME MATERIALIZATION: no source drift generated'
            exit 0
          fi
          git add -A
          git commit -m 'chore: materialize canonical production source [skip ci]'
          git push origin "HEAD:${PR_HEAD_REF}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run production build transforms and verification
        run: python3 qa/vercel-build.py

      - name: Fail if the build had to canonicalize source
        run: |
          if ! git diff --quiet -- . ':!.github/workflows/azaad-source-canonicality-gate.yml'; then
            echo 'SOURCE-CANONICALITY-GATE: FAIL'
            echo 'The production build mutated repository source. A build-time legacy-to-canonical translation layer still exists.'
            git status --short
            git diff --stat
            git diff -- . ':!.github/workflows/azaad-source-canonicality-gate.yml' > source-canonicality.patch
            exit 1
          fi
          echo 'SOURCE-CANONICALITY-GATE: PASS'

      - name: Upload canonicality diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: azaad-source-canonicality-diagnostic
          path: source-canonicality.patch
          if-no-files-found: ignore
