name: AZAAD Source Canonicality Gate

on:
  push:
    branches:
      - chore/zero-supabase-retirement-20260913
  pull_request:

permissions:
  contents: write

jobs:
  source-canonicality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: One-time canonicalize legacy admin source
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq 'supabase|functions/v1/(staff-login|staff-admin)|@supabase/supabase-js|derofsthjivlkcdnojww' admin.js; then
            python3 qa/finalize-appwrite-admin-auth.py
            python3 qa/finalize-admin-browser-runtime-reference-boundary.py
            python3 qa/finalize-staff-management-appwrite.py
            python3 qa/retire-legacy-admin-staff-runtime.py
            python3 qa/finalize-appwrite-browser-session-contract.py
            python3 qa/finalize-admin-staff-caller-boundary.py
            python3 qa/final-admin-restore-boundary.py
            python3 qa/finalize-staff-management-runtime-boundary.py
          fi

      - name: Remove obsolete legacy admin transform ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('qa/vercel-build.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(',\"qa/retire-legacy-admin-staff-runtime.py\"', '')
          text = text.replace('(\"qa/finalize-staff-management-appwrite.py\",\"qa/retire-legacy-admin-staff-runtime.py\"),(\"qa/retire-legacy-admin-staff-runtime.py\",\"qa/finalize-appwrite-browser-session-contract.py\"),', '(\"qa/finalize-staff-management-appwrite.py\",\"qa/finalize-appwrite-browser-session-contract.py\"),')
          p.write_text(text, encoding='utf-8')
          Path('qa/retire-legacy-admin-staff-runtime.py').unlink()
          Path('.github/workflows/azaad-one-time-admin-source-canonicalization.yml').unlink(missing_ok=True)
          Path('docs/engineering/ADMIN_SOURCE_CANONICALIZATION_TRIGGER.md').unlink(missing_ok=True)
          PY

      - name: Commit canonical source migration before build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.js admin.html qa/vercel-build.py qa/retire-legacy-admin-staff-runtime.py .github/workflows/azaad-one-time-admin-source-canonicalization.yml docs/engineering/ADMIN_SOURCE_CANONICALIZATION_TRIGGER.md
          if git diff --cached --quiet; then
            echo 'No one-time admin source migration changes were produced.'
          else
            git commit -m 'refactor: make admin source canonical and retire migration transform'
            git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          fi

      - name: Run production build transforms and verification
        run: python3 qa/vercel-build.py

      - name: Fail if the build had to canonicalize source
        run: |
          if ! git diff --quiet -- . ':!.github/workflows/azaad-source-canonicality-gate.yml'; then
            echo 'SOURCE-CANONICALITY-GATE: FAIL'
            echo 'The production build mutated repository source. A build-time legacy-to-canonical translation layer still exists.'
            git status --short
            git diff --stat
            git diff -- . ':!.github/workflows/azaad-source-canonicality-gate.yml' > source-canonicality.patch
            exit 1
          fi
          echo 'SOURCE-CANONICALITY-GATE: PASS'

      - name: Upload canonicality diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: azaad-source-canonicality-diagnostic
          path: source-canonicality.patch
          if-no-files-found: ignore