name: Azaad Production Browser E2E

# Canonical production certification workflow. A push to main runs against the
# exact commit that Vercel deploys; no manual SHA substitution is permitted.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: azaad-production-browser-e2e-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AZAAD_TEST_USERNAME: frontdesk_azaad

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Verify exact commit under test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          timeout 15m npx playwright install chromium

      - name: Create immutable canonical production build copy for pull requests and branch dispatches
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/azaad-build
          mkdir -p /tmp/azaad-build
          cp -a . /tmp/azaad-build
          cd /tmp/azaad-build
          python3 qa/vercel-build.py
          npm install --no-save --no-package-lock @neondatabase/serverless

      - name: Validate Admin production artifact JavaScript syntax
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          for file in admin-english-hardening.js admin.js admin-shell.js frontdesk-workflow.js; do
            if [[ -f "$file" ]]; then node --check "./$file"; fi
          done
          if [[ -f ./admin-auth-ui-guard.js ]]; then node --check ./admin-auth-ui-guard.js; fi

      - name: Start local canonical production build API runtime for pull requests and branch dispatches
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPWRITE_ENDPOINT" || { echo 'FAIL-CLOSED: APPWRITE_ENDPOINT missing'; exit 1; }
          test -n "$APPWRITE_PROJECT_ID" || { echo 'FAIL-CLOSED: APPWRITE_PROJECT_ID missing'; exit 1; }
          test -n "$APPWRITE_API_KEY" || { echo 'FAIL-CLOSED: APPWRITE_API_KEY missing'; exit 1; }
          test -n "$DATABASE_URL" || { echo 'FAIL-CLOSED: NEON_DATABASE_URL missing'; exit 1; }
          cd /tmp/azaad-build
          node qa/local-vercel-runtime.mjs >/tmp/azaad-http.log 2>&1 &
          echo $! > /tmp/azaad-http.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/azaad-http.log || true
          exit 1

      - name: Verify controlled browser credential configuration
        env:
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZAAD_TEST_USERNAME"
          test -n "$AZAAD_TEST_PASSWORD"
          echo "Browser E2E uses the controlled Frontdesk identity: $AZAAD_TEST_USERNAME"

      - name: Verify browser certification contract includes real refresh persistence coverage
        shell: bash
        run: |
          set -euo pipefail
          spec=qa/browser-e2e.spec.mjs
          test -s "$spec"
          grep -Fq "admin session survives a real browser refresh without returning to login" "$spec"
          grep -Fq "await page.reload({waitUntil:'domcontentloaded'})" "$spec"
          grep -Fq "await expect(page.locator('#adminPage')).toBeVisible" "$spec"
          grep -Fq "await expect(page.locator('#loginPage')).toBeHidden" "$spec"
          grep -Fq "azaad_admin_appwrite_session" "$spec"
          grep -Fq "provider:'appwrite'" "$spec"
          echo 'Browser refresh persistence certification contract: PASS'

      - name: Prove production Admin runtime invariants before browser execution
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://azaad-clinic-website.vercel.app/admin.html >/tmp/azaad-production-admin.html
          test "$(grep -o 'azaad-core-context.js' /tmp/azaad-production-admin.html | wc -l)" -eq 1
          test "$(grep -o 'admin-shell.js' /tmp/azaad-production-admin.html | wc -l)" -eq 1
          curl -fsS 'https://azaad-clinic-website.vercel.app/admin.js?v=certification' >/tmp/azaad-production-admin.js
          ! grep -Eq '\bbindTabs\s*\(' /tmp/azaad-production-admin.js
          ! grep -Eq '\bswitchPanel\s*\(' /tmp/azaad-production-admin.js
          ! grep -Eq '\brestoreSession\s*\(' /tmp/azaad-production-admin.js
          echo 'Production Admin runtime invariants: PASS'

      - name: Wait for Vercel production to expose the exact commit under test
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          for attempt in {1..30}; do
            html="$(curl -fsS "https://azaad-clinic-website.vercel.app/admin.html?e2e_sha_check=$expected" || true)"
            if printf '%s' "$html" | grep -Fq "<meta name=\"azaad-build-sha\" content=\"$expected\">"; then
              echo "Production artifact matches exact GitHub SHA: $expected"
              exit 0
            fi
            sleep 10
          done
          echo "Production artifact did not expose exact GitHub SHA: $expected"
          grep -oE 'azaad-build-sha[^>]*' /tmp/azaad-production-admin.html 2>/dev/null || true
          exit 1

      - name: Run browser shell/control-plane/domain E2E against production on main
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          AZAAD_BASE_URL: https://azaad-clinic-website.vercel.app
          AZAAD_EXPECTED_PRODUCTION_SHA: ${{ github.sha }}
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        run: npx playwright test --workers=1 qa/browser-e2e.spec.mjs qa/admin-domain-runtime-e2e.spec.mjs qa/admin-domain-certification-matrix.spec.mjs qa/platform-control-plane.spec.mjs qa/responsive-ui.spec.mjs qa/public-language-media-e2e.spec.mjs qa/patient-portal-e2e.spec.mjs

      - name: Run browser shell/control-plane/domain/responsive E2E against exact checked-out canonical production build on pull requests and branch dispatches
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        env:
          AZAAD_BASE_URL: http://127.0.0.1:4173
          AZAAD_EXPECTED_PRODUCTION_SHA: ${{ github.sha }}
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        run: npx playwright test --workers=1 qa/browser-e2e.spec.mjs qa/admin-domain-runtime-e2e.spec.mjs qa/admin-domain-certification-matrix.spec.mjs qa/platform-control-plane.spec.mjs qa/responsive-ui.spec.mjs qa/public-language-media-e2e.spec.mjs qa/patient-portal-e2e.spec.mjs

      - name: Enforce Production Certification policy
        shell: bash
        run: |
          set -euo pipefail
          test -s AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          test -s AZAAD_ENGINEERING_CONTROL_PLAN.md
          test -s AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -Fq 'AI-First • Free-Only • Safety-Gated • Continuous Delivery' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'AZAAD is 100% free-only.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
