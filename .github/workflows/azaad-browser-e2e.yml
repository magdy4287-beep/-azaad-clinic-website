name: Azaad Production Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: azaad-production-certification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AZAAD_TEST_USERNAME: frontdesk_azaad

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v5

      - name: Verify exact commit under test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Create immutable local production-parity build copy for pull requests and manual branch runs
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/azaad-build
          mkdir -p /tmp/azaad-build
          cp -a . /tmp/azaad-build/
          cd /tmp/azaad-build
          python3 qa/inject-central-i18n.py
          python3 qa/inject-responsive-shell.py
          python3 .github/patch-admin.py
          python3 .github/finalize-auth.py
          python3 .github/inject-patient-actions.py
          python3 .github/inject-doctor-actions.py

      - name: Preflight production-parity JavaScript syntax
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('admin.html').read_text(encoding='utf-8')
          srcs = re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\'][^>]*>', html, flags=re.I)
          checked = []
          for src in srcs:
              if src.startswith(('http://','https://','//')):
                  continue
              path = Path(src.split('?',1)[0].lstrip('./'))
              if path.exists() and path.suffix == '.js':
                  subprocess.run(['node','--check',str(path)],check=True)
                  checked.append(str(path))
          inline = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          for i, code in enumerate(inline, 1):
              if not code.strip():
                  continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as f:
                  f.write(code)
                  name=f.name
              subprocess.run(['node','--check',name],check=True)
          print(f'Syntax preflight passed for {len(checked)} local external scripts and {len(inline)} inline script blocks.')
          PY

      - name: Start local checked-out production-parity build server for pull requests and manual branch runs
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/azaad-http.log 2>&1 &
          echo $! > /tmp/azaad-http.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Local Azaad immutable production-parity build is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/azaad-http.log || true
          exit 1

      - name: Verify controlled browser credential configuration
        env:
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZAAD_TEST_USERNAME"
          test -n "$AZAAD_TEST_PASSWORD"
          echo "Browser E2E uses the controlled Frontdesk identity: $AZAAD_TEST_USERNAME"

      - name: Run browser shell/control-plane E2E against production on main
        if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        env:
          AZAAD_BASE_URL: https://azaad-clinic-website.vercel.app
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        run: npx playwright test qa/browser-e2e.spec.mjs qa/platform-control-plane.spec.mjs qa/responsive-ui.spec.mjs

      - name: Run browser shell/control-plane/responsive E2E against exact checked-out production-parity build copy on pull requests and manual branch runs
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        env:
          AZAAD_BASE_URL: http://127.0.0.1:4173
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        run: npx playwright test qa/browser-e2e.spec.mjs qa/platform-control-plane.spec.mjs qa/responsive-ui.spec.mjs

      - name: Enforce Production Certification policy
        shell: bash
        run: |
          set -euo pipefail
          test -s AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          test -s AZAAD_ENGINEERING_CONTROL_PLAN.md
          test -s AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -Fq 'AI-First • Free-Only • Safety-Gated • Continuous Delivery' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'AZAAD is 100% free-only.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'NOT PROVEN ON FREE-ONLY STACK' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'AI is assistive only' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'Refund Request → Doctor Approval → Management/Owner Approval → Refund Execution' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'Evidence must correspond to the exact production commit under certification.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'A missing or stale evidence item is `NOT PROVEN`, not PASS.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq '100% free-only' AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -Fq 'AI-first clinic platform' AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -Fq 'AI must never:' AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          echo "Production certification policy verified for commit: $(git rev-parse HEAD)"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azaad-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop local server
        if: always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'))
        shell: bash
        run: |
          if [[ -f /tmp/azaad-http.pid ]]; then
            kill "$(cat /tmp/azaad-http.pid)" 2>/dev/null || true
          fi

# Source certification remains non-mutating: PR/manual branch browser tests run from an immutable production-parity /tmp build copy.
# The copy mirrors Vercel's buildCommand so browser evidence reflects the deployed artifact shape.
# Main pushes validate the deployed production shell; pull requests/manual branch runs validate the exact checked-out production-parity build copy.
# Authenticated E2E is gated behind a dedicated controlled Frontdesk credential and never bypassed with fake credentials.