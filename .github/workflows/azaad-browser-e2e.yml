name: Azaad Production Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve browser test base URL
        id: base-url
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            sha="${{ github.event.pull_request.head.sha }}"
            url=""

            for attempt in {1..12}; do
              url="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/deployments?sha=${sha}&per_page=20" \
                --jq '.[] | select(.environment == "Preview") | .id' \
                | while read -r deployment_id; do
                    gh api \
                      -H 'Accept: application/vnd.github+json' \
                      "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=20" \
                      --jq '.[] | select(.state == "success") | (.environment_url // .target_url)' \
                      | head -n 1
                  done \
                | head -n 1)"

              if [[ -n "$url" ]]; then
                break
              fi
              sleep 5
            done

            if [[ -z "$url" ]]; then
              echo "No successful Vercel Preview deployment URL found for ${sha}." >&2
              exit 1
            fi

            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "Testing Vercel Preview: $url"
          else
            echo "url=https://azaad-clinic-website.vercel.app" >> "$GITHUB_OUTPUT"
            echo "Testing production: https://azaad-clinic-website.vercel.app"
          fi

      - name: Run browser E2E
        env:
          AZAAD_BASE_URL: ${{ steps.base-url.outputs.url }}
          AZAAD_TEST_USERNAME: ${{ secrets.AZAAD_TEST_USERNAME }}
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_TEST_PASSWORD }}
        run: npx playwright test qa/browser-e2e.spec.mjs qa/public-ui.spec.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azaad-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

# CI: production on main, Vercel Preview deployment on pull requests
