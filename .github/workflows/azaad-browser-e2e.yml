name: Azaad Production Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: azaad-production-certification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AZAAD_TEST_USERNAME: frontdesk_azaad

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v5

      - name: Verify exact commit under test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          timeout 15m npx playwright install chromium

      - name: Create immutable local production-parity build copy for pull requests and branch dispatches
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/azaad-build
          mkdir -p /tmp/azaad-build
          cp -a . /tmp/azaad-build/
          cd /tmp/azaad-build
          python3 qa/inject-central-i18n.py
          python3 qa/inject-responsive-shell.py
          python3 .github/patch-admin.py
          python3 .github/finalize-auth.py
          python3 qa/restore-admin-submit-binding.py
          python3 .github/inject-patient-actions.py
          python3 .github/inject-doctor-actions.py

      - name: Validate Admin production-parity JavaScript syntax
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          node --check ./admin-english-hardening.js
          if [[ -f ./admin-auth-ui-guard.js ]]; then
            node --check ./admin-auth-ui-guard.js
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path('admin.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I | re.S)
          failed = 0
          for index, source in enumerate(blocks, start=1):
              if not source.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', encoding='utf-8', suffix='.js', delete=False) as handle:
                  handle.write(source)
                  path = handle.name
              result = subprocess.run(['node', '--check', path], text=True, capture_output=True)
              if result.returncode:
                  print(f'Inline JavaScript syntax failure: admin.html script block {index}')
                  print(result.stdout)
                  print(result.stderr)
                  failed = 1
          if failed:
              raise SystemExit(1)
          print('Admin production-parity JavaScript syntax validation passed.')
          PY

      - name: Start local checked-out production-parity build server for pull requests and branch dispatches
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/azaad-http.log 2>&1 &
          echo $! > /tmp/azaad-http.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Local Azaad immutable production-parity build is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/azaad-http.log || true
          exit 1

      - name: Verify controlled browser credential configuration
        env:
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZAAD_TEST_USERNAME"
          test -n "$AZAAD_TEST_PASSWORD"
          echo "Browser E2E uses the controlled Frontdesk identity: $AZAAD_TEST_USERNAME"

      - name: Run browser shell/control-plane E2E against production on main
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          AZAAD_BASE_URL: https://azaad-clinic-website.vercel.app
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        run: npx playwright test qa/browser-e2e.spec.mjs qa/platform-control-plane.spec.mjs qa/responsive-ui.spec.mjs

      - name: Run browser shell/control-plane/responsive E2E against exact checked-out production-parity build copy on pull requests and branch dispatches
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        env:
          AZAAD_BASE_URL: http://127.0.0.1:4173
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        run: npx playwright test qa/browser-e2e.spec.mjs qa/platform-control-plane.spec.mjs qa/responsive-ui.spec.mjs

      - name: Enforce Production Certification policy
        shell: bash
        run: |
          set -euo pipefail
          test -s AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          test -s AZAAD_ENGINEERING_CONTROL_PLAN.md
          test -s AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -Fq 'AI-First • Free-Only • Safety-Gated • Continuous Delivery' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'AZAAD is 100% free-only.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
