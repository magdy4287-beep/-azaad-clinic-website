name: Azaad Production Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-e2e:
    # Vercel Preview deployments are protected in this project. Run the real browser gate
    # against the public production domain after merge; PRs remain covered by the
    # contract/security/acceptance gates that do not require browser access.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for public Vercel production deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          found="false"

          for attempt in {1..18}; do
            deployment_ids="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/deployments?sha=${sha}&per_page=100" \
              --jq '.[].id')"

            while read -r deployment_id; do
              [[ -z "$deployment_id" ]] && continue
              state="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=100" \
                --jq '[.[] | select(.state == "success")] | length')"
              if [[ "$state" != "0" ]]; then
                found="true"
                break
              fi
            done <<< "$deployment_ids"

            [[ "$found" == "true" ]] && break
            sleep 5
          done

          if [[ "$found" != "true" ]]; then
            echo "No GitHub deployment status was found for ${sha}; continuing with the public production URL." >&2
          fi

          echo "Testing production: https://azaad-clinic-website.vercel.app"

      - name: Run browser E2E
        env:
          AZAAD_BASE_URL: https://azaad-clinic-website.vercel.app
          AZAAD_TEST_USERNAME: ${{ secrets.AZAAD_TEST_USERNAME }}
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_TEST_PASSWORD }}
        run: npx playwright test qa/browser-e2e.spec.mjs qa/public-ui.spec.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azaad-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

# CI: public browser gate runs on main after merge; PRs use non-browser contract/security gates
