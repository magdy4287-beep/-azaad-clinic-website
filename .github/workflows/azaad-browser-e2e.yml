name: Azaad Production Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve browser test base URL
        id: base-url
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "url=https://deploy-preview-${{ github.event.pull_request.number }}--azaadclinic.netlify.app" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://azaad-clinic-website.vercel.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Run browser E2E
        env:
          AZAAD_BASE_URL: ${{ steps.base-url.outputs.url }}
          AZAAD_TEST_USERNAME: ${{ secrets.AZAAD_TEST_USERNAME }}
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_TEST_PASSWORD }}
        run: npx playwright test qa/browser-e2e.spec.mjs qa/public-ui.spec.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azaad-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

# CI: production on main, immutable PR preview on pull requests
