name: Azaad Production Browser E2E

on:
  push:
    branches:
      - main
      - codex/azaad-engineering-control-plan-20260817
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local PR build server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/azaad-http.log 2>&1 &
          echo $! > /tmp/azaad-http.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Local Azaad PR build is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/azaad-http.log || true
          exit 1

      - name: Run browser E2E against checked-out PR code
        env:
          AZAAD_BASE_URL: http://127.0.0.1:4173
          AZAAD_TEST_USERNAME: ${{ secrets.AZAAD_TEST_USERNAME }}
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_TEST_PASSWORD }}
        run: npx playwright test qa/browser-e2e.spec.mjs qa/public-ui.spec.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azaad-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/azaad-http.pid ]]; then
            kill "$(cat /tmp/azaad-http.pid)" 2>/dev/null || true
          fi

# Browser E2E intentionally tests the exact checked-out PR files locally.
# This avoids provider-specific preview access controls and makes PR validation deterministic.
