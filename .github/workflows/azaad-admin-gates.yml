name: Azaad Admin Acceptance Gates

# Free-first acceptance gate: every main push and every PR to main is verified.
# CI revalidation marker: canonical Admin backend ownership verification.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  admin-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run free structural acceptance gates
        run: python3 qa/admin-gates.py

      - name: Apply canonical Admin interactivity transformation before ownership verification
        run: python3 qa/canonicalize-admin-interactivity-v2.py

      - name: Run canonical Admin panel ownership gate
        run: python3 qa/admin-panel-ownership-contract.py

      - name: Apply canonical Admin operational-data transformation before backend boundary verification
        run: python3 qa/finalize-admin-operational-data.py

      - name: Run canonical Admin backend boundary gate
        run: python3 qa/admin-backend-boundary-gate.py

      - name: Run scheduling contract gate
        run: python3 qa/scheduling-contract-gate.py

      - name: Run canonical Marketing Studio V3 gate
        run: python3 qa/marketing-studio-v3-gate.py
