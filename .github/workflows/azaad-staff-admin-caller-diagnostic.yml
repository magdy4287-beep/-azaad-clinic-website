name: Azaad Staff Admin Caller Diagnostic

on:
  push:
    branches:
      - controlled-evolution/e2e-calendar-session-root-fix-2026-09-05
  pull_request:
    branches:
      - main
    paths:
      - 'admin.js'
      - 'qa/**'
      - '.github/**'

permissions:
  contents: read

jobs:
  caller-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Build immutable artifact
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/azaad-build
          mkdir -p /tmp/azaad-build
          cp -a . /tmp/azaad-build
          cd /tmp/azaad-build
          python3 qa/vercel-build.py
      - name: Print only structural staff-admin caller contexts
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          echo '=== staff-admin references in final admin artifact ==='
          grep -n -C 8 -F '/api/staff-admin' admin.js || true
          echo '=== staffApi call sites ==='
          grep -n -C 5 -E 'staffApi\(|AZAAD_STAFF.*(init|load)' admin.js || true
          echo '=== final SECRETARY permission block ==='
          grep -n -A 8 -B 2 'SECRETARY:' admin.js || true
