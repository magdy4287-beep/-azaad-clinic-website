name: I18N Stability Contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  i18n-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate central I18N stability contract
        run: python qa/i18n-stability-contract.py
