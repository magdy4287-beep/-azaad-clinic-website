name: Azaad Marketing Security Gate
on:
  pull_request:
    paths: ['marketing-intelligence-studio.js','docs/AZAAD_MARKETING_INTELLIGENCE_STUDIO_2026-08-15.md','docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md','.github/workflows/azaad-marketing-security-gate.yml']
  push:
    branches: [main]
    paths: ['marketing-intelligence-studio.js','docs/AZAAD_MARKETING_INTELLIGENCE_STUDIO_2026-08-15.md','docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md','.github/workflows/azaad-marketing-security-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate marketing channels
        run: |
          test -s marketing-intelligence-studio.js
          for x in instagram facebook tiktok linkedin website; do grep -qi "$x" marketing-intelligence-studio.js; done
          grep -q "paid social APIs" docs/AZAAD_MARKETING_INTELLIGENCE_STUDIO_2026-08-15.md
      - name: Validate active canonical security contract
        run: |
          grep -q "Active Security Audit Contract" docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md
          grep -q "AI remains assistive" docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md
          grep -q "Sensitive clinical, financial, identity and administrative data" docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md
          grep -q "Refund approval hierarchy remains server-enforced" docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md
