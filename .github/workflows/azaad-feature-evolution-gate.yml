name: Azaad Feature Evolution Gate
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  feature-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check canonical browser modules
        run: |
          set -euo pipefail
          for file in marketing-studio-v4.js public-team-display.js; do
            test -f "$file"
            node --check "$file"
          done
      - name: Run canonical feature contract
        run: python qa/marketing-hybrid-and-public-privacy-gate.py
      - name: Verify canonical marketing ownership
        run: |
          set -euo pipefail
          test -f marketing-studio-v4.js
          test -f public-team-display.js
          test -f api/_public-clinic-data.js
          test -f qa/marketing-hybrid-and-public-privacy-gate.py
          ! grep -RInE --exclude-dir=.git --exclude='*.map' --exclude='*.md' \
            'marketing-studio-v3\.js|clinic_team|supabase/functions/azaad-marketing-ai' \
            marketing-studio-v4.js public-team-display.js api/_public-clinic-data.js
          echo 'canonical marketing ownership: PASS'
