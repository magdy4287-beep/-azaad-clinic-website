name: Fix admin session bootstrap

on:
  push:
    paths:
      - '.github/workflows/fix-admin-bootstrap.yml'
      - 'admin.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix duplicate bootstrap and auth signout
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('admin.js')
          s = p.read_text(encoding='utf-8')
          original = s

          # Never sign out merely because a staff lookup failed during auth restoration.
          s = re.sub(
              r'\s*else \{\s*await supabase\.auth\.signOut\(\);\s*\}',
              '\n          }',
              s,
              count=1,
          )
          s = re.sub(
              r'\s*catch \(error\) \{\s*console\.error\(\s*"Auth staff restore error:",\s*error\s*\);\s*\s*await supabase\.auth\.signOut\(\);\s*\}',
              '',
              s,
              count=1,
              flags=re.S,
          )

          # Keep exactly one startup listener. The first listener already binds the UI and restores session.
          marker = '/* ============================================================\n   BOOTSTRAP SESSION ON EVERY PAGE LOAD'
          idx = s.find(marker)
          if idx != -1:
              s = s[:idx].rstrip() + '\n'

          # Add a single guarded bootstrap after the existing START block.
          if 'window.__AZAAD_SINGLE_BOOTSTRAP__' not in s:
              s += '''\n/* ============================================================\n   SINGLE SAFE ADMIN BOOTSTRAP\n   ============================================================ */\nwindow.__AZAAD_SINGLE_BOOTSTRAP__ = true;\n\n''' \
              + '''/* The START block above is the only DOMContentLoaded bootstrap. */\n'''

          if s != original:
              p.write_text(s, encoding='utf-8')

      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix admin session bootstrap duplication"
          git push
