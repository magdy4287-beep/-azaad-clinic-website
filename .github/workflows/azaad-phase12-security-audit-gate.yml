name: AZAAD Phase 12 Full Security Audit Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate security audit contract
        run: |
          test -f docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md
          grep -q "Security-definer database functions must use an explicit, safe search path" docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md
          grep -q "unintended anonymous or public actors" docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md
          grep -q "Every RLS-enabled production table" docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md
          grep -q "Sensitive clinical, financial, identity and administrative data" docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md
          grep -q "Refund approval hierarchy remains server-enforced" docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md
          grep -q "Payment authorization, invoice balance" docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md
          grep -q "AI remains assistive" docs/AZAAD_PLATFORM_CANONICAL_OWNERSHIP.md
          echo "Phase 12 Security Audit contract: PASS"
