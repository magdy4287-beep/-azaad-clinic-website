name: Azaad Payments & Reporting Contract Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  payments-reporting-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run payments/reporting contract gate
        run: python qa/payments-reporting-contract-gate.py
