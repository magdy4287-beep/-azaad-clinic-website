name: Azaad Browser Certification Trigger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-browser-certification:
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical SHA
        run: |
          test -n "${GITHUB_SHA}"
          echo "Canonical certification SHA: ${GITHUB_SHA}"
      - name: Certification handoff
        run: |
          echo "Browser certification must execute against this exact SHA: ${GITHUB_SHA}"
