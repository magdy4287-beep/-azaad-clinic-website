name: Deploy Azaad Clinic

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Patch legacy admin restore before publishing
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("admin.html")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'async function restoreStaff\(\)\{.*?\n\}\n\nasync function logout\(\)',
              re.S,
          )

          replacement = '''async function restoreStaff(){

  if(!state.user?.id){
    return false;
  }

  const accessToken =
    state.session?.access_token;

  if(!accessToken){
    return false;
  }

  try{
    const response =
      await fetch(
        `${SUPABASE_URL}/functions/v1/azaad-admin?api=account`,
        {
          method:"GET",
          headers:{
            Accept:"application/json",
            Authorization:`Bearer ${accessToken}`,
            apikey:SUPABASE_PUBLISHABLE_KEY
          },
          cache:"no-store"
        }
      );

    let body = {};
    try{
      body = await response.json();
    }catch(_){}

    if(!response.ok || !body?.admin){
      console.warn(
        "Admin restore failed; keeping authenticated session.",
        body?.error || `HTTP ${response.status}`
      );
      return false;
    }

    return applyStaff(body.admin);
  }catch(error){
    console.error("Admin restore request failed:",error);
    return false;
  }
}

async function logout()'''

          patched, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Expected legacy restoreStaff block was not found")

          path.write_text(patched, encoding="utf-8")
          print("Patched admin.html restoreStaff: legacy signOut path removed")

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
