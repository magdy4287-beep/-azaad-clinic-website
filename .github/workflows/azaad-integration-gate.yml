name: Azaad Cross-Module Integration Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check patients-center.js
          node --check ai-operating-center.js
      - name: Validate cross-module contract
        run: python3 qa/azaad-integration-contract.py
