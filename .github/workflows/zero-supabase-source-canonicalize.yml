name: Zero-Supabase Source Canonicalization

on:
  push:
    branches:
      - chore/zero-supabase-retirement-20260913

permissions:
  contents: write

jobs:
  canonicalize:
    if: ${{ !contains(github.event.head_commit.message, '[canonicalize-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify exact commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply canonical production build transformations to source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/vercel-build.py

      - name: Commit canonicalized source tree
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes produced by canonicalization.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: canonicalize source runtime for zero Supabase [canonicalize-generated]'
          git push origin HEAD:chore/zero-supabase-retirement-20260913
