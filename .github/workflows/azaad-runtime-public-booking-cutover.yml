name: AZAAD Runtime Public Booking Cutover

on:
  push:
    branches:
      - controlled-evolution/runtime-boundary-neon
    paths:
      - '.github/workflows/azaad-runtime-public-booking-cutover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controlled-evolution/runtime-boundary-neon
          fetch-depth: 0

      - name: Replace public booking Supabase URLs with provider-neutral API routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'https://derofsthjivlkcdnojww.supabase.co/functions/v1/azaad-public-booking': '/api/public-booking',
            'https://derofsthjivlkcdnojww.supabase.co/functions/v1/azaad-public-clinic-data': '/api/public-clinic-data',
            'https://derofsthjivlkcdnojww.supabase.co/functions/v1/azaad-public-scheduling': '/api/public-scheduling',
          }
          for old, new in replacements.items():
            s = s.replace(old, new)
          remaining = [old for old in replacements if old in s]
          if remaining:
            raise SystemExit(f'cutover failed; remaining Supabase public booking URLs: {remaining}')
          p.write_text(s, encoding='utf-8')
          PY
          grep -n "supabase.co/functions/v1/azaad-public-\(booking\|clinic-data\|scheduling\)" app.js && exit 1 || true
          grep -nE "const (API|PUBLIC_API|PUBLIC_SCHEDULING_API)" app.js

      - name: Commit provider-neutral public booking cutover
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js; then
            echo 'PUBLIC_BOOKING_CUTOVER=ALREADY_APPLIED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'feat(runtime): cut public booking client over to Neon boundary'
          git push origin HEAD:controlled-evolution/runtime-boundary-neon
