name: Repair Patient Session Bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.author.name != 'Azaad Clinic Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin session bridge
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* AZAAD_PATIENT_SESSION_BRIDGE_V1 */'
          if marker not in s:
              needle = '    state.user =\n      result.session.user;'
              replacement = needle + "\n\n    " + marker + "\n    try {\n      sessionStorage.setItem('azaad_admin_token', result.session.access_token);\n    } catch (_) {}"
              if needle not in s:
                  raise SystemExit('login session anchor not found')
              s = s.replace(needle, replacement, 1)

              logout_needle = '  state.staff =\n    null;\n\n  state.initialized =\n    false;'
              logout_replacement = logout_needle + "\n\n  try {\n    sessionStorage.removeItem('azaad_admin_token');\n  } catch (_) {}"
              if logout_needle in s:
                  s = s.replace(logout_needle, logout_replacement, 1)

              p.write_text(s, encoding='utf-8')
          else:
              print('Patient session bridge already present')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Azaad Clinic Bot'
          git config user.email 'actions@github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix patient center session bridge'
          git push
