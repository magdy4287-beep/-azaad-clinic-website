name: AZAAD Emergency DR - Final Reconciliation

on:
  workflow_run:
    workflows:
      - AZAAD Emergency DR Execute
      - AZAAD Emergency DR — Auth Inventory
      - AZAAD Emergency DR - Edge Functions
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact emergency candidate commit SHA to certify
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: azaad-emergency-dr-final
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile all emergency evacuation gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Determine candidate SHA
        id: candidate
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.candidate_sha }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-${EVENT_SHA:-$CURRENT_SHA}}"
          printf '%s\n' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$sha"

      - name: Require successful database + storage evacuation run for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/workflows/azaad-emergency-dr-execute.yml/runs?head_sha=${SHA}&event=push&per_page=20"
          ok=0
          while IFS=$'\t' read -r status conclusion; do
            if [ "$status" = completed ] && [ "$conclusion" = success ]; then ok=1; break; fi
          done < <(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); for(const r of (j.workflow_runs||[])) console.log(`${r.status}\t${r.conclusion}`)')
          if [ "$ok" -ne 1 ]; then echo 'FAIL-CLOSED: no successful database+storage evacuation run for exact candidate SHA.'; exit 1; fi
          echo 'PASS: database + storage evacuation run verified.'

      - name: Require successful Auth inventory for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/workflows/azaad-emergency-dr-auth.yml/runs?head_sha=${SHA}&event=push&per_page=20"
          ok=0
          while IFS=$'\t' read -r status conclusion; do
            if [ "$status" = completed ] && [ "$conclusion" = success ]; then ok=1; break; fi
          done < <(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); for(const r of (j.workflow_runs||[])) console.log(`${r.status}\t${r.conclusion}`)')
          if [ "$ok" -ne 1 ]; then echo 'FAIL-CLOSED: no successful Auth evacuation inventory for exact candidate SHA.'; exit 1; fi
          echo 'PASS: Auth inventory verified.'

      - name: Require successful Edge Function evacuation for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/workflows/azaad-emergency-dr-functions.yml/runs?head_sha=${SHA}&event=push&per_page=20"
          ok=0
          while IFS=$'\t' read -r status conclusion; do
            if [ "$status" = completed ] && [ "$conclusion" = success ]; then ok=1; break; fi
          done < <(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); for(const r of (j.workflow_runs||[])) console.log(`${r.status}\t${r.conclusion}`)')
          if [ "$ok" -ne 1 ]; then echo 'FAIL-CLOSED: no successful Edge Function evacuation for exact candidate SHA.'; exit 1; fi
          echo 'PASS: Edge Function evacuation verified.'

      - name: Close emergency evacuation gate
        run: |
          echo 'FULL_DR_EVACUATION=PASS'
          echo 'DATABASE=PASS'
          echo 'STORAGE=PASS'
          echo 'AUTH_IDENTITY_EVIDENCE=PASS'
          echo 'EDGE_FUNCTIONS=PASS'
          echo 'SUPABASE_RETIREMENT=BLOCKED'
          echo 'REPAIRS=BLOCKED_UNTIL_EXPLICIT_DR_CLOSE'
