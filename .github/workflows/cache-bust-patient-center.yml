name: Cache bust patient center

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.author.name != 'Azaad Clinic Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Patient Center cache version
        run: |
          sed -i 's/patients-center.js?v=7.3.0/patients-center.js?v=7.4.0/g' admin.html
      - name: Commit
        run: |
          git config user.name 'Azaad Clinic Bot'
          git config user.email 'actions@github.com'
          git add admin.html
          git diff --cached --quiet || (git commit -m 'Fix Patient Center cache v7.4' && git push)
