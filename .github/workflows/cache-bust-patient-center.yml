name: Cache bust patient center

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.author.name != 'Azaad Clinic Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Patient Center assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'patient-session-bridge(?:-v3)?\.js(?:\?v=[^"\']+)?', 'patient-session-bridge-v3.js?v=3.0.0', s)
          s = re.sub(r'patients-center\.js(?:\?v=[^"\']+)?', 'patients-center.js?v=7.5.0', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'Azaad Clinic Bot'
          git config user.email 'actions@github.com'
          git add admin.html
          git diff --cached --quiet || (git commit -m 'fix: load patient session bridge v3' && git push)
