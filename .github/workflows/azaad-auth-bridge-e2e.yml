name: Azaad Auth Bridge E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    paths:
      - 'admin.html'
      - 'admin.js'
      - 'admin-shell.js'
      - 'azaad-role-experience.js'
      - 'azaad-operations-control-center.js'
      - '.github/patch-admin.py'
      - 'qa/vercel-build.py'
      - 'qa/browser-e2e.spec.mjs'
      - 'qa/auth-bridge-production.spec.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  AZAAD_TEST_USERNAME: frontdesk_azaad

jobs:
  auth-bridge-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact commit under test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -n "$(git rev-parse HEAD^)"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build exact canonical production artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/azaad-build
          mkdir -p /tmp/azaad-build
          cp -a . /tmp/azaad-build/
          cd /tmp/azaad-build
          python3 qa/vercel-build.py

      - name: Validate patched JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          node --check ./admin-english-hardening.js
          node --check ./frontdesk-workflow.js
          node --check ./azaad-operations-control-center.js
          node --check ./admin-shell.js

      - name: Start production-parity server
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/azaad-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/azaad-http.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/azaad-http.pid
          for attempt in {1..20}; do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/admin.html >/dev/null; then
              echo "AZAAD_LOCAL_SERVER_READY=1"
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "AZAAD_LOCAL_SERVER_EXITED=1"
              cat /tmp/azaad-http.log || true
              exit 1
            fi
            sleep 1
          done
          echo "AZAAD_LOCAL_SERVER_READY=0"
          cat /tmp/azaad-http.log || true
          exit 1

      - name: Verify dedicated CI credentials
        env:
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AZAAD_TEST_USERNAME"
          test -n "$AZAAD_TEST_PASSWORD"

      # Canonical browser-certification owner; keep this job bound to the exact push SHA.
      - name: Run authenticated API and browser E2E
        env:
          AZAAD_BASE_URL: http://127.0.0.1:4173
          AZAAD_EXPECTED_PRODUCTION_SHA: ${{ github.sha }}
          AZAAD_TEST_PASSWORD: ${{ secrets.AZAAD_E2E_FRONTDESK_PASSWORD }}
        run: npx playwright test qa/auth-bridge-production.spec.mjs
