name: Doctor Isolation Contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  doctor-isolation-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact PR head revision
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "EXACT-SHA: $actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run doctor isolation contract gate
        run: python qa/doctor-isolation-contract-gate.py
