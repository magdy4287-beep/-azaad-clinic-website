name: Doctor Isolation Contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  doctor-isolation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run doctor isolation contract gate
        run: python qa/doctor-isolation-contract-gate.py
