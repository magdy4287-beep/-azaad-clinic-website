name: Azaad Scheduling V2 Gate

on:
  pull_request:
    paths:
      - 'admin.html'
      - 'scheduling-v2.js'
      - 'scheduling-v2-waiting.js'
      - 'qa/scheduling-v2-gate.py'
      - '.github/workflows/scheduling-v2-gate.yml'
  push:
    branches: [main, feat/scheduling-v2-ui]
    paths:
      - 'admin.html'
      - 'scheduling-v2.js'
      - 'scheduling-v2-waiting.js'
      - 'qa/scheduling-v2-gate.py'
      - '.github/workflows/scheduling-v2-gate.yml'

permissions:
  contents: read

jobs:
  scheduling-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate Scheduling V2
        run: python qa/scheduling-v2-gate.py
