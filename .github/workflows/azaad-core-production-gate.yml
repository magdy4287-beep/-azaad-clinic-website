name: AZAAD Core Production Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/azaad-engineering-control-plan-20260817
  workflow_dispatch:

concurrency:
  group: azaad-core-production-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  control-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate control-plan source of truth
        shell: bash
        run: |
          set -euo pipefail
          test -s Azaad_ENGINEERING_CONTROL_PLAN.md || test -s AZAAD_ENGINEERING_CONTROL_PLAN.md
          test -s qa/azaad-phase5-checkin-gate.py
          test -s qa/azaad-phase6-doctor-workspace-gate.py
          test -s qa/azaad-phase7-assessment-gate.py
          test -s qa/azaad-scheduling-phase4-gate.py
          test -s qa/azaad-phase8-billing-gate.md
          test -s qa/azaad-phase9-refund-gate.md
          test -s qa/azaad-phase10-finance-gate.md
          test -s qa/azaad-phase12-security-audit-gate.md
          echo 'Core control-plan artifacts: PASS'

      - name: Validate non-negotiable refund invariant
        shell: bash
        run: |
          set -euo pipefail
          refund_gate='qa/azaad-phase9-refund-gate.md'
          grep -q 'Doctor approval requires' "$refund_gate"
          grep -q 'Management/Owner approval requires prior Doctor approval' "$refund_gate"
          grep -q 'Requester cannot approve' "$refund_gate"
          grep -q 'Processing requires both Doctor and Management/Owner approvals' "$refund_gate"
          grep -q 'Trigger functions that enforce the hierarchy are not executable by PUBLIC/anon/authenticated clients' "$refund_gate"
          grep -q 'process_refund.*server-side guarded' "$refund_gate"
          echo 'Refund hierarchy invariant: PASS'

      - name: Validate security contract invariants
        shell: bash
        run: |
          set -euo pipefail
          security_gate='qa/azaad-phase12-security-audit-gate.md'
          grep -q 'SECURITY DEFINER' "$security_gate"
          grep -q 'search_path' "$security_gate"
          grep -q 'RLS' "$security_gate"
          grep -q 'AI cannot bypass' "$security_gate"
          grep -q 'least-privilege permissions' "$security_gate"
          echo 'Security contract invariants: PASS'

      - name: Validate production gate language
        shell: bash
        run: |
          set -euo pipefail
          plan=$(find . -maxdepth 2 -iname '*ENGINEERING_CONTROL_PLAN.md' -print -quit)
          test -n "$plan"
          grep -q 'GitHub' "$plan"
          grep -q 'Vercel' "$plan"
          grep -q 'Supabase' "$plan"
          grep -q 'Codex Security' "$plan"
          grep -q 'Frontend Testing' "$plan"
          grep -q 'Production Gates' "$plan"
          grep -q 'AI must never approve a refund' "$plan"
          echo 'Production gate contract: PASS'
