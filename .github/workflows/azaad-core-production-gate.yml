name: AZAAD Core Production Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/azaad-engineering-control-plan-20260817
  workflow_dispatch:

concurrency:
  group: azaad-core-production-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  control-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate control-plan source of truth
        shell: bash
        run: |
          set -euo pipefail
          plan=""
          for candidate in Azaad_ENGINEERING_CONTROL_PLAN.md AZAAD_ENGINEERING_CONTROL_PLAN.md; do
            if [ -s "$candidate" ]; then plan="$candidate"; break; fi
          done
          test -n "$plan"
          test -s qa/azaad-phase5-checkin-gate.py
          test -s qa/azaad-phase6-doctor-workspace-gate.py
          test -s qa/azaad-phase7-assessment-gate.py
          test -s qa/azaad-scheduling-phase4-gate.py
          test -s qa/azaad-phase8-billing-gate.md
          test -s qa/azaad-phase9-refund-gate.md
          test -s qa/azaad-phase10-finance-gate.md
          test -s qa/azaad-phase12-security-audit-gate.md
          echo "Core control-plan artifacts: PASS"

      - name: Validate non-negotiable refund invariant
        shell: bash
        run: |
          set -euo pipefail
          refund_gate='qa/azaad-phase9-refund-gate.md'
          grep -Fq 'Doctor approval requires' "$refund_gate"
          grep -Fq 'Management/Owner approval requires prior Doctor approval' "$refund_gate"
          grep -Fq 'Requester cannot approve' "$refund_gate"
          grep -Fq 'Processing requires both Doctor and Management/Owner approvals' "$refund_gate"
          grep -Fq 'Trigger functions that enforce the hierarchy are not executable by PUBLIC/anon/authenticated clients' "$refund_gate"
          grep -Fq 'process_refund' "$refund_gate"
          grep -Fq 'server-side guarded' "$refund_gate"
          echo 'Refund hierarchy invariant: PASS'

      - name: Validate security contract invariants
        shell: bash
        run: |
          set -euo pipefail
          security_gate='qa/azaad-phase12-security-audit-gate.md'
          grep -Fq 'SECURITY DEFINER' "$security_gate"
          grep -Fq 'search_path' "$security_gate"
          grep -Fq 'RLS' "$security_gate"
          grep -Fq 'AI cannot bypass' "$security_gate"
          grep -Fq 'least-privilege permissions' "$security_gate"
          echo 'Security contract invariants: PASS'

      - name: Validate production gate language
        shell: bash
        run: |
          set -euo pipefail
          plan=$(find . -maxdepth 2 -type f -iname '*ENGINEERING_CONTROL_PLAN.md' -print -quit)
          security_gate='qa/azaad-phase12-security-audit-gate.md'
          test -n "$plan"
          grep -Fq 'GitHub' "$plan"
          grep -Fq 'Supabase' "$plan"
          grep -Fq 'Codex Security' "$plan"
          grep -Fq 'Frontend Testing' "$plan"
          grep -Fq 'Production Gates' "$plan"
          grep -Fq 'AI cannot bypass clinical/financial authorization' "$security_gate"
          echo 'Production gate contract: PASS'
