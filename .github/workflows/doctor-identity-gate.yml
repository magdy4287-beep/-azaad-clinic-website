name: Azaad Doctor Identity Gate

on:
  pull_request:
    paths:
      - 'qa/doctor-identity-contract-gate.py'
      - 'doctor-staff-binding.js'
      - 'doctor-staff-convert.js'
      - 'doctor-dashboard.js'
      - 'api/admin-auth.js'
  push:
    branches: [main]
    paths:
      - 'qa/doctor-identity-contract-gate.py'
      - 'doctor-staff-binding.js'
      - 'doctor-staff-convert.js'
      - 'doctor-dashboard.js'
      - 'api/admin-auth.js'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate doctor identity contract
        run: python3 qa/doctor-identity-contract-gate.py
