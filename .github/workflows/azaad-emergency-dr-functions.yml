name: AZAAD Emergency DR - Edge Functions

# DR evacuation workflow: source archival only; activation remains disabled until reconciliation.

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact emergency candidate ref whose function sources must be evacuated
        required: true
        default: 7668b6296d332a4693c1f930e6411d3e8fc77b25
        type: string
  push:
    branches:
      - emergency/supabase-evacuation
    paths:
      - scripts/azaad-supabase-functions-to-appwrite.sh
      - .github/workflows/azaad-emergency-dr-functions.yml

permissions:
  contents: read

concurrency:
  group: azaad-emergency-dr-functions
  cancel-in-progress: false

env:
  CANDIDATE_REF: ${{ inputs.candidate_ref || '7668b6296d332a4693c1f930e6411d3e8fc77b25' }}

jobs:
  edge-functions:
    name: Evacuate all Supabase Edge Function source trees to Appwrite Storage
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout emergency runner revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load exact candidate function sources
        shell: bash
        run: |
          set -euo pipefail
          runner_sha="$(git rev-parse HEAD)"
          raw_ref="$CANDIDATE_REF"
          candidate_ref="${raw_ref#candidate_ref:}"
          candidate_ref="$(printf '%s' "$candidate_ref" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          test -n "$candidate_ref"
          git fetch --no-tags --depth=1 origin "$candidate_ref"
          candidate_sha="$(git rev-parse FETCH_HEAD)"
          echo "runner_sha=$runner_sha"
          echo "candidate_sha=$candidate_sha"
          echo "candidate_ref=$candidate_ref"
          rm -rf supabase/functions
          git checkout "$candidate_sha" -- supabase/functions
          test -d supabase/functions
          test -f scripts/azaad-supabase-functions-to-appwrite.sh
          echo "candidate_source_sha=$candidate_sha" >> "$GITHUB_ENV"

      - name: Verify evacuation secrets
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in APPWRITE_ENDPOINT APPWRITE_PROJECT_ID APPWRITE_API_KEY; do
            if [ -z "${!name:-}" ]; then echo "MISSING_SECRET=$name"; missing=1; else echo "PRESENT_SECRET=$name"; fi
          done
          if [ "$missing" -ne 0 ]; then echo 'FAIL-CLOSED: required Appwrite Storage evacuation secrets are not configured.'; exit 78; fi

      - name: Inventory discovered candidate Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          count="$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -print | wc -l | tr -d ' ')"
          echo "source_function_count=$count"
          if [ "$count" -lt 1 ]; then echo 'FAIL-CLOSED: no candidate Edge Function source trees discovered.'; exit 1; fi
          find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort

      - name: Archive every discovered Edge Function source tree to Appwrite Storage
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        shell: bash
        run: bash scripts/azaad-supabase-functions-to-appwrite.sh

      - name: Upload evacuation manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azaad-functions-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azaad-functions-migration/manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed unless every discovered source tree reconciles
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/azaad-functions-migration/manifest.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          if(m.status!=='PASS'||m.mode!=='FUNCTION_SOURCE_EVACUATION') throw new Error('invalid evacuation manifest');
          if(!Number.isInteger(m.source_functions)||m.source_functions<1||m.migrated_functions!==m.source_functions) throw new Error(`function source reconciliation failed: source=${m.source_functions} migrated=${m.migrated_functions}`);
          if(!Array.isArray(m.results)||m.results.length!==m.source_functions) throw new Error('missing per-function reconciliation results');
          for(const r of m.results) if(r.status!=='ARCHIVED'||!r.source_archive_sha256||!r.file_id) throw new Error(`invalid archive result for ${r.id}`);
          console.log(`PASS: Edge Function source trees archived ${m.migrated_functions}/${m.source_functions}`);
          console.log(`candidate_source_sha=${process.env.candidate_source_sha||'not-exported'}`);
          NODE
