name: AZAAD Emergency DR - Edge Functions

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact emergency candidate ref to evacuate
        required: true
        default: emergency/supabase-evacuation
        type: string

permissions:
  contents: read

concurrency:
  group: azaad-emergency-dr-functions
  cancel-in-progress: false

env:
  CANDIDATE_REF: ${{ inputs.candidate_ref }}

jobs:
  edge-functions:
    name: Evacuate all Supabase Edge Functions to Appwrite
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact emergency candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 1

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate_sha"
          echo "candidate_ref=$CANDIDATE_REF"
          test -d supabase/functions
          test -f scripts/azaad-supabase-functions-to-appwrite.sh

      - name: Verify Edge Functions migration secrets
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in APPWRITE_ENDPOINT APPWRITE_PROJECT_ID APPWRITE_API_KEY; do
            if [ -z "${!name:-}" ]; then echo "MISSING_SECRET=$name"; missing=1; else echo "PRESENT_SECRET=$name"; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'FAIL-CLOSED: required Appwrite Functions migration secrets are not configured.'
            exit 78
          fi

      - name: Inventory source Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          count="$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -print | wc -l | tr -d ' ')"
          echo "source_function_count=$count"
          test "$count" -gt 0
          find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort

      - name: Migrate every Supabase Edge Function to Appwrite
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        shell: bash
        run: bash scripts/azaad-supabase-functions-to-appwrite.sh

      - name: Upload Edge Functions reconciliation manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azaad-functions-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azaad-functions-migration/manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed unless every Edge Function reconciles
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/azaad-functions-migration/manifest.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          if(m.status!=='PASS') throw new Error('manifest status is not PASS');
          if(!Number.isInteger(m.source_functions)||!Number.isInteger(m.migrated_functions)||m.source_functions<=0||m.source_functions!==m.migrated_functions) {
            throw new Error(`function reconciliation failed: source=${m.source_functions} migrated=${m.migrated_functions}`);
          }
          for(const r of m.results||[]) {
            if(r.status!=='READY'||r.activated!==false||!r.source_archive_sha256) throw new Error(`invalid reconciliation result for ${r.id}`);
          }
          console.log(`PASS: Edge Functions reconciled ${m.migrated_functions}/${m.source_functions}`);
          NODE
