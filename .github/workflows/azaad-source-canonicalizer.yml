name: AZAAD Source Canonicalizer

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Canonicalize source from the existing deterministic transform chain
        run: python3 qa/vercel-build.py

      - name: Commit only deterministic canonical source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- . ':!.github/workflows/azaad-source-canonicalizer.yml'; then
            echo 'SOURCE-CANONICALIZER: already canonical'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/azaad-source-canonicalizer.yml
          git commit -m 'chore: materialize canonical production source'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
