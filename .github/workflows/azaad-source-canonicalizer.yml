name: AZAAD Temporary Source Canonicalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize only the existing canonical transform inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, subprocess
          source = open('qa/vercel-build.py', encoding='utf-8').read()
          tree = ast.parse(source)
          value = next(n.value for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'TRANSFORM_STEPS' for t in n.targets))
          steps = ast.literal_eval(value)
          for command in steps:
              print('[AZAAD canonical-source]', ' '.join(command), flush=True)
              subprocess.run(command, check=True)
          PY
      - name: Commit only the materialized canonical source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git reset -- .github/workflows/azaad-source-canonicalizer.yml
          if git diff --cached --quiet; then
            echo 'SOURCE-CANONICALIZER: no source drift remains'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: materialize canonical production source [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
