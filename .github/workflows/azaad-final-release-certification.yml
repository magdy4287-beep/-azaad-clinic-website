name: AZAAD Final Release Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-release-certification:
    name: Final Release / Go-Live Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Exact commit lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Certified candidate: $GITHUB_SHA"

      - name: Required certification evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          test -s AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          test -s AZAAD_ENGINEERING_CONTROL_PLAN.md
          test -s AZAAD_CONTROLLED_EVOLUTION_FEATURE_DELIVERY_PLAN.md
          test -s .github/workflows/azaad-ai-gate.yml
          test -s .github/workflows/azaad-release-governance-gate.yml
          test -s .github/workflows/azaad-operations-health.yml
          grep -Fq 'AI-First • Free-Only • Safety-Gated • Continuous Delivery' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'AI is assistive only' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'A missing or stale evidence item is `NOT PROVEN`, not PASS.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'Refund Request → Doctor Approval → Management/Owner Approval → Refund Execution' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          grep -Fq 'Evidence must correspond to the exact production commit under certification.' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md

      - name: One-time workflow safety
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/workflows/*one-time*.yml .github/workflows/*once*.yml; do
            [ -e "$file" ] || continue
            ! grep -Eq '^\s*(push|schedule|pull_request|pull_request_target):' "$file"
            ! grep -Eq '^\s*(secrets:|environment:)' "$file"
          done
          echo 'One-time workflow hygiene: PASS'

      - name: AI and human-approval boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'AI must never:' AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -Fq '100% free-only' AZAAD_PRODUCTION_HARDENING_UAT_RELEASE_OPERATIONS.md
          grep -Fq 'AI is assistive only' AZAAD_PRODUCTION_CERTIFICATION_CONTINUOUS_OPERATIONS_PLAN.md
          echo 'AI / Free-Only / Human-Approval boundary: PASS'

      - name: Final release decision
        shell: bash
        run: |
          set -euo pipefail
          echo 'AZAAD FINAL RELEASE CERTIFICATION: PASS'
          echo "Exact commit: $GITHUB_SHA"
          echo 'Go-Live gate evidence generated by this exact-commit workflow.'
