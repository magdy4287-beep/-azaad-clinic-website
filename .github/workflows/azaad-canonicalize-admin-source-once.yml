name: AZAAD Canonicalize Admin Source Once

on:
  push:
    branches:
      - chore/zero-supabase-retirement-20260913

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove remaining legacy provider text from admin source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.js')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'Supabase Auth + RLS': 'Appwrite session + API boundaries',
              'Username Login through staff-login Edge Function': 'Username/password login through the Admin Auth API',
              '   - NEVER store Supabase Service Role Key here.\n': '   - Authentication is handled by the Appwrite-backed Admin Auth API.\n',
              '   - Only the Supabase Publishable Key is used.\n': '   - Browser sessions use the server-owned HttpOnly session cookie.\n',
              '   - Username/password authentication is handled by the\n     secured staff-login Edge Function.\n': '',
              '   SUPABASE\n': '   APPWRITE / API BOUNDARIES\n',
              '"Supabase query error:"': '"Admin query error:"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          p = Path('admin.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('تسجيل الدخول بحساب الموظف عبر Supabase Auth', 'تسجيل الدخول بحساب الموظف عبر نظام المصادقة الآمن')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify admin source has no legacy provider marker
        run: |
          ! grep -RniE 'supabase|staff-login|functions/v1|@supabase' admin.js admin.html

      - name: Commit canonical source
        shell: bash
        run: |
          if git diff --quiet -- admin.js admin.html; then
            echo 'ADMIN SOURCES ALREADY CANONICAL'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.js admin.html
          git commit -m 'chore: remove remaining legacy provider markers from admin source'
          git push origin HEAD:${GITHUB_REF_NAME}
