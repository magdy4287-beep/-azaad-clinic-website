name: Azaad Central Scheduling Gate
on:
  pull_request:
    paths:
      - 'central-scheduling-contract.js'
      - 'central-scheduling-center.js'
      - 'qa/central-scheduling-contract-gate.py'
      - '.github/workflows/central-scheduling-gate.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Central Scheduling contract
        run: python qa/central-scheduling-contract-gate.py
