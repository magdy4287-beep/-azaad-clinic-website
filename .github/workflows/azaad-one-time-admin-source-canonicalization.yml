name: AZAAD One-Time Admin Source Canonicalization

on:
  push:
    branches:
      - chore/zero-supabase-retirement-20260913

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.ref == 'refs/heads/chore/zero-supabase-retirement-20260913'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: chore/zero-supabase-retirement-20260913
          fetch-depth: 0

      - name: Run canonical admin source transforms
        run: |
          set -euo pipefail
          python3 qa/finalize-appwrite-admin-auth.py
          python3 qa/finalize-admin-browser-runtime-reference-boundary.py
          python3 qa/finalize-staff-management-appwrite.py
          python3 qa/retire-legacy-admin-staff-runtime.py
          python3 qa/finalize-appwrite-browser-session-contract.py
          python3 qa/finalize-admin-staff-caller-boundary.py
          python3 qa/final-admin-restore-boundary.py
          python3 qa/finalize-staff-management-runtime-boundary.py

      - name: Prove generated source is the new canonical source
        run: |
          set -euo pipefail
          test -s admin.js
          ! grep -Eiq 'supabase|functions/v1/(staff-login|staff-admin)|@supabase/supabase-js|derofsthjivlkcdnojww' admin.js
          ! grep -Eiq 'supabase|functions/v1/(staff-login|staff-admin)|@supabase/supabase-js|derofsthjivlkcdnojww' admin.html

      - name: Commit canonical source only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.js admin.html
          if git diff --cached --quiet; then
            echo 'No canonical source changes were produced.'
            exit 1
          fi
          git commit -m 'refactor: canonicalize admin source for Appwrite and Neon'
          git push origin HEAD:chore/zero-supabase-retirement-20260913

      - name: Verify committed source in working tree
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --short)"
          ! grep -Eiq 'supabase|functions/v1/(staff-login|staff-admin)|@supabase/supabase-js|derofsthjivlkcdnojww' admin.js
          ! grep -Eiq 'supabase|functions/v1/(staff-login|staff-admin)|@supabase/supabase-js|derofsthjivlkcdnojww' admin.html
